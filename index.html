Этот ясный путь ведет к Аллаху и заканчивается в Раю, а пройти по нему может только тот, кто познает истину и будет следовать ей в жизни. Это означает также: приведи нас к прямому пути и веди по нему. Первое подразумевает обращение в Ислам и отречение от всех других верований. Второе – изучение законов религии и применение их в своей жизни. Эта молитва является одной из самых полезных, глубоких и всесторонних молитв в исламе. Аллах обязал людей взывать к Нему этими словами в каждом ракаате намаза, потому что каждый человек нуждается в Его помощи).","@ar:7. صِرَاطَ الَّذ۪ينَ اَنْعَمْتَ عَلَيْهِمْۙ","@ar:غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلاَ الضَّٓالّ۪ينَ","«Сырааталь-лязийна ан‘амта ‘аляйхим, гайриль-магдууби ‘аляйхим ва ляддооллиин» (Путем тех, кого Ты облагодетельствовал, не тех, на кого пал гнев, и не путем заблудших. Прямой путь – это путь пророков, посланников, павших за веру и праведников, которых облагодетельствовал Всевышний Аллах. Это – не путь тех, которые попали под Его гнев за то. что узрели истину, но отвернулись от нее, подобно иудеям и им подобным. И это не путь заблудших, которые отвернулись от истины по причине своего невежества и заблуждения, подобно христианам и им подобным).","Сура «аль-Фатиха» – самая ценная сура Корана, поскольку в ней затрагиваются основные положения нашей религии. Пророк Мухаммад (салляллаху алейхи ва саллям) называл ее самой великой сурой Корана, ибо она исцеляет и внутренние, и телесные болезни.","В хадисе рассказывается о том, что вождя одного племени ужалил скорпион. Один из сподвижников Пророка (салляллаху алейхи ва саллям) прочитал ему «аль-Фатиху» и от укуса не осталось следа. Когда Пророк (салляллаху алейхи ва саллям) узнал об этом, он спросил: «Откуда ты узнал, что она (сура «аль-Фатиха») служит для исцеления (рукья)?» Он похвалил его, и приказал поделить между всеми сподвижниками стадо овец, которые были подарены вождем племени, и одну из них отдать ему.[3]","Также передано, что во времена Пророка (салляллаху алейхи ва саллям) дядя Хариджа Ибн Салт ат-Тамими (радыйаллаху анху) прибыл в селение, где был сумасшедший, которого держали на цепи. Его семья обратилась к нему: «Нет ли у тебя средства, которое поможет вылечить этого сумасшедшего? Нам сказали, что Пророк (салляллаху алейхи ва саллям) принес с собой благо». Дядя Хариджа три дня читал ему «аль-Фатиху», и этот человек выздоровел. Дядю Ат-Тамими наградили сотней баранов. Он возвратился к Посланнику Аллаха (салляллаху алейхи ва саллям) и рассказал о произошедшем. Пророк (салляллаху алейхи ва саллям) сказал о дозволенности этих баранов, ибо, в отличие от тех, кто ест то, что получил за запретное лечение, он исцелил больного дозволенным средством.[4]","Дорогие мусульмане!","Давайте трудится, чтобы уметь читать, понимать Священный Коран и жить согласно нашей Священной Книге, которая начинается с суры «аль-Фатиха». Приглашаем вас в нашу мечеть на уроки по обучению чтению Корана, а также «Основам религиозных знаний», «Жизни Пророка (салляллаху алейхи ва саллям)». Приходите сами, приводите с собой своих детей и близких.","Пусть мы все будем из числа тех счастливых рабов Аллаха, которых Он удостоил милости найти прямой путь и следовать по нему до самого последнего вздоха, умереть в имане, заслужить Его довольство и прощение и войти в сады Рая вместе с Его праведным рабами! Аминь!"]}]}}},
{"id":30,"collection":"c1","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Празднование ночи Мирадж","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:سُبْحَانَ الَّذٖٓي اَسْرٰى بِعَبْدِهٖ لَيْلاً مِنَ الْمَسْجِدِ الْحَرَامِ اِلَى الْمَسْجِدِ الاَْقْصَا الَّذٖي بَارَكْنَا حَوْلَهُ لِنُرِيَهُ مِنْ اٰيَاتِنَا اِنَّهُ هُوَ السَّمٖيعُ الْبَصٖيرُ","Уважаемые братья и сестры!","«Ляйлятуль-Исра валь-мирадж» – это ночь чудесного перенесение Пророка Мухаммада (салляллаху алейхи ва саллям) из Мекки в Масджидуль-Акса (Иерусалим) и вознесение его на небеса до уровня, о котором нет знания ни у ангелов, ни у джинов, ни у людей. Чудесное вознесение – это божественный подарок нашему Пророку (салляллаху алейхи ва саллям), милость, дарованная Аллахом после череды тяжелейших испытаний, вмещенная в границы божественных измерений, находящихся за пределами человеческого восприятия. В это путешествие, длившееся всего несколько мгновений, за которые не успела вытечь вода из опрокинутого кувшина, вместились миллиарды человеческих жизней, а взору открылось множество разных картин. Это событие известно как «Ляйлятуль-Исра валь-Мирадж». В Коране о чудесном вознесении пророка Мухаммада (салляллаху алейхи ва саллям) Всевышний Аллах сказал:","«Пречист Тот, Кто перенес ночью Своего раба, чтобы показать ему некоторые из Наших знамений, из Заповедной мечети в мечеть аль-Акса, окрестностям которой Мы даровали благословение. Воистину, Он – Слышащий, Видящий» (сура «аль-Исра», 1).","Дорогие братья и сестры!","Когда Посланник Аллаха (салляллаху алейхи ва саллям) отдыхал возле Каабы, находясь в состоянии между явью и сном, перед ним неожиданно появился ангел Джибриль (алейхиссалям) и рассек его грудь. Без крови и боли он извлек сердце из груди Пророка (салляллаху алейхи ва саллям), омыл его трижды в золотом тазу, а затем наполнил мудростью и верой. После этого вернул сердце на прежнее место, сжал грудь и оно стало биться. Потом к Пороку (салляллаху алейхи ва саллям) подвели животное белого цвета под названием «аль-Бурак», которое было меньше мула, но больше осла. Оно одним прыжком могло достигать цели, которую мог видеть его взор. В сопровождении Джибриля (алейхиссалям) они перенеслись в Иерусалим, в мечеть аль-Акса. Посланник Аллаха (салляллаху алейхи ва саллям) совершил там два ракаата намаза вместе со всеми пророками, будучи имамом в этой молитве.","Потом они вознеслись на Первое небо. Когда открылись небесные врата, они увидели пророка Адама (алейхиссалям), который поприветствовал Пророка (салляллаху алейхи ва саллям) и попросил у Аллаха для него блага.","После этого они вознеслись ко Второму небу. Там они встретили пророка Ису, сына Марьям и Яхью ибн Закарию, на Третьем они увидели пророка Юсуфа, которому была дарована половина красоты мира, на Четвертом – пророка Идриса, на Пятом – пророка Харуна, на Шестом – пророка Мусу, на Седьмом – пророка Ибрахима (алейхимуссалям). После этого Посланник Аллаха (салляллаху алейхи ва саллям) вместе с Джибрилем дошел до места «Сидратуль-Мунтаха» – предела всего, чего можно достичь. Даже ни один ангел не может перейти этот рубеж. Джибриль, остановившись, сказал: «Тут заканчивается моя степень. О Любимец Аллаха, если я сделаю еще один шаг, то сгорю».","Далее Пророк (салляллаху алейхи ва саллям) проследовал один. Перед ним открылись завесы, и он увидел великое множество таинств и знамений Творца. Он увидел величие и красоту Аллаха. И Всевышний обратился к нему, говоря без посредника и проявляя к нему почтение.","Уважаемые братья и сестры!","Во время вознесения Пророку (салляллаху алейхи ва саллям) были показаны Рай с его наслаждениями и Ад с его мучениями. Ему были переданы последние аяты суры «аль-Бакара» и повелено совершение обязательного пятикратного намаза для его уммы.","Дорогие братья!","Принято считать, что Мирадж пророка Мухаммада (салляллаху алейхи ва саллям) к Всевышнему Господу произошел 27-го Раджаба.","Несомненно, вознесение – это исключительная честь, дарованная Аллахом только пророку Мухаммаду (салляллаху алейхи ва саллям). Ночь, в которую он был благословлен этой бесподобной честью, была одной из величайших ночей в истории этого мира.","Но в Исламе существуют свои принципы в подходе к историческим и религиозным событиям. Ни Коран, ни Сунна не предписывают нам отмечать события прошлого, сколь бы значительными они ни были. В Исламе предписаны только два ежегодных праздника: «Ид-аль-фитр» (Праздник разговения) и «Ид-аль-адха» (Праздник жертвоприношения). У обоих праздников есть определенная дата и установленные богослужения и обряды.","Что касается великих достижений предшествующих поколений, то поминание о них не следует ограничивать отдельным днем или отдельной ночью. Их достижения нужно вспоминать ежедневно путем следования их учению и великим примерам.","Дорогие братья и сестры!","Празднование 27-й ночи месяца Раджаб как «Ночи Вознесения» (ночи Мирадж) не основано ни на Сунне, ни на действиях благородных сподвижников, поэтому не является сунной. 27-я ночь месяца Раджаб не подобна по значимости ни Ночи Могущества (Ляйлят-уль-кадр), ни ночи Бараат, на особые достоинства которых указывают Коран и Сунна.","Среди ученых существуют разногласия и в отношении даты этого события, что означает, что не установлено каких-то особых поклонений, которые нужно совершать именно этой ночью. Если хочется провести эту ночь в поклонении, можно совершать дополнительные намазы, читать Коран, зикры, совершать дуа и т.д.","Но это не следует делать с убеждением, что за совершение ибадата в эту ночь будет какое-то особое вознаграждение (Фатава Махмудийя, 3/283-285, Фарукия), (Исламские месяцы, 49-63, Маариф).","Аллах знает лучше."]}]}}},
{"id":31,"collection":"c3","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура Фатыр, 35/15.","Сура ат-Такасур, 102/8.","Аль-Хайсеми, Маджмауз заваид, 3/62; аль-Мааридж, 70/24.","Бухари, Закят, 7; Тафсиру сура, 3/14; ибн Маджа, Закят, 2; Малик, Муватта, Закят, 22; Ахмад бин Ханбаль, 2/255. см. Коран, сура Алю Имран, 3/180.","Сура аль-Муминун, 23/4."],"bibliography":[],"versions":{"ru":{"title":"Закят","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا النَّاسُ أَنتُمُ الْفُقَرَاءُ إِلَى ٱللَّهِ وَاللَُّ هُوَ الْغَنِيُّ الْحَمِيدُ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:تَأْتِى الإِبِلُ عَلَى صَاحِبِهَا ، عَلَى خَيْرِ مَا كَانَتْ، إِذَا هُوَ لَمْ يُعْطِ فِيهَا حَقَّهَا ، تَطَؤُهُ بِأَخْفَافِهَا، وَتَأْتِى الْغَنَمُ عَلَى صَاحِبِهَا عَلَى خَيْرِ مَا كَانَتْ، إِذَا لَمْ يُعْطِ فِيهَا حَقَّهَا ، تَطَؤُهُ بِأَظْلاَفِهَا، وَتَنْطَحُهُ بِقُرُونِهَا","Дорогие братья и сестры!","По Исламу, материальные блага не принадлежат ни отдельному человеку, ни обществу. Все в мире принадлежит Всевышнему Аллаху. Человек пользуется материальными благами лишь определенное время. В Коране Аллах Всевышний повелевает:","«О люди! Вы нуждаетесь в Аллахе, тогда как Аллах – Богатый, Достохвальный».[1]","Верующий человек должен трепетно использовать блага, данные ему Творцом, ибо в один день он обязательно будет спрошен за них. В Коране сообщается:","«В тот день вы будете спрошены о благах».[2]","Уважаемые мусульмане!","Закят, являющийся одним из шести столпов Ислама, по сути, служит выражением благодарности Аллаху за дарованные блага. Это ежегодный обязательный налог в Исламе, который предписано выплачивать каждому состоятельному дееспособному мусульманину со своего имущества и доходов.","«Бери из их имущества пожертвования, чтобы ими очистить и возвысить их. Молись за них, ибо твои молитвы — успокоение для них. Воистину, Аллах — Слышащий, Знающий». (ат-Тауба, 9/103)","В повелении о выделении закята заключено множество благ.","Всевышний Аллах наделил людей различными способностями, по причине чего общество, с точки зрения материального достатка, состоит из людей, находящихся на разных ступенях социальной лестницы. В Коране повелевается:","«Совершайте намаз, выплачивайте закят и совершайте поклоны вместе с преклоняющимися». (аль-Бакара, 2/43)","«Вкушайте эти плоды, когда [сады] станут плодоносить, и давайте [нуждающимся] должное в день уборки». (аль-Ан’ам, 6/141)","То есть, богатым предписывается отдавать ту долю из своего имущества, которая предназначена бедным, что послужит равномерному распределению благ между людьми с разным достатком.","Уважаемые мусульмане!","Мудрость, заложенную в выплате закята состоятельными верующими, можно объяснить таким образом: во-первых, закят сближает состоятельных и бедных людей, ибо богатый будет испытывать радость от своей щедрости, а бедный будет переживать чувство любви и благодарности к богатому, не оставляя места зависти.","Во-вторых, благодаря закяту, человек, который не может зарабатывать себе на хлеб, обретает возможность вести полноценный образ жизни. Закят также оберегает общество от нищеты, а государство – от (финансовой) слабости. Посланник Аллаха (салляллаху алейхи ва саллям) говорил: «Горе богачам в Судный день, которые не помогали бедным! Бедные люди будут говорить: «О Господь! Богачи поступили с нами несправедливо, обделив нас тем, чем одарил нас Ты! Аллах прикажет: «Клянусь Своим могуществом, что Я вас приближу к Себе, а их отдалю от Себя!» После этих слов Пророк (салляллаху алейхи ва саллям) прочитал следующий аят: «которые выделяют известную долю своего имущества, для просящих и обездоленных».[3]","В-третьих, закят ограждает от скупости, делает человека щедрым и добрым, усиливает чувство сопереживания.","В-четвертых, закят – это форма выражения благодарности Аллаху за блага, дарованные Им. От выплаты закята средства не уменьшаются, а наоборот, приумножаются, и в дом приходит изобилие и благословение Господа. В Коране сказано:","«[Вспомни,] как возвестил ваш Господь: «Если вы будете благодарны, то я непременно умножу вам [милость]» (Ибрахим, 14/7).","Выплата закята подобна подрезке лишних ростков на плодовых деревьях. Если их не подрезать, то невозможно получить хороший урожай.","Уважаемые мусульмане!","Тех, кто отказывается выделять средства в качестве закята, Аллах Всевышний предупреждает о наказании:","«О вы, которые уверовали! Воистину, многие из ученых и монахов присваивают имущество людей неправым путем и сбивают [людей] с пути Аллаха. А тем, которые накапливают золото и серебро и не расходуют их на пути Аллаха, возвести [, Мухаммад, что ждет их] мучительное наказание. В тот день, когда в адском огне будет раскалено накопленное [золото и серебро] и ими заклеймены их лбы, бока и спины, [и им будет сказано]: «Вот то, что вы накопили для себя. Так вкусите же то, что вы копили!» (ат-Тауба, 9/34-35)","Посланник Аллаха (салляллаху алейхи ва саллям) говорил: «Если кто-либо не станет выплачивать закят с того имущества, которым одарил его Аллах, то это имущество в Судный день явится в образе скользкой змеи, у которой вместо глаз будет два черных пятна. Эта змея обернется вокруг шеи и, схватив его за челюсти, прошипит: «Я есть твое имущество, я есть твои накопленные средства». После этого Пророк прочитал следующий аят: «Те, которые скупы на полученное ими от Аллаха, пусть не думают, что скупость для них лучше. Напротив, она хуже для них. В День воскресения они будут закованы в ожерелья из того, что они жалели. Аллах наследует небеса и землю, и Аллах ведает о том, что вы совершаете».[4]","Пророк (салляллаху алейхи ва саллям) также говорил:","«(В День воскрешения) верблюды придут к своему хозяину в наилучшем виде, который они имели (в этом мире), и если он не отдавал с них должного, они станут топтать его своими ногами, и овцы придут к своему хозяину в наилучшем виде, который они имели (в этом мире), и если он не отдавал с них должного, они станут топтать его своими копытами и бодать своими рогами».","Уважаемые мусульмане!","Также важно, чтобы закят был отдан именно тем, кому он полагается. Помощь тем, кто действительно испытывает крайнюю нужду, является очень благородным и социально важным деянием. Поэтому следует проводить тщательное исследование и стараться выработать у себя чувствительность, благодаря которой можно по лицам узнать тех, кто находится в тяжелом материальном положении, так как это является важным повелением Аллаха:","«Mилocтыня пoлaгaeтcя нeимyщим, ĸoтopыe зaдepжaны нa пyти Aллaxa, ĸoтopыe задepжaны нa пyти Aллaxa [нe мoгyт ocтaвить cвoи дoмa], (и ĸoтopыe) нe мoгyт двигaтьcя пo зeмлe [идти или exaть ĸyдa-либo] (из-зa нexвaтĸи cpeдcтв, или слабости здоровья, ран, увечий и т.п.) или нe мoгyт пepeдвигaтьcя пo зeмлe. Heocвeдoмлeнный cчитaeт иx бoгaчaми пo пpичинe иx cĸpoмнocти. Tы yзнaeшь иx пo пpимeтaм: oни нe выпpa- шивaют y людeй милocтыню нacтoйчивo. Kaĸoe бы дoбpo вы ни изpacxoдoвaли, Aллax знaeт oб этoм» (аль-Бакара, 2/273).","«Воистину, преуспели верующие, … которые выплачивают закят».[5]","В сущности, доведение закята и милостыни до нужного «адресата» зависит от источника дохода или способа его приобретения. Иными словами, место назначения закята и милостыни представляют собой своеобразное зеркало, отражающее степень чистоты заработка.","Хотя, на первый взгляд, это поклонение выполняется с помощью материальных средств, но на самом деле является выражением внутренней красоты, достоинства и духовной зрелости верующего.","О Аллах, не позволяй нам никогда забывать о том, кто является истинным Хозяином всех благ, и о том, что в имуществе, дарованном нам, имеет доля бедных людей, принадлежащая им по праву. О Аллах, сделай нас из тех, кто отдает свои средства на Твоем пути, выражая благодарность за них и стремясь лишь к Твоему довольству. Аминь!"]}]}}},
{"id":32,"collection":"c3","sn":"Дорогие мусульмане!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Рамадан и пост","sections":[{"h":"","p":["@ar:اعوذ باللَّ من الشيطان الرجيم","@ar:بسم ٱللَّه الرحمن الرحيم","@ar:يَا اَيُّهَا الَّذٖينَ اٰمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذٖينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","@ar:صدق ٱللَّه العظيم وبلغنا رسوله النبي الكريم عَنْ كَعْبِ بْنِ عُجْرَةَ، قَالَ:","@ar:قال النبي صلى ٱللَّه عليه وسلم","@ar:«احْضَرُوا الْمِنْبَرَ» فَحَضَرْنَا فَلَمَّا ارْتَقَى دَرَجَةً قَالَ: «آمِينَ» ، فَلَمَّا ارْتَقَى الدَّرَجَةَ الثَّانِيَةَ قَالَ: «آمِينَ» فَلَمَّا ارْتَقَى الدَّرَجَةَ الثَّالِثَةَ قَالَ: «آمِينَ» ، فَلَمَّا نَزَلَ قُلْنَا: يَا رَسُولَ ٱللَّهِ لَقَدْ سَمِعْنَا مِنْكَ الْيَوْمَ شَيْئًا مَا كُنَّا نَسْمَعُهُ قَالَ: « إِنَّ جِبْرِيلَ عَلَيْهِ الصَّلاَةُ وَالسَّلاَمُ عَرَضَ لِي فَقَالَ: بُعْدًا لِمَنْ أَدْرَكَ رَمَضَانَ فَلَمْ يَغْفَرْ لَهُ قُلْتُ: آمِينَ، فَلَمَّا رَقِيتُ الثَّانِيَةَ قَالَ: بُعْدًا لِمَنْ ذُكِرْتُ عِنْدَهُ فَلَمْ يُصَلِّ عَلَيْكَ قُلْتُ: آمِينَ، فَلَمَّا رَقِيتُ الثَّالِثَةَ قَالَ: بُعْدًا لِمَنْ أَدْرَكَ أَبَوَاهُ الْكِبَرَ عِنْدَهُ أَوْ أَحَدُهُمَا فَلَمْ يُدْخِلاَهُ الْجَنَّةَ قُلْتُ: آمِينَ","@ar:صدق رسول ٱللَّه فيما قال أو كما قال","Дорогие мусульмане!","Хвала Всевышнему Аллаху, который дал нам возможность встретить благословенный месяц Рамадан, месяц обретения духовного изобилия!","Пусть наш Господь посредством наших постов и поклонений в этом месяце приведет нас к получению духовных наслаждений, отдалившись от наслаждений преходящих.","Держать пост – значит сдерживать свои желания. Смысловое значение поста в нашей религии – «поклонение с намерением, означающее воздержание от еды, питья и интимной близости от рассвета до захода солнца». Пост соблюдают только ради исполнения повеления Аллаха.","Пост, обучая нас терпению, проявлению силы воли и сдерживанию желаний, совершенствует нашу нравственность. Это поклонение является щитом, оберегающим честь и достоинство человека.","Пост не только укрепляет такие прекрасные качества, как терпение, стойкость, довольствование малым, удовлетворенность своим положением, но и напоминает о ценности имеющихся благ. Пост, заставляя задумываться о положении нуждающихся, делает наши сердца более чуткими, побуждая к состраданию и милосердию. Пост обновляет чувство благодарности. Пост, соответствующий этим критериям, способен удалить из жизни общества такие отрицательные явления, как ненависть, зависть и вражда, создающие социальную напряженность.","Пророк (салляллаху алейхи ва саллям) так говорил о ценности поста:","@ar:عَنْ أَبِي هُرَيْرَةَ رَضِيَ ٱللَّهُ عَنْهُ، قَالَ: قَالَ رَسُولُ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّم قال ٱللَّه عز وجل: كُلُّ عَمَلِ ابْنِ آدَمَ يُضَاعَفُ، الْحَسَنَةُ عَشْرُ أَمْثَالِهَا إِلَى سَبْعمِائَة ضِعْفٍ إِلاَّ الصَّوْمَ، فَإِنَّهُ لِي وَأَنَا أَجْزِي بِهِ، يَدَعُ شَهْوَتَهُ وَطَعَامَهُ مِنْ أَجْلِي “ “لِلصَّائِمِ فَرْحَتَانِ: فَرْحَةٌ عِنْدَ فِطْرِهِ، وَفَرْحَةٌ عِنْدَ لِقَاءِ رَبِّهِ “","«Каждое благое деяние человека имеет свойство увеличиваться. За одно благое дело записывается от десяти до семисот наград. Однако пост имеет особое значение, так как Всвышний Аллах повелел: “Пост является исключением из правил, потому что он соблюдается ради Меня. Я награжу человека за него так, как пожелаю. Мой раб ради Меня отказывается от пищи, питья, желаний плоти”.","Постящегося человека ожидают две радости: одна – при разговении, а вторая – при встрече с Его Господом. Запах, исходящий изо рта постящегося, для Аллаха дороже запаха благовоний». (Муслим, Сыям,164).","Дорогие братья и сестры!","Священный Рамадан является школой, в которой верующий проходит практическое обучение тому, как отдаляться от запрещенного и порицаемого не только в этом месяце, но и в течение всей жизни. Пост Рамадана также служит подготовительным периодом для тех, кто собирается совершить хадж.","Пост укрепляет духовность человека. Посредством поста человек входит в особую возвышенную духовную атмосферу и становится преградой для совершения грехов. Нет другого поклонения, столь же действенного в усмирении нафса и усилении духа.","Когда Абу Умама (радыйаллаху анху) попросил Посланника Аллаха (салляллаху алейхи ва саллям): «Посоветуй мне такое деяние, чтобы Всевышний Аллах наградил меня за него», – он ответил:","@ar:عن أبي أمامة رضي ٱللَّه عنه قال : أتيت رسول ٱللَّه صلى ٱللَّه عليه وسلم فقلت : مرني بأمر آخذه عنك ، فقال : (عليك بالصوم فإنه لا مثل له)","«Я советую тебе пост, поскольку нет подобного ему (поклонения)». (Насаи, Сыям, 43)","Дорогие верующие!","Пост в месяц Рамадан стал обязательным в месяц Ша’бан через полтора года после хиджры. Всевышний Аллах повелел держать обязательный пост в месяц Рамадан. Об этом в Священном Коране сказано:","@ar:يَا اَيُّهَا الَّذٖينَ اٰمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذٖينَ مِنْ قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","«О те, которые уверовали! Вам предписан пост, подобно тому, как он был предписан вашим предшественникам, – быть может, вы устрашитесь!» (аль-Бакара, 183)","@ar:شَهْرُ رَمَضَانَ الَّذٖى اُنْزِلَ فٖيهِ الْقُرْاٰنُ هُدًى لِلنَّاسِ وَبَيِّنَاتٍ مِنَ الْهُدٰى وَالْفُرْقَانِ فَمَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ وَمَنْ كَانَ مَرٖيضًا اَوْ عَلٰى سَفَرٍ فَعِدَّةٌ مِنْ اَيَّامٍ اُخَرَ يُرٖيدُ ٱللَّهُ بِكُمُ الْيُسْرَ وَلاَ يُرٖيدُ بِكُمُ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا ٱللَّه عَلٰى مَا هَدٰيكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ","«В месяц Рамадан был ниспослан Коран – верное руководство для людей, ясные доказательства из верного руководства и различение. Тот из вас, кого застанет этот месяц, должен поститься. А если кто болен или находится в пути, то пусть постится столько же дней в другое время. Аллах желает вам облегчения и не желает вам затруднения. Он желает, чтобы вы довели до конца определенное число дней и возвеличили Аллаха за то, что Он наставил вас на прямой путь. Быть может, вы будете благодарны». (аль-Бакара, 185)","Несомненно, что каждый день священного Рамадана – это новые открывающиеся возможности. Благородный Пророк (салляллаху алейхи ва саллям) говорил в одном из хадисов:","@ar:إِذَا دَخَلَ شَهْرُ رَمَضَانَ فُتِّحَتْ أَبْوَابُ السَّمَاءِ ، وَغُلِّقَتْ أَبْوَابُ جَهَنَّمَ ، وَسُلْسِلَتِ الشَّيَاطِينُ","«Когда наступает месяц Рамадан, открываются врата Рая, закрываются врата Ада, а шайтаны заковываются в цепи». (Бухари, Саум, 5, II, 227).","Для верующего, совершающего благие дела, открываются врата Рая и закрываются врата Ада. Посредством поста человек усмиряет свой «нафс» и не следует за шайтаном. Таким образом, шайтан оказывается скован по рукам и ногам и обезврежен.","Священный Рамадан – это время духовной весны и пробуждения, когда на души верующих нисходит духовное изобилие. Для тех, кто должным образом использует время Рамадана, – это моменты укрепления веры посредством поклонений и праведных деяний.","Однако в хадисе, который был прочитан в начале хутбы, Пророк (салляллаху алейхи ва саллям) предупреждает, в каком убытке будут те, кто не воспользовался предоставленными возможностями Рамадана. От Ка’ба бин Уджры передается:","«Когда Посланник Аллаха (салляллаху алейхи ва саллям) попросил нас занять места рядом с минбаром, мы сели прямо перед ним. Пророк (салляллаху алейхи ва саллям) поднялся на первую ступень и сказал: «Аминь!» Поднялся еще на одну ступень и снова сказал: «Аминь!» Потом поднялся еще на одну ступень и снова сказал: «Аминь!» Когда он спустился с минбара, мы сказали:","• О Посланник Аллаха! Сегодня мы услышали от вас то, чего не слышали раньше.","Он ответил:","• Когда я был на минбаре, явился Джибриль. Я был на первой ступени, и он сказал:","«Пусть будет проклят тот, кто достиг Рамадана и не был прощен!»","Я ответил: «Аминь!»","Когда я поднялся на вторую ступень, он сказал:","«Пусть будет проклят тот, кто не произносит «салават», когда упоминается твое имя!»","Я ответил: «Аминь!»","Когда я поднялся на третью ступень, он сказал:","«Пусть будет проклят тот, кто увидел старость своих родителей или одного из них и не заработал Рай!»","Я тоже ответил: «Аминь!» (Хаким, Мустадрак, IV, 170; Тирмизи т. 5, 3545)","Дорогие братья и сестры!","Во время поста нужно следить не только за тем, чтобы ничего не попало в рот, но и за словами, которые из него выходят. Мы должны остерегаться сплетен и нехороших высказываний, чтобы не погубить блага своего поста.","Те, кто лжет, сплетничает, сквернословит, соблюдая пост днем и отказываясь от разрешенной пищи, разговляются запрещенным, изрекая ложь и «поедая мясо» того, о ком сплетничают. Эти поступки духовно уродуют их посты, поскольку ложь, сплетни, сквернословие в адрес других людей хоть не нарушают пост, но лишают его достоинств и ожидаемого от него результата.","Намаз и пост, не достигающие своей цели, не приносят пользы человеку. Посланник Аллаха (салляллаху алейхи ва саллям) говорил о подобных поклонениях:","@ar:رُبَّ صَائِمٍ لَيْسَ لَهُ مِنْ صِيَامِهِ إِلاَّ الْجُوعُ، وَرُبَّ قَائِمٍ لَيْسَ لَهُ مِنْ قِيَامِهِ إِلاَّ السَّهَر","«Сколько есть постящихся, кому не достается от поста ничего, кроме голода! Сколько есть совершающих (таравих и тахаджуд) намаз, кому остается от намаза лишь бессонница!» (Ибн Маджа, Сыям, 21, I, 539)","Пусть наш Господь защитит нас от попадания в такое состояние. Чтобы от поста, который мы держим, нам не доставался только голод, нужно держать его только ради довольства Аллаха. Наш Пророк (салляллаху алейхи ва саллям) говорил:","@ar:عَنْ أَبِي هُرَيْرَةَ رَضِيَ ٱللَّهُ عَنْهُ، قَالَ: قَالَ رَسُولُ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ:«مَنْ لَمْ يَدَعْ قَوْلَ الزُّورِ وَالعَمَلَ بِهِ، فَلَيْسَ للَِِّ حَاجَةٌ فِي أَنْ يَدَعَ طَعَامَهُ وَشَرَابَهُ»","«Кто не оставит ложь и дела, основанные на лжи, то у Аллаха нет нужды в том, чтобы он оставил еду и питье». (Бухари, Саум, 8).","@ar:وَإِذَا كَانَ يَوْمُ صَوْمِ أَحَدِكُمْ فَلاَ يَرْفُثْ وَلاَ يَصْخَبْ، فَإِنْ سَابَّهُ أَحَدٌ أَوْ قَاتَلَهُ، فَلْيَقُلْ إِنِّي امْرُؤٌ صَائِمٌ”","«Когда наступит день поста, пусть никто из вас не ругается и не сквернословит. А если кто-то будет ругаться с вами или оскорблять вас, то скажите: “Я в посте!”» (Бухари, Саум, 9).","@ar:عَنْ أَبِي هُرَيْرَةَ رَضِيَ ٱللَّهُ عَنْهُ، أَنَّ رَسُولَ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَ:","@ar:الصِّيَامُ جُنَّةٌ فَلاَ يَرْفُثْ وَلاَ يَجْهَلْ»”","«Пост – это щит, оберегающий человека от грехов». (Бухари, Саум, 2).","Дорогие верующие!","Мы должны стараться сделать Рамадан и пост средством совершенствования других наших поклонений. Например, наших намазов. В этом благословенном месяце нужно проявлять еще большее усердие в ночных поклонениях.","Поскольку Рамадан является месяцем Корана, мы должны с еще большим вниманием и благоговением обратиться к Священной Книге. Мы должны читать Священный Коран с проникновенностью, обретать большую чуткость души посредством «зикра», стремиться к умиротворению сердца посредством «закята» и «садака». Поскольку Коран был ниспослан на небо дольного мира в месяц Рамадан, мы должны принять руководство Корана и наполнять это время поклонениями.","@ar:شَهْرُ رَمَضَانَ الَّذِيَ أُنزِلَ فِيهِ الْقُرْآنُ هُدًى لِّلنَّاسِ وَبَيِّنَاتٍ مِّنَ الْهُدَى وَالْفُرْقَانِ فَمَن شَهِدَ مِنكُمُ الشَّهْرَفَلْيَصُمْهُ","«В месяц Рамадан был ниспослан Коран – верное руководство для людей, ясные доказательства из верного руководства и различение. Тот из вас, кого застанет этот месяц, должен поститься». (аль-Бакара, 185)","Дорогие верующие!","Наш Пророк (салляллаху алейхи ва саллям) сказал:","@ar:“لَهُ مَا تَقَدَّمَ مِنْ ذَنْبِه وَمَنْ صَامَ رَمَضَانَ إِيمَانًا وَاحْتِسَابًا غُفِرَ”","«Тому, кто с намерением держал пост в месяц Рамадан, ожидая награды от Аллаха, простятся прошлые грехи» (Бухари, Иман 28. II, 228; Муслим, Саляту’ль-Мусафирин, 13. II, 523).","Мы должны верить, что пост является повелением Всевышнего Аллаха, и ожидать награды только от Него.","Пост – это поклонение, приводящее постящегося к богобоязненности. Человек посредством богобоязненности защищает себя от огня Ада и приближается к Раю. Наш любимый Пророк (салляллаху алейхи ва саллям) сказал:","@ar:عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ رَضِيَ ٱللَّهُ عَنْهُ، قَالَ: سَمِعْتُ النَّبِيَّ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ:","@ar:«مَنْ صَامَ يَوْمًا فِي سَبِيلِ اللَِّ، بَعَّدَ ٱللَّهُ وَجْهَهُ عَنِ النَّارِ سَبْعِينَ خَرِيفًا","Сура «Фатыр», 5).","«Державшего пост один день ради Аллаха по причине этого одного дня поста Всевышний Господь отдалит от огня на семьдесят лет». (Бухари, Достоинство поста, 2840).","«Кто накормит постящегося «ифтаром», тот получит такую же награду, как постящийся (, при этом не убавив награды постящегося)»","Некоторые из бедных сподвижников сказали:","«Не каждый из нас в состоянии найти то, чем он смог бы накормить».","Пророк (салляллаху алейхи ва саллям) ответил им:","«Аллах дает такую награду тому, кто даст постящемуся даже один финик, глоток воды или молока». (Ибн Хузейма, 3/191-192; аль-Байхакы, «Шу’аб аль-иман», 7/215-217)","Дорогие братья и сестры!","• Пусть этот Рамадан станет новым началом намазов, если у нас есть недочеты в них.","• Пусть этот Рамадан станет началом правильного отчисления закята из самого лучшего имущества.","• Пусть этот Рамадан станет началом заботы о проблемах и нуждах мусульман.","• Пусть этот Рамадан станет началом исламской жизни в семье.","• Пусть этот Рамадан станет началом преодоления разногласий между нами, возрождения Ислама и образования единой уммы мусульман.","• Пусть этот Рамадан будет не месяцем простого голодания, а напоминанием о бедных, угнетенных и отчаявшихся людях на всей земле.","• Пусть этот Рамадан вновь станет началом нашего возвращения к Корану.","Дорогие братья и сестры!","Наш Господь, обещая, что Сам воздаст награду за пост, сокрыл в этом благую весть для верующих. Хочу завершить проповедь хадисом нашего Пророка (салляллаху алейхи ва саллям), который сообщает о том высоком положении и особом отношении, которое мы получим за пост:","@ar:عَنْ سَهْلٍ رَضِيَ ٱللَّهُ عَنْهُ، عَنِ النَّبِيِّ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَ: « إِنَّ فِي الجَنَّةِ بَابًا يُقَالُ لَهُ الرَّيَّانُ، يَدْخُلُ مِنْهُ الصَّائِمُونَ يَوْمَ القِيَامَةِ، لاَ يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ، يُقَالُ: أَيْنَ الصَّائِمُونَ؟ فَيَقُومُونَ لاَ يَدْخُلُ مِنْهُ أَحَدٌ غَيْرُهُمْ، فَإِذَا دَخَلُوا أُغْلِقَ فَلَمْ يَدْخُلْ مِنْهُ أَحَدٌ “","От Сахля (радыйаллаху анху) передается, что Пророк (салляллаху алейхи ва саллям) сказал:","«В Раю есть врата, которые называются Раййан. Через них в Судный день войдут только те, которые держали пост, никто кроме постившихся не войдет через них. (В Судный день) будет сказано: “Где постившиеся?” Постившиеся встанут и войдут через эти врата. Когда они зайдут, врата закроются, и с того момента никто более не сможет войти в них» (Бухари, Саум, 4).","Пусть Всевышний Аллах даст нам возможность достойно воспользоваться духовным богатством Священного Рамадана, дарует Свое прощение и покровительство, и позволит прожить этот месяц с бесконечным ощущением радости.","Аминь!"]}]}}},
{"id":33,"collection":"c3","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Ценность трех благословенных месяцев","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَٓا اَيُّهَا الَّذ۪ينَ اٰمَنُوا اتَّقُوا ٱللَّه وَلْتَنْظُرْ نَفْسٌ مَا قَدَّمَتْ لِغَدٍۚ وَاتَّقُوا ٱللَّه اِنَّ ٱللَّه خَب۪يرٌ بِمَا تَعْمَلُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:اَللّهُمَّ بَارِكْ لَنَا فيِ رَجَبٍ وَ شَعْبَانَ وَ بَلِّغْنَا رَمَضَان","Уважаемые братья и сестры!","Все в этом мире, в том числе время, создано Всевышним Творцом. Каждая минута – это божественный подарок, который надо использовать для достижения довольства Всевышнего Господа и Его Рая. Но при этом Всевышний Аллах некоторые периоды года облек Своей особой милостью и установил для них особые награды.","К таким ценным периодам года относятся три благословенных месяца – Раджаб, Ша’бан и Рамадан.","Анас бин Малик (радыйаллаху анху) передал, что Посланник Аллаха (салляллаху алейхи ва саллям) с наступлением месяца Раджаб произносил такую дуа:","«Аллахумма барик ляна фи Раджаба ва Шабан ва баллигна Рамадан!» («О Аллах, сделай для нас благодатными Раджаб и Шабан, и удостой нас встречи с Рамаданом!»)","Эти «сезоны особого божественного блага» мы каждый раз должны воспринимать как возможность для возрождения и очищения наших сердец и чаще вспоминать об этом божественном предостережении:","«О те, которые уверовали! Бойтесь Аллаха, и пусть душа посмотрит, что она приготовила на завтрашний день. Бойтесь Аллаха, ведь Аллах ведает о том, что вы совершаете». (аль-Хашр, 18)","Как следует из этого аята, ценность человека перед Всевышним Творцом определяется, в первую очередь, его поступками и поклонениями. Верующие, зная об особой ценности этих трех благословенных месяцев, стараются чаще держать дополнительные посты и совершать дополнительные поклонения в это время года.","Дорогие верующие!","В каждом из трех благословенных месяцев присутствуют благословенные ночи. В месяце Раджаб – Ночь Рагаиб и Ночь Ми’радж, в месяце Ша’бан – Ночь Бараат, а в месяце Рамадан – ночь, которая благословеннее тысячи месяцев – Ляйлятуль-Кадр.","Ночь – это время суток, наполненное особой божественной милостью, таинствами и дарами.","Ведь Священный Коран начал ниспосылаться ночью. Ночь ниспослания Корана стала лучшей из ночей, месяц ниспослания – лучшим из 12 месяцев, Пророк (салляллаху алейхи ва саллям), которому был ниспослан Коран, стал самым превосходным из всех пророков, а его община – избранной из всех общин.","Ночной перенос нашего Пророка (салляллаху алейхи ва саллям) – Ми’радж из мечети аль-Харам в Мекке в мечеть аль-Акса в Иерусалиме и вознесение на седьмое небо также происходили ночью.","В первые дни пророчества Пророку (салляллаху алейхи ва саллям) было направлено это божественное обращение:","«О закутавшийся! Простаивай ночь без малого половину ночи, или чуть меньше того, или чуть больше того...» (аль-Муззаммиль, 1-3)","Благородные сподвижники Посланника (салляллаху алейхи ва саллям), ставшие сердцевиной мусульманской общины, следуя его примеру, в течение всей жизни совершали намаз-тахаджуд (помимо обязательных пяти намазов):","«И читай его ночью, пробудившись ото сна, в дополнение к тому, что предписано тебе. Быть может, Господь твой возведет тебя на Достохвальное место» (аль-Исра, 79).","«Падай ниц пред Ним и славь Его долгой ночью» (аль-Инсан, 26).","«Они спали лишь малую часть ночи, а перед рассветом они молили о прощении» (аз-Зарийат, 17-18).","Дорогие мусульмане!","Три благословенных месяца наполнены духовностью нашего Пророка (салляллаху алейхи ва саллям) и Священного Корана. Для Посланника Аллаха (салляллаху алейхи ва саллям) ночь являлась одеянием, а Священный Коран – описанием его превосходных качеств. Посланник Аллаха (салляллаху алейхи ва саллям) является живым воплощением божественного слова.","Священный Коран начал ниспосылаться ночью. Наш Пророк (салляллаху алейхи ва саллям), во всем следуя его аятам, стал «поклоняющимся в ночи» и «правителем дня». Поэтому Посланник Аллаха (салляллаху алейхи ва саллям), Священный Коран и благо ночных поклонений слиты для нас воедино. Именно этот смысл мы вкладываем в слова «благословенные ночи».","Дорогие верующие!","Три благословенных месяца – это время для размышлений. Каждый, кто проводит время в поклонении, занят поиском ответов на вопросы:","«Кто я? Для чего пришел в этот мир? В чем тайна моего сотворения? Почему человек в свой срок неизбежно должен покинуть этот мир? Когда беспокойно на сердце, признак ли это того, что мы совершили грех? И если в душе – покой, является ли это следствием наших благих поступков? Что повелевает нам Коран? Почему от его чтения приходит покой в сердце? Почему люди веками не могут насытиться его словами? Почему Священный Коран никогда не устаревает и не теряет истинности?»","Три благословенных месяца – это время для самоотчета о прожитой жизни и подготовке к жизни будущей. Каждый должен спросить себя:","«Ты утверждаешь, что любишь Аллаха! А как ты выполняешь свои обязанности перед Господом?","Ты утверждаешь, что любишь Пророка (салляллаху алейхи ва саллям)! А соблюдаешь ли ты его Сунну?","Ты утверждаешь, что твоя Книга – Коран, а выполняешь ли ты его предписания и избегаешь ли то, что он запрещает?","Пользуясь благами Аллаха, благодаришь ли ты Его?","Ты говоришь, что Рай – это истина, а что ты приготовил для него?","Ты утверждаешь, что Ад – это истина, а насколько ты боишься его и отстраняешься от грехов?","Ты не сомневаешься, что смерть – это истина. Готов ли ты к ней прямо сейчас?","Есть множество грехов, в которых ты еще не покаялся, тогда почему ты занят выискиванием чужих недостатков?»","Вспомни тех, с кем ты проводил эти благословенные месяцы год назад. И подумай, кого уже нет рядом из твоих друзей, близких и родствнников.","Ты работаешь и живешь лишь для себя. А что ты сделал для того, чтобы распространился ислам?","Сколько ты утешил и накормил сирот? Воспитал ли ты ребенка, который будет служить всему человечеству своей жизнью и знанием?","Суметь совершить такой самоотчет – означает понять смысл благословенных дней, ночей и месяцев. Эти дни и ночи – величайшая возможность для того, чтобы раскаяться в грехах и очистить свою душу.","Дорогие братья и сестры!","Священный Рамадан – это месяц, когда божественное прощение нисходит бурным потоком на верующих. Наш Пророк (салляллаху алейхи ва саллям) говорил:","«Тому, кто будет поститься в месяц Рамадан, искренне веря и надеясь на вознаграждение, Аллах Всевышний простит прошлые грехи» (Бухари, Саум, 6);","Пусть Всевышний Аллах дарует нам возможность провести священный Рамадан в праведных поступках, которые станут для нас спасением в вечной жизни! Пусть Он по Своей милости сделает наш последний вздох наполненным умиротворением, дав нам возможность прожить жизнь в духовности Рамадана.","Аминь!"]}]}}},
{"id":34,"collection":"c3","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Священный Рамадан","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:لَوْ يَعْلَمُ الْعِبَادُ مَا فِي شَهْرِ رَمَضَانَ لَتَمَنَّى الْعِبَادُ أَنْ يَكُونَ شَهْرُ رَمَضَانَ سَنَةً","Дорогие братья и сестры!","Хвала Всевышнему Аллаху, удостоившему нас счастья вновь встретить священный месяц Рамадан!","Священный Рамадан – это месяц неисчислимых благ и милости в календаре жизни, божественная сокровищница духовных ценностей, дарованная общине пророка Мухаммада (салляллаху алейхи ва саллям).","В благородном хадисе сказано: «Если бы люди знали все достоинства месяца Рамадан, то пожелали бы, чтобы он длился целый год» (Хайсами, том III, стр. 141).","Священный Рамадан побуждает к более усердному, чем в другие месяцы, приобретению благ вечной жизни по причине исключительных возможностей, открывающихся в нем.","Священный Рамадан – это время сокращения мирских привязанностей и приближения к Всевышнему Аллаху.","Священный Рамадан является величайшей возможностью для восполнения духовных недостатков, которые мы допустили на протяжении года, исправления наших ошибок и благих начинаний, которые позволят нам провести дальнейшую часть жизни более достойно, чем предыдущую.","С каким величайшим чувством благодарности мы должны использовать бесценное время священного Рамадана, дарованное нам нашим Господом, а именно:","• Сосредоточиться на индивидуальных поклонениях, таких как намаз и пост;","• Усердствовать в поклонениях, связанных с социальной жизнью общества, таких как закят, благотворительность и фитр-садака, проявляя щедрость и милосердие, служа созданным ради их Создателя;","• Проявлять почтение к месяцу Рамадан, читая и изучая Священный Коран.","Все это станет замечательным проявлением благодарности в ответ на милость, оказанную Всевышним Аллахом.","Дорогие верующие!","Поклонение поста, совершаемое в священный месяц Рамадан, состоящее в воздержании от еды, питья и интимных отношений от рассвета до заката солнца, являются только явной, видимой его частью. Чтобы полноценно держать пост, необходимо, вместе с тем, проявлять тщательность и в духовной стороне поста.","Ведь пост не является просто голоданием или соблюдением диеты. Всевышний Аллах, повелевая:","«О те, которые уверовали! Вам предписан пост, подобно тому, как он был предписан вашим предшественникам, – быть может, вы будете богобоязненны» (аль-Бакара, 183), указывает, что целью поста является достижение богобоязненности.","Богобоязненность (таква) – это тщательное избегание любых состояний и поступков, которыми не доволен Всевышний Аллах из страха потерять Его довольство и любовь.","Если пост, который мы держим, не укрепляет нас в богобоязненности, нам следует пересмотреть и исправить наши поклонения и поступки, чтобы наш пост, поистине, стал для нас щитом от огня Ада.","Держать пост – значит крепко держать в узде все свои явные и скрытые грехи и недостатки, неприемлемые религией. Поэтому не только желудочно-кишечный тракт, но и глаза, уши, язык, сердце и все тело должны находиться в посте. Нам стоит обратить внимание:","Защищает ли пост наши глаза от взгляда на запретное?","Оберегает ли пост наши уши от того, что слышать нежелательно?","И главное – отстраняет ли он наш язык от лжи, сплетен, клеветы и пустословия? В такого рода разговорах следует держать пост молчания.","Как мы следим за тем, чтобы во время поста ничего не попало в наш рот, также следует внимательно следить за тем, чтобы ничто скверное не сходило с наших уст.","Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Пусть никто из вас не сквернословит и не повышает голос в день поста, а если кто-либо будет ругать вас или затевать с вами ссору, то скажите: “Поистине, я в посте”» (Бухари 1904, Муслим 1151).","Пост, соблюдаемый в месяц терпения, священный Рамадан, подобен ихраму, в который облачается душа. В состоянии ихрама запрещены «рафас», «фиск» и «джидаль», то есть интимные отношения, грехи, споры, гнев, выяснения отношений, причинение обид. Все эти действия также уменьшают награду и за пост. С этой точки зрения, душа постящегося должна облачиться в «духовный ихрам».","Дорогие мусульмане!","Священный Рамадан через соблюдаемый нами пост, через воздержание от пищи и воды, напоминает нам, что даже стакан воды и кусочек хлеба являются великим благом. Таким образом, мы еще лучше понимаем, насколько усердно нам следует благодарить Господа за дарованные нам бесчисленные блага.","Благодарность за каждое благо можно выразить не только словами, а чем-то подобным того же рода. Благодарность за слух – это отстранение от пустословия, сплетен, интриг и устремление к наполненным духовностью речам, таким как Священный Коран и духовные беседы.","Благодарность за зрение – это отстранение от выискивания недостатков людей, взгляда на запретное и устремление к наблюдению проявлений божественного могущества в окружающем мире.","Благодарность за сердце – это постоянное размышление о благах, данных Всевышним Аллахом, и постоянное поминание Его.","Дорогие братья и сестры!","Настоящий пост пробуждает в душах чувство милосердия. Он позволяет лучше понять состояние голодных, нуждающихся и находящихся в безвыходном положении людей, давая испытать чувство голода на определенное время.","С этой точки зрения, пост – это самый прекрасный переводчик беззвучных взываний, исходящих из душ бедствующих и нуждающихся людей. Это напоминание о том, что на нас лежит ответственность за неимущих и одиноких людей, находящихся вокруг нас.","Поклонение поста – это не просто голод. Важно также заставить свою совесть держать пост, дабы отдалиться от эгоизма, высокомерия и глупости и развить в себе чувства бескорыстия, самопожертвования, чуткость, заботу и милосердие. Пост будет принят насколько, насколько он очистит нашу совесть и умножит наше сострадание и щедрость.","Дорогие собратья!","Священный Рамадан – это месяц, когда божественное прощение нисходит бурным потоком на верующих. Наш Пророк (салляллаху алейхи ва саллям) говорил: «Тому, кто будет поститься в месяц Рамадан, искренне веря и надеясь на вознаграждение, Аллах Всевышний простит прошлые грехи» (Бухари, Саум, 6).","Пусть Всевышний Аллах дарует нам возможность провести священный Рамадан в праведных поступках, которые станут для нас спасением в вечной жизни! Пусть Он по Своей милости сделает наш последний вздох наполненным умиротворением, дав нам возможность прожить жизнь в духовности Рамадана.","Аминь!"]}]}}},
{"id":35,"collection":"c3","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Аль-Кадр, 97/1-5.","Бухари, Муслим, Тирмизи, Насаи «ат-Тадж» том 2: 80.","Абу Дауд, Ахмад «ат-Тадж» том 2: 84; Ибн аль-Хаджар. Фатху-ль-Бари. Т. 4. С. 260.","Тирмизи, Насаи, Ибн Маджа, Ибн Касир тафсир том 7: 339"],"bibliography":[],"versions":{"ru":{"title":"Достоинства ночи предопределения","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:اِنَّٓا اَنْزَلْنَاهُ ف۪ي لَيْلَةِ الْقَدْرِۚ (١)","@ar:وَمَٓا اَدْرٰيكَ مَا لَيْلَةُ الْقَدْرِۜ (٢)","@ar:لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ اَلْفِ شَهْرٍۜ (٣)","@ar:تَنَزَّلُ الْمَلٰٓئِكَةُ وَالرُّوحُ ف۪يهَا بِاِذْنِ رَبِّهِمْۚ مِنْ كُلِّ اَمْرٍۛۙ (٤)","@ar:سَلاَمٌۛ۠ هِيَ حَتّٰى مَطْلَعِ الْفَجْرِ (٥)","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:اللَّهُمَّ إِنَّكَ عُفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","Уважаемые братья и сестры!","Священный для мусульман месяц Рамадан – это время духовного очищения, поклонения и щедрости. И на этот месяц приходится самая лучшая ночь в году – «Ляйлятуль-кадр», то есть «Ночь Предопределения» или «Ночь Могущества», в которую начал ниспосылаться Священный Коран.","В Коране этой ночи посвящается целая сура, которая так и называется «аль-Кадр». Всевышний Аллах повелевает:","«Воистину, Мы ниспослали его в ночь Предопределения. Откуда тебе знать, что такое ночь Предопределения? Ночь Предопределения лучше тысячи месяцев. В эту [ночь] нисходят ангелы и Дух (т. е. Джибрил) с дозволения их Господа, дабы исполнить [Его] веления [на этот год]. [В эту ночь] – ниспослание приветствий [верующим от ангелов] до [самого] наступления зари»[1].","Как говорится в аяте, Ночь Предопределения, в которую на небе человечества взошло солнце Священного Корана, лучше тысячи месяцев.","Дорогие братья и сестры!","В то мрачное время джахилии (духовного невежества), когда в человеческом обществе, погрязшем в многобожии, заблуждениях, грехах, диких нравах, не осталось справедливости, любви и милосердия, над миром раздалось повеление: «Читай!», и на землю стал нисходить Священный Коран.","Это произошло в Ночь Предопределения 610 года в пещере Хира, что в окрестностях Мекки. Пророк Мухаммад (салляллаху алейхи ва саллям) проводил там время в уединении. Под утро перед ним явился ангел Джибриль (алейхиссалям) и приказал: «Читай!» Наш Пророк (салляллаху алейхи ва саллям) в сильном волнении ответил: «Я не умею читать». Джибриль (алейхиссалям) вновь приказал: «Читай!» Пророк (салляллаху алейхи ва саллям) снова ответил: «Я не умею читать!» Ангел Джибриль (алейхиссалям) вновь приказал: «Читай!» и прочитал первые пять аятов суры «аль-’Аляк». Пророк Мухаммад (салляллаху алейхи ва саллям) повторил ниспосланные аяты:","«Читай во имя твоего Господа, Который сотворил все сущее. Он сотворил человека из сгустка крови. Читай, ведь твой Господь – Самый великодушный. Он научил посредством письменной трости – научил человека тому, чего тот не знал» (Сура аль-Аляк, 96/1-5).","Уважаемые братья и сестры!","Коран, разогнавший мрак куфра и ширка, объединил верующих под знаменем единобожия. Коран, являющийся последним заветом Бога человечеству, осветил весь мир неугасимым светом веры. Приход Корана означал великий призыв и спасение человечества.","Каждый отдельный человек и целые общества или даже народы, которые желают обрести счастье жизни этой и жизни будущей, должны последовать этому призыву Священного Корана. Если же человечество останется глухим к призыву Священного Корана, то не найдет путь к счастью и благоденствию. Поэтому не подобает проводить в беспечном неведении благословенную ночь Предопределения.","Дорогие братья и сестры!","Ночь Предопределения в суре «аль-Кадр» описывается как ночь, в которую на землю по повелению Всевышнего Аллаха спускается ангел Джибриль (алейхиссалям) и другие ангелы, приветствуя пребывающих в поклонении рабов, ночь, в которую на верующих нисходит божественная милость и умиротворение, длящиеся до самого рассвета, ночь, которая благословенностью своей и духовным смыслом превосходит тысячу месяцев.","Именно поэтому Посланник Аллаха (салляллаху алейхи ва саллям), наставляя мусульман совершать в эту ночь как можно больше благих деяний, говорил:","«Тот, кто встретит и проведет ночь Предопределения с полной верой и истинным упованием на благоволение Аллаха, тому будут прощены все его грехи»[2].","Поэтому в Ночь Предопределения после совершения с джамаатом ночного намаза нужно, насколько возможно, оставаться в мечети, совершать зикр Аллаху, просить Аллаха о прощении грехов, читать Священный Коран, совершать када-намазы, воздавать хвалу Всевышнему Аллаху, произносить салаваты досточтимому Пророку (салляллаху алейхи ва саллям), позаботиться о родных и близких, поддержать неимущих и одиноких милостыней или добрым словом, оживляя тем самым благословенность этой великой ночи.","Братья и сестры!","Да будет нескончаемая хвала Аллаху, который удостоил нас чести вступить в эту благословенную ночь и встретить ее, будучи мусульманами. То, что требуется от нас, – это знать о ценности этой ночи. Поэтому мы должны стараться проводить все последние ночи Священного месяца Рамадан в духовном бдении, будто каждая из них – Ночь Предопределения. Ведь никому из нас не известно, в какую именно из ночей Рамадана следует искать ночь Предопределения. В хадисах передается, что ночь Предопределения следует искать в нечетных числах последних десяти дней Рамадана или в 27 ночь Рамадана.[3]","Уважаемые мусульмане!","Сейчас, когда мы все пребываем в духовном волнении, связанном с наступлением Ночи Предопределения, когда мы живем в ожидании наступающего праздника ‘Ид-аль-Фитр, немного грустно сознавать, что совсем скоро нам придется попрощаться с принесшим нам божественную милость и прощение, счастье и радость священным месяцем Рамадан до будущего года, а, быть может, навсегда. Месяц Рамадан, с его многолюдными таравихами, со сплоченными рядами молящихся в мечетях, с ифтарами и сухурами, проповедями и духовными беседами, навсегда останется в наших сердцах, и до самого конца времен каждый Рамадан будет радовать грядущие поколения мусульман. Но суждено ли нам встретить его в будущем году? Мы не можем знать этого. По этой причине, мы должны приложить все усилия, чтобы завершить этот месяц, будучи прощенными. Мы должны отнестись к этому Рамадану, как к последнему Рамадану в своей жизни.","Давайте проведем последние дни и часы этого Рамадана, уповая на милость и прощение Аллаха. Давайте дадим слово провести всю свою оставшуюся жизнь под сенью Священного Корана. Не оставим наши поклонения только потому, что закончился Рамадан. Дадим слово быть покорными Аллаху и поклоняться Ему до самой смерти. Будем считать своим долгом привить нашим детям любовь к Аллаху и Его Посланнику (салляллаху алейхи ва саллям). Не забудем подать фитр-садака, если у нас есть на это материальные возможности, и сделаем это до праздничного намаза. Не забудем, что человек создан в этом мире только для того, чтобы поклоняться Всевышнему Аллаху.","Завершаю свою хутбу словами нашего досточтимого Пророка (салляллаху алейхи ва саллям), с которыми он в Ночь Предопределения обращался к Аллаху:","@ar:اللَّهُمَّ إِنَّكَ عُفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","«О Аллах, Ты – Прощающий и любишь прощать, так прости мне мои грехи»[4]."]}]}}},
{"id":36,"collection":"c3","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Имам Раббани, Мактубат, том I, с. 24, 4 мактуб, Издательство Чиле, Стамбул, 1977."],"bibliography":[],"versions":{"ru":{"title":"Как сохранить Рамадан?","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:وَرَغِمَ أَنْفُ رَجُلٍ دَخَلَ عَلَيْهِ رَمَضَانُ ثُمَّ انْسَلَخَ قَبْلَ أَنْ يُغْفَرَ لَهُ","Дорогие братья и сестры!","Досточтимый Имам Раббани говорил:","«Ценность месяца Рамадан настолько велика, что нет ей конца. Единство и сплоченность в этом месяце – это причина единства, которое будет продолжаться весь год. Также как и разобщенность в этом месяце является причиной разобщенности в течение всего года».","«Насколько счастлив тот, кто завершит Рамадан, оставив его довольным. Горе тому, кто уйдет, оставив Рамадан опечаленным. Таким образом, он создаст препятствия к получению изобилия и останется обделенным благами»[1].","Священный Рамадан – это время духовного расцвета и возрождения, то есть Рамадан – духовная весна года. Его особая ценность состоит в том, что это время, наполненное духовным изобилием, когда открываются врата прощения, это месяц, в котором был ниспослан Коран, и в котором сокрыта ночь Предопределения.","Единство и сплоченность в этом месяце, дарующие спокойствие сердцам, являются исключительным духовным приобретением, дающим плоды в течение всего года. Поэтому доказательством того, что поклонения в Рамадане был приняты от нас, является наша стойкость на пути истины после окончания благословенного месяца.","Те, кто в этот месяц посвятил сердце Аллаху, а тело – поклонению, проводя время в посте, «намазе-таравих», чтении Корана, «зикре», «истигфаре», отдавая «фитр» и «закят», находясь в служении и благотворительности, наполненных милосердием и добром, познают благо (баракят) этого в течение всего года.","Дорогие верующие!","Однако те, кто остался равнодушен к этому месяцу и отдалился от божественной милости, в течение целого года также испытают отдаление и убыток.","Наш Пророк (салляллаху алейхи ва саллям) сказал:","«Передо мной предстал Джибриль (алейхиссалям) и сказал: «Пусть будет далек от милости тот, кто дожил до Рамадана, и его грехи не были прощены!» Я ответил: «Аминь!» (Хаким, IV, 170/7256; Тирмизи, Дават, 100/3545).","В другом благородном хадисе говорится:","«…Горе тому, кто встретил Рамадан и все равно не получил прощения. Если человек не будет прощен в Рамадан, то когда же он будет прощен?!» (Ибн Абу Шейба, аль-Мусаннаф, II, 270; Хайсами, Маджма, III, 143).","Поэтому для познавших верующих проведение Священного Рамадана в поклонении является вопросом чрезвычайной важности. Так, Муалля бин Фадль говорил:","«Праведные предки шесть месяцев молились Всевышнему Аллаху, чтобы Он дал им дожить до Рамадана. А остальные шесть месяцев они молились о том, чтобы Рамадан, который они застали, был принят от них» (Кываму’с-Сунна, ат-Таргиб ва’т-Тархиб, II, 354).","С другой стороны, Священный Рамадан является видом духовного воспитания, при котором чувство голода и беспомощности, испытываемое во время поста, позволяет лучше понять нуждающихся людей. В аяте Всевышний Аллах говорит, что мы должны понять состояние нуждающихся, которые из-за скромности стесняются просить, и помочь им в соответствие с нашими возможностями: «...Неосведомленный считает их богачами по причине их скромности. Ты узнаешь их по приметам: они не выпрашивают у людей милостыню настойчиво. Какое бы добро вы ни израсходовали, Аллах знает об этом» (аль-Бакара, 273). То есть, Он желает, чтобы доброта, милосердие, щедрость и самоотверженность утвердились и возвысились в наших сердцах.","Таким образом, Священный Рамадан – это школа познания, в которой мы получаем важное напоминание об одиноких, брошенных и беспомощных людях и своей ответственности за них. В Священный Рамадан мы особенно должны быть внимательны в отношении ответственности за нуждающихся и бедных.","Дорогие мусульмане!","Великим счастьем является завершить Рамадан достойным образом, оставив его довольным нами, и достичь следующего Рамадана, сохранив приобретенные духовные ценности. И таким образом, суметь через всю жизнь пронести духовность Рамадана. Истинный праздник – это проявление этого счастья.","Праздник – для того, кто завершил Рамадан, получив божественное свидетельство о прощении.","Праздник – это награда за искреннее поклонение, посвященное Всевышнему Аллаху.","Праздник – это последний урок в школе Священного Рамадана.","Праздник – это время, которое проживается среди братьев по вере, в посещении друзей, родственников, больных, нуждающихся, одиноких, угнетенных, чтобы справиться об их здоровье, расположить к себе их сердца. Это – быть в местах скорби, переживать за проблемы верующих и так далее.","Праздник – это божественная трапеза, дарующая прохладу Рая пылающим сердцам.","Праздник – это, наряду с индивидуальными, дни совместного поклонения, проходящие в благотворительности и служении. Это не дни наслаждения для «нафса», подобные отдыху на «уик-энд» в безумии расточительства, как принято у большей части людей.","Праздник – это дни прощения обид и примирения с братьями по вере.","Пусть Всевышний Аллах дарует нам способность еще глубже прочувствовать страдания наших угнетенных братьев по всему миру, превратить наши сердца в обитель милости, которая примет их, и даст возможность утолить их раны, как физические, так и духовные – посредством наших молитв. Пусть Всевышний Аллах ниспошлет на весь нынешний страдающий исламский мир истинную радостную атмосферу праздника…","Пусть Всевышний Аллах даст нам завершить этот Священный Рамадан очистившимися от грехов и встретить следующий Рамадан в том же духовном состоянии. Пусть Он даст нам милость прожить жизнь в духовности Рамадана и сделать последний вздох в умиротворении праздничного утра, открывшего окно в вечность.","Аминь!"]}]}}},
{"id":37,"collection":"c3","sn":"Уважаемые братья!","tags":[],"footnotes":["Аль-Анфаль, 8/46.","Алю Имран, 3/103.","Алю Имран, 3/105.","Абу Дауд «ат-Тадж» том 5: 54.","Бухари, Муслим «Рияд ас-Салихин» пер. том 1: 220.","Муслим, Абу Дауд «ат-Тадж» том 5: 244.","Тирмизи «Рияд ас-Салихин» пер. том 1: 101","Аль-А’ля, 87/14-15.","Аль-А’ля, 87/14-15..","Абу Дауд «ат-Тадж» том 5: 54.","Аль-Хиджр, 15/99.","Аль-Анкабут, 29/57.","Аль-Исра’, 17/111 (В праздничные дни вместо аята “инналлаха йа’муру” хатыйб читает этот аят, после чего сходит с минбара)."],"bibliography":[],"versions":{"ru":{"title":"Хутба праздника Рамадан","sections":[{"h":"","p":["@ar:ٱللَّهُ أَكْبَرُ ٱللَّهُ أَكْبَرُ لاَ إِلَهَ إِلاَّ ٱللَّهُ وَاللُّ أَكْبَرُ ٱللَّهُ أَكْبَرُ وَللَِِّ الْحَمْدُ، ٱللَّهُ أَكْبَرُ كَبِيرًا وَالْحَمْدُ للَِِّ كَثِيرًا وَسُبْحَانَ ٱللَّهِ تَعَالَى بُكْرَةً وَأَصِيلاً وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلاً طَوِيلاً ، اَلْحَمْدُ للَِِّ الَّذِى نَزَّلَ الْفُرْقَانَ عَلَى عَبٍدِهِ لِيَكُونَ لِلْعَالَمِينَ نَذِيرًا الَّذِى لَهُ مُلْكُ السَّمَوَاتِ وَالأَرْضِ وَلَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِى الْمُلْكِ وَخَلَقَ كُلَّ شَيْءٍ فَقَدَّرَهُ تَقْدِيرًا اَلْحَمْدُ للَِِّ الَّذِى جَعَلَ فِى السَّمَاءِ بُرُوجًا وَجَعَلَ فِيهَا سِرَاجًا وَقَمَرًا مُنِيرًا فَسُبْحَانَ الْمُتَجَلِّى عَلَى عِبَادِهِ بِالْغُفْرَانِ فِى هَذَا الْيَوْمِ السَّعِيدِ أَحْمَدُهُ حَمْدًا جَمِيلاً وَأَشْكُرُهُ شُكْرًا جَزِيلاً دَرَجَاتٍ مِنْهُ وَمَغْفِرَةً وَرَحْمَةً وَكَانَ ٱللَّهُ غَفُورًا رَحِيمًا، نَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ ٱللَّهُ وَحْدَهُ لاَشَرِيكَ لَهُ وَنَشْهَدُ أَنَّ سَيِّدَنَا مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ صَلَوَاتُ ٱللَّهِ وَسَلاَمُهُ عَلَيْهِ وَعَلَى آلِهِ وَأَصْحَابِهِ وَأَتْبَاعِهِ رِضْوَانُ ٱللَّهِ تَعَالَى عَلَيْهِمْ أَجْمَعِين. أَمَّا بَعْدُ فَيَا عِبَادَ ٱللَّهِ اِتَّقُوا ٱللَّه وَأَطِيعُوهُ إِنَّ ٱللَّه مَعَ الَّذِينَ اِتَّقَوْا وَالَّذِينَ هُمْ مُحْسِنُونَ، قَالَ ٱللَّهُ تَعَالَى فِى كِتَابِهِ الْكَرِيمِ: أَعُوذُ – بَسْمَلَة: قَدْ أَفْلَحَ مَن تَزَكَّى وَذَكرَ اسْمَ رَبِّهِ فَصَلَّى302","@ar:وَقَالَ رَسُولُ ٱللَّهِ (ص): الْمُؤْمِنُ مِرَآةُ الْمُؤْمِنِ وَالْمُؤْمِنُ أَخُو الْمُؤْمِنِ402","Уважаемые братья!","Вот и завершился Священный месяц Рамадан, и сегодня мусульмане всей планеты празднуют один из двух величайших Исламских праздников – ‛Ид-аль-фитр, или Рамадан-байрам.","В этот благословенный, являющийся божественной милостью для мусульман праздничный день во всех концах планеты звучат праздничные такбиры и таухиды, свидетельствуя на весь мир о том, какая это честь для мусульман – служить Аллаху и Его великой религии.","Да будет вам благая весть о том, что мы достойно выполнили одно из величайших повелений нашего Господа – пост месяца Рамадан и, наполнившись духовностью этого благословенного месяца, явились сегодня в дом Аллаха, чтобы воздать Ему хвалу и благодарность, совершив праздничный намаз и выплатив символическую фитр-садака.","Уважаемые братья мусульмане!","Праздник – это день, а точнее сказать – хороший повод для того, чтобы все мусульмане могли еще раз признаться друг другу во взаимной любви, братстве, единстве и солидарности. Поэтому, воспользовавшись этим великим случаем, каждый мусульманин, сердце которого трепещет верой, в эти дни Праздника должен обновить чувства дружбы и братства, исламского единства и солидарности.","Каждый мусульманин должен знать, что наша великая религия Ислам не допускает возникновения среди мусульман вражды, разделения, распрей и междоусобиц, запрещая все это. Вместо этого Ислам требует от мусульман, чтобы они жили в единстве, братстве и дружбе, ставя это во главе самой веры.","В Священном Коране Всевышний Аллах повелевает нам следующее:","@ar:وَأَطِيعُوا ٱللَّه وَرَسُولَهُ وَلاَ تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ","@ar:وَاصْبِرُوا إِنَّ ٱللَّه مَعَ الصَّابِرِينَ","«Повинуйтесь Аллаху и Его Посланнику и не препирайтесь [между собой], а не то лишитесь мужества и удачи. Будьте терпеливы, ибо Аллах – на стороне терпеливых».[1]","@ar:وَاعْتَصِمُوا بِحَبْلِ ٱللَّهِ جَمِيعًا وَلاَ تَفَرَّقُواْ","«Держитесь все за вервь Аллаха, не распадайтесь [на враждующие группировки]».[2]","@ar:وَلاَ تَكُونُوا كَالَّذِينَ تَفَرَّقُوا وَاخْتَلَفُوا مِن بَعْدِ مَا جَاءهُمُ الْبَيِّنَاتُ","@ar:وَأُوْلَئِكَ لَهُمْ عَذَابٌ عَظِيمٌ","«Не уподобляйтесь тем, которые распались на группировки и разошлись во мнениях, после того как к ним пришли ясные знамения. Таким уготовано суровое наказание».[3]","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Верующий для своего верующего брата подобен зеркалу. Верующий верующему – брат».[4]","«Верующие по отношению друг к другу подобны опорам одного здания».[5]","«Клянусь Тем, в чьих Руках находится моя душа, вы не войдете в Рай, пока не уверуете. И вы не станенте истинно верующими, пока не полюбите друг друга».[6]","Уважаемые братья мусульмане!","Из аятов и хадисов становится очевидным, что все, кто был удостоен чести, произнеся калима-и шахадат, войти под купол Ислама, должны собраться и объединиться под знаменем любви, братства, единства и солидарности великой религии Ислам. Ведь в истории еще не известен ни один народ, который, утратив свои духовные и моральные ценности, разорвав узы братства и любви, забыв о человечности, смог удержаться и выстоять.","Поэтому, если мы желаем подняться и заявить о себе и об Исламе всему миру, нам, прежде всего, необходимо отстроить здание духовного братства. А праздники предоставляют собой отличный повод для этого единения. Мы, движимые единой верой и собравшиеся в такое благословенное утро в доме Аллаха, должны использовать эту возможность. Поэтому каждый мусульманин, избавившись от всех предрассудков и наущений нафса, должен напомнить себе: «Я – мусульманин, все мусульмане – братья, а братья не могут быть врагами друг другу и не могут отдаляться друг от друга», разорвав все цепи личной неприязни и вражды. Мы должны сделать это безотлагательно, так как этого требует наша вера...","Только тогда наш мусульманский праздник будет считаться состоявшимся.","Ведь праздники даются мусульманам только для того, чтобы объединить их друг с другом. Праздники даются для того, чтобы утихли раны и хотя бы на время отступили невзгоды, чтобы кто-то вспомнил о неимущих и одиноких. Праздники существуют для того, чтобы хотя бы на время прекратились ненависть, зависть и вражда, чтобы восторжествовало единство и солидарность.","Уважаемые братья мусульмане!","Говоря в Священном Коране:","@ar:وَاعْبُدْ رَبَّكَ حَتَّى يَأْتِيَكَ الْيَقِينُ","«Поклоняйся Господу твоему пока смерть не настигнет тебя», Всевышний Аллах повелевает нам быть постоянными в на-","211 ших поклонениях. Поэтому после окончания Рамадана мы ни в коем случае не должны прекращать свое поклонение и усердие. Прекращение поклонений и отдаление от мечети и джамаата по истечении месяца Рамадан является ошибочным и опасным поведением. Так как Ислам – это не сезонное облачение на месяц Рамадан. Рассудительный и зрелый мусульманин – это тот, кто остается в своем облачении мусульманина всегда, до самого последнего вздоха. Этот путь – единственный для каждого мусульманина, и конечным его пунктом является праздник жизни вечной.","Именно поэтому досточтимый Пророк (салляллаху алейхи ва саллям) сказал:","«Мудрым является тот, кто, предав себя и свои деяния суду, готовится к тому, что ждет его после смерти. Глупцом же является тот, кто, следуя за тем, что нашептывает ему его нафс и его желания, ожидает от Аллаха того, чему никогда не суждено быть».[7]","Значит, разумный мусульманин, прежде всего, должен быть хорошо подготовленным к вечной жизни, которая начнется для него после смерти и откроется могилой. Вместе с тем, он не должен пренебрегать и жизнью земной.","Следует стараться оказаться в числе тех, о которых наш Господь говорит:","@ar:قَدْ أَفْلَحَ مَن تَزَكَّى وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّى","«Преуспел тот, кто очистился [благодаря вере], поминал имя своего Господа и совершал обрядовую молитву».[8]","В этот благословенный праздничный день мы должны быть уважительны к нашим старшим и снисходительны к нашим младшим. Должны навещать наших родных и близких. Если нет возможности их навестить, мы должны справиться об их здоровье и жизни по телефону и поздравить с праздником. Если мы на кого-то обижены или кто-то в обиде на нас, в этот день следует помириться. В этот день надо постараться сделать крепче и теснее наши братские узы. Укрепить их так, чтобы они никогда не разорвались, разбросав нас в разные стороны, словно бусинки тасбиха.","Если кто-то из нас еще не выплатил фитр-садака, являющуюся ваджибом для каждого имущего и свободного мусульманина, следует непременно сделать это. Следует знать, что эта милостыня выплачивается за каждого члена семьи.","Прошу Аллаха о том, чтобы этот великий праздник стал благословенным для всех мусульман, будьте аманатом Аллаха, ведь к Нему Одному наше возвращение! 214","@ar:اَلاَ اِنَّ اَحْسَنَ الْكَلاَمِ... كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ412","@ar:وَقُلِ الْحَمْدُ للِِّ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَم يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلَّ وَكَبِّرْهُ تَكْبِيرًا512"]}]}}},
{"id":38,"collection":"c3","sn":"Уважаемые мусульмане,","tags":[],"footnotes":["9 и 10 дни месяца Зульхиджа (день Арафа и праздничные дни).","Абу Дауд «ат-Тадж» том 2: 109.","Тирмизи, Ахмад «ат-Тадж» том 2: 109","Алю Имран, 3/96-97.","Муслим, Насаи, Тирмизи «ат-Тадж» том 2: 108.","Тирмизи «ат-Тадж» том 2: 121","Кады Ийад «ат-Тадж» том 2: 190.","Бухари, Муслим «Рияд ас-Салихин» пер. том 2: 521 № 1278."],"bibliography":[],"versions":{"ru":{"title":"Значимость Хаджа в Исламе","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:فِيهِ آيَاتٌ بَيِّنَاتٌ مَّقَامُ إِبْرَاهِيمَ وَمَن دَخَلَهُ كَانَ آمِنًا وَللَِِّ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلاً وَمَن كَفَرَ فَإِنَّ ٱللَّهَ غَنِيٌّ عَنِ الْعَالَمِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:وَقَالَ رَسُولُ ٱللَّهِ (ص): أَيُّهَا النَّاسُ قَدْ فَرَضَ ٱللَّهُ عَلَيْكُمُ الْحَجَّ فَحَجُّوا","Уважаемые мусульмане,","одним из основных предписаний нашей религии Ислам является хадж, паломничество к святым местам. Хадж, который стал обязательным для каждого мусульманина в девятом году хиджры, включает «стояние в долине Арафат и посещение Кааба-Муаззама в определенное время года для мусульманина, облачившегося в ихрам, с целью поклонения»[1].","Обязательность хаджа в Исламе подтверждается аятами Священного Корана, хадисами досточтимого Пророка (салляллаху алейхи ва саллям) и мнением ученых, поэтому отрицать его или пренебрежительно относиться к этому виду поклонения является куфром.","Хадж, являющийся как духовным, так и телесным видом поклонения, обязателен один раз в жизни для каждого мусульманина, мужчины и женщины, совершеннолетнего, находящегося в здравом уме, свободного, здорового. Поэтому каждый мусульманин, имеющий средства на дорожные расходы и на проживание его семьи во время его пребывания в хадже, должен стараться без промедления совершить это поклонение, ведь Посланник Аллаха (салляллаху алейхи ва саллям) сказал: «Тот, кто имеет намерение совершить хадж, не должен откладывать выполнение этого».[2]","О тех, кто имеет все возможности для совершения хаджа, но не совершает его, ссылаясь на занятость или какую-то другую причину, и уходит из этой жизни, так и не совершив хадж, Посланник Аллаха (салляллаху алейхи ва саллям) сказал: «Тот, кто при наличии возможности ни разу за свою жизнь так и не посетил Каабу, уходит из нее иудеем или христианином».[3]","Уважаемые братья и сестры,","Всевышний Господь, говоря в Священном Коране об обязательности хаджа, повелевает:","@ar:إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي بِبَكَّةَ مُبَارَكًا وَهُدًى لِّلْعَالَمِينَ فِيهِ آيَاتٌ بَيِّنَاتٌ مَّقَامُ إِبْرَاهِيمَ وَمَن دَخَلَهُ كَانَ آمِنًا وَللِِّ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلاً وَمَن كَفَرَ فَإِنَّ ٱللَّه غَنِيٌّ عَنِ الْعَالَمِينَ","«Воистину, первый дом, который был воздвигнут, чтобы люди [предавались богослужению], – это тот, который в Бакке. Он благословен и служит руководством к истине для обитателей миров. В том Доме – ясные знамения для людей. Это – место стояния Ибрахима. Тот, кто войдет в этот Дом, будет в безопасности. Аллах обязывает тех людей, кто в состоянии совершить поездку, отправляться в хадж к Дому. А если кто-либо не верует [и не совершает хаджа], то ведь Аллах не нуждается в обитателях миров».[4]","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","• О люди, Аллах сделал хадж для вас обязательным. Поэтому старайтесь совершить его при первой представившейся вам возможности.","Один из присутствующих спросил:","• Следует ли нам совершать его каждый год, о Посланник Аллаха?","На это он ответил:","• Если бы я ответил “да”, то хадж стал бы для вас обязательным каждый год, на что у вас никогда не хватило бы сил.[5]","Итак, посещение Заповедной Земли, над которой взошло солнце Корана и Каабы – центра мироздания и первого места поклонения на земле, с целью паломничества, для каждого имеющего на это возможности и силы мусульманина является обязательным хотя бы один раз в жизни, и это – повеление Всевышнего Аллаха.","Уважаемые мусульмане,","насколько потрясает картина, когда верующие, последовавшие повелению Всевышнего Аллаха, съезжаются со всех концов земли на Заповедную Землю, в благоговейном трепете плечом к плечу совершают обряды хаджа со своими братьями по вере, говорящими на разных языках и имеющими разный цвет кожи.","Только в хадже человек при жизни может пережить подобие Судного Дня, когда он так же предстанет перед Всевышним Аллахом, не взяв с собой ничего из этого мира, кроме двух кусков белой ткани.","Вера, наполняющая сердца тысяч азиатов, африканцев, европейцев и американцев, выраженная в тальбии – гимне хаджа: «Ляббейка, Аллахумма, ляббейк. Ляббейка ля шарика ляка, ляббейк...», смешиваясь с благословенным воздухом и пылью Мекки, благоухая ароматами роз и благовоний, наполняет всю землю. Об этом сказал Посланник Аллаха (салляллаху алейхи ва саллям):","«Мусульманину, который произносит тальбию, вторят каждый клочок земли, каждый камень на нем, каждое дерево и даже высохшее растение».[6]","Уважаемые мусульмане,","мы должны с особой серьезностью отнестись к такому поклонению как хадж, который способствует укреплению единства и сплоченности мусульман мира, призывает мусульман к образовательному, общественному, экономическому и культурному единению и выполняет роль своеобразного Исламского конгресса. Нужно хорошо знать, какой вид хаджа мы собираемся выполнить: аль-ифрад, ат-таматту’ или аль-киран, сделать соответствующее намерение и постараться выполнить это поклонение наилучшим образом.","Нужно хорошо знать, что такое «ихрам», «стояние в Арафате» и «таваф Каабы», которые являются фардами хаджа, а также – когда и каким образом выполняется каждый из этих обрядов. Нужно хорошо знать такие ваджибы хаджа, как са’й между холмами Сафа и Марва, стоянка в Муздалифа, побивание камнями шайтана, сбривание и укорачивание волос и прощальный таваф. Нужно хорошо знать, что разрешено и что запрещено вошедшему в состояние «ихрам», какие действия требуют совершения искупительного жертвоприношения и искупительного садака. Нужно знать все это достаточно хорошо, чтобы выполнить свой хадж без изъянов.","Во время хаджа желательно посетить могилу посланного милостью мирам досточтимого Посланника Аллаха (салляллаху алейхи ва саллям), находящуюся в Медине, так как Пророк пророков (салляллаху алейхи ва саллям) говорил:","«Мое заступничество станет обязательным для того, кто посетит мою могилу».[7]","Хутбу свою заканчиваю хадисом, который передал Абу Хурейра (радыйаллаху анху). В нем говорится, что, когда Посланника Аллаха (салляллаху алейхи ва саллям) спросили о самом лучшем из деяний, он сказал:","«Покорность Аллаху и Его посланнику». Когда его спросили, что следует после этого, он ответил:","«Джихад на пути Аллаха». Когда его спросили, что следует после этого, он сказал:","«Без изъянов и ошибок выполненный хадж».[8]","Пусть Аллах Всевышний даст всем нам возможность неоднократно посетить благословенные места, связанные с жизнью Его пророков, удостоиться доли от возвышенной духовности Его любимого Посланника (салляллаху алейхи ва саллям) и предстать перед Ним в День Суда совершившими истинный, безупречный хадж! Аминь!"]}]}}},
{"id":39,"collection":"c3","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Хадж и день Арафа","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ، وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِي: لاَ إِلَهَ إِلاَّ ٱللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","Дорогие братья и сестры!","Хадж – это один из пяти основ Ислама, это священная обязанность, для исполнения которой со всех концов света в Мекку прибывают верующие самых разных национальностей, имеющие разный цвет кожи, говорящие на разных языках. Хадж – это путешествие мусульман всего мира к Каабе, к которой они обращаются в молитве пять раз в день.","Хадж – это восторг веры. Хадж – это напоминание о Сборе в День страшного суда. Многомиллионная толпа паломников в дни хаджа служит напоминанием о том Дне, когда людей огромными толпами погонят на Место Сбора (Махшар). Хадж – это возможность испытать чувство гордости за самую большую общину верующих в мире – Умму Мухаммада (салляллаху алейхи ва саллям). Ведь здесь, на Священной Земле присутствует только малая часть миллиардной Уммы.","Хадж – это пребывание в священных местах, где первые зерна Истинной религии дали свои обильные всходы. На этой земле, по которой ступал самый лучший из всех созданных – Мухаммад Мустафа (салляллаху алейхи ва саллям), каждый видит и чувствует сердцем благословенные свидетельства его пребывания в этом мире.","Священная Кааба – символ любви к Всемогущему Творцу. Она – напоминание о любви пророка Ибрахима (алейхиссалям) к своему Господу. Она – символ любви и преданности пророка Мухаммада (салляллаху алейхи ва саллям) Всевышнему Аллаху... Именно к ней были обращены полные грусти благословенные глаза Посланника Аллаха (салляллаху алейхи ва саллям) в момент расставания с родным городом.","Благословенная Мекка – город, в котором снизошли первые аяты Священного Корана. Именно отсюда последняя божественная религия начала распространяться по всему миру.","Именно здесь пророк Исмаил (алейхиссалям) утолил свою жажду из божественного подарка – источника Зам-зам. Именно этот источник, забивший бурным потоком, пыталась усмирить словами: «Зам! Зам!» благородная Хаджар...","Именно в окрестностях этого города находится долина Арафа, в которой принимаются все мольбы. Именно в этих благословенных местах покорный раб Аллаха – пророк Ибрахим понял, что Всевышний Аллах повелевает ему через вещие сны принести в жертву его сына Исмаила (алейхумассалям). Поэтому долина названа «Арафа», что буквально означает: «он понял...»","Дорогие братья и сестры!","День стояния в долине Арафа, приходящийся на 9-ый день месяца Зуль-хиджа, является самым важным и дорогим днем хаджа, днем прощения грехов и освобождения от Ада. Было бы достаточно одного дня Арафа, чтобы все десять дней Зуль-хиджа считались великими. Посланника Аллаха (салляллаху алейхи ва саллям) спросили о соблюдении поста в день Арафа, и он сказал: «(Пост в этот день) служит искуплением (грехов) прошлого и будущего года» (Муслим).","Таким образом, за один день поста в день Арафа Аллах прощает грехи человека за два года. Не будем же упускать такой возможности заслужить прощение Аллаха и будем особенно усердны в поклонении в эти благословенные дни.","Дорогие мусульмане!","В день стояния в долине Арафа, рабы Аллаха будут томиться в надежде и ожидании прощения от Своего Господа, пребывая в состоянии бессилия и нужды. Сердца и глаза наполнятся слезами покаяния, и сколько же взываний о прощении вознесутся к Творцу. В книгах деяний откроются совершенно чистые страницы, и к Всевышнему Господу будут обращены мольбы и обещания прожить свою жизнь в полной покорности Ему. Поэтому в долине Арафа люди будут переживать подоб
