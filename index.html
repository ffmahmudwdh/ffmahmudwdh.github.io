ие Судного дня. Здесь все будет напоминать о том, как, выйдя из могил, они соберутся на Махшаре и будут в полной беспомощности искренне молить Господа своего о прощении за грехи. Обернутые в два куска белой ткани ― снизу и сверху, подобно савану, открытая голова, босые ноги и отсутствие всех земных регалий.","А еще Арафа напомнит нам историю о первых людях на земле, наших прародителях. По наущению сатаны вкусив запретный плод, пророк Адам и его жена Хавва (Ева) (алейхумассалям) по божественному повелению были ниспосланы из Рая на землю, оказавшись в разлуке и тоскуя друг по другу.","Пророк Адам (алейхиссалям) покаялся и просил прощения у Всевышнего Аллаха ради Мухаммада (салляллаху алейхи ва саллям) и его потомков. Его ду’а была принята, и Господь послал ангела, который показывал ему дорогу до Мекки. Во благо этой молитвы Хавве, находившейся в Джидде, тоже был послан ангел, который повел ее навстречу Адаму (алейхиссалям). И они встретились через 200 лет в день Арафа в долине Арафа на горе ар-Рахма (гора Милости) после наступления времени намаза аль-‘аср. Вместе они плакали и снова каялись в том, что ослушались Господа и сами себе причинили несправедливость.","Всевышний Творец, щедрость и доброта которого безграничны, не только принял их мольбу, но еще облагодетельствовал их обещанием каждый год сполна прощать тех из их потомков, кто придет в это место в тот же день и в то же время и будет просить прощения. Вот в этом и заключается смысл и мудрость покаяния паломников в долине Арафа.","После этой встречи Адам и Хавва (алейхумассалям) поселились в том месте, где сегодня находится город Мекка. Поэтому Мекка еще носит название «Умму’ль-Кура», что означает «мать поселений».","Эти святые места, места безопасности, умиротворения и божественной любви – места наполненной милостью и благом колыбели пророков. Несмотря на сегодняшние разногласия в исламском мире, народы мира могут лишь позавидовать единству, братству и взаимной любви, которая проявляется на этих святых землях во время хаджа и умры (малого паломничества).","Дорогие братья и сестры!","Паломник – гость Всевышнего Аллаха. Подобно тому, как правила приличия и этикета предписывают нормы поведения гостя в доме хозяина, каждый паломник должен соблюдать порядок в Доме Аллаха. И только при этом условии Всевышний Господь примет покаяния и мольбы гостя...","Каждый паломник – избранный посланник мусульманской уммы, поэтому обязан, совершая хадж, постоянно в своих мольбах просить Всевышнего Аллаха даровать умме прощение, благо и всеобщее процветание...","Да удостоит Всевышний Господь каждого из мусульман возможности хотя бы один раз в жизни выполнить это прекрасное поклонение.","Аминь!.."]}]}}},
{"id":40,"collection":"c3","sn":"Хвала Аллаху, Господу миров, который не нуждается ни в ком и ни в чем, а в Нем нуждаются все создания. Мы взываем о прощении к…","tags":[],"footnotes":["Ахмад 2/38, ат-Тирмизи 1507.","Ат-Тирмизи, 1493.","Сура «Аль-Хадж», Аят 36"],"bibliography":[],"versions":{"ru":{"title":"Праздничная хутба — Курбан Байрам","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:إِنَّ الْحَمْدَ للَِِّ نَحْمَدهُ وَنَسْتَغْفِرُهُ وَنَسْتَعِينُهُ وَنَسْتَهْدِيهِ وَنَعُوذُ بِاللَِّ مِن شُرُورِ أَنفُسِنَا وَمِن سَيِّئَاتِ أَعْمَالِنَا، مَن يَهْدِ ٱللَّهُ فَلاَ مُضِلَّ لَهُ وَمَن يُضْلِلْ فَلاَ هَادِيَ لَهُ، وَأَشْهَدُ أَن لاَ إِلهَ إِلاَّ ٱللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ ولا مَثِيلَ له ولا ضِدَّ له ولا نِدَّ له، وَأَشْهَدُ أَنَّ سَيِّدَنَا وحَبِيبَنا وعظيمَنا وقائدَنا وقُرَّةَ أَعْيُنِنا مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ وصَفِيُّهُ وحبيبُهُ صَلَوَاتُ ٱللَّهِ وَسَلاَمُهُ عَلَيْهِ وَعَلَى كُلِّ رَسُولٍ أَرْسَلَه. الصلاةُ والسلامُ عليكَ سيِّدي يا رسولَ اللَّ. الصلاةُ والسلامُ عليكَ يا سيِّدي يا صاحِبَ الذِّكرَى يا أبا القاسِم يا أبا الزَّهْراءِ يا محمد. أَمَّا بَعدُ عِبَادَ اللَِّ، فإني أُوصِيكُمْ وَنَفْسِيَ بِتَقْوَى ٱللَّهِ الْعَلِيِّ الْقَديرِ القائلِ في مُحْكَمِ كتابِه:","@ar:يَاأَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا ٱللَّهَ وَلْتَنْظُرْ نَفْسٌ مَا قَدَّمَتْ لِغَدٍ وَاتَّقُوا ٱللَّهَ إِنَّ ٱللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ","Хвала Аллаху, Господу миров, который не нуждается ни в ком и ни в чем, а в Нем нуждаются все создания. Мы взываем о прощении к Аллаху, который Единственный истинно прощающий грехи. Мы просим защиты от наказания у Аллаха, ибо нам больше не у кого просить помощи и не на что надеяться, кроме Его мило-!сти и милосердия","Просим Аллаха даровать еще больше почета и величия пророку Мухаммаду (салляллаху алейхи ва саллям), посланного с истиной ко всему человечеству.","Уважаемые братья и сестры!","10 числа месяца Зуль-Хидджа мусульмане всего мира отмечают великий праздник ’Ид-аль-Адха, или Курбан-Байрам, который знаменует окончание паломничества в Мекку. Ритуалы, совершаемые в дни этого праздника мусульманами, находящимися в хадже, – побивание шайтана и жертвоприношение – восходят к истории жертвоприношения пророка Ибрахима и его сына пророка Исмаила (алейхумассалям).","Как-то, находясь в Мекке, пророк Ибрахим (алейхиссалям) во сне услышал голос: «О Ибрахим! Аллах повелел тебе принести в жертву сына!» Этот сон приснился ему за два дня до праздника Курбан, а потом повторился еще дважды. Это убедило Ибрахима (алейхиссалям), что этот сон – от Аллаха. Действительно, это было испытание на верность, на готовность пожертвовать ради Аллаха тем, что больше всего дорого. Ибрахим (алейхиссалям) в то утро велел сыну взять веревку и нож, сказав, что они пойдут за дровами. Это было для них привычным делом. Исмаил (алейхиссалям) ни о чем не подозревал. Подходя к Мина (месту в окрестностях Мекки) Ибрахим рассказал Исмаилу (алейхумассалям) о своем сне. «Отец, этот приказ дал тебе Аллах?» – спросил он. «Да!» – ответил Ибрахим (алейхиссалям). Исмаил сказал: «Отец! В таком случае, делай то, что тебе приказано! Если будет угодно Аллаху, ты найдешь меня терпеливым!» (Сура «ас-Саффат», 102), проявив готовность отдать свою жизнь по приказу Аллаха.","Ибрахим (алейхиссалям) завязал сыну глаза, чтобы тот, увидев нож, не испугался, и сердце его не дрогнуло. Прежде чем коснуться ножом горла Исмаила, Ибрахим (алейхумассалям) произнес: «Бисмилляхи!» и воскликнул: «О мой Господь, я исполняю Твою волю!» Отец провел ножом по горлу сына, но это не причинило ему вреда, так как не было воли Аллаха на то, чтобы Исмаил (алейхиссалям) был принесен в жертву. В этом испытании на верность и терпение они станут примером для всех людей. Ибрахим и его сын Исмаил (алейхумассалям) подтвердили, что они готовы пожертвовать самым ценным ради Аллаха: Ибрахим – своим сыном, а Исмаил – своей жизнью.","Когда Ибрахим (алейхиссалям) вновь приготовился приставить нож к горлу сына, он услышал голос с небес: «Ибрахим, ты доказал свою верность. Ты доказал, что верен Аллаху. Остановись! Нет нужды приносить в жертву Исмаила». Ибрахим (алейхиссалям) увидел ангела Джибриля (алейхиссалям), спускающегося с небес с круторогим бараном, у которого глаза были обведены сурьмой. Ангел объявил: «О Ибрахим! Этот баран кормился в Раю сорок лет. А сейчас он ниспослан тебе, чтобы ты принес его в жертву вместо сына». Ибрахим (алейхиссалям) возликовал, услышав благую весть.","«И Мы заменили ему [сына] на большую жертву. Мы велели последующим поколениям [взывать]: «Мир Ибрахиму! Так Мы воздаем тем, кто творит добро. Воистину, он – из числа Наших верующих рабов» (ас-Саффат, 107-111)","Они принесли в жертву барана, возвеличивая своего Господа.","Дорогие мусульмане!","Истинный смысл жертвоприношения, заключенный в этом историческом событии, состоит в умении быть искренним рабом Аллаха, выражая покорность и богобоязненность перед Его повелениями.","Ежегодно в дни праздника ’Ид-аль-Адха мусульмане в знак этого события совершают жертвоприношение. Аллах Всевышний повелевает:","«Посему совершай намаз ради своего Господа и совершай жертвоприношение». (Сура «аль-Каусар», 2)","Аллах не нуждается в курбане, как и в других видах поклонения, но Своим велением совершать жертвоприношение Он испытывает Своих рабов, измеряет степень близости к Себе. Это проявление покорности Всевышнему Аллаху, выражение благодарности Ему за ниспосланные блага, искупление за грехи, способ достижения близости к Нему и Его довольства.","«(От жертвоприношения) Ни мясо, ни кровь их не доходят до Аллаха. До Него доходит лишь ваша богобоязненность…» (Сура «аль-Хадж», 37)","Только верующие, искренне желающие довольства своего Господа и доказывающие свою веру выполнением Его повелений, удостоятся Его награды. В хадисах сказано:","«Приносите свои жертвы из крупных животных, так как они будут вашим средством передвижения по мосту Сырат» (Файзуль-Кадир),","«За каждую волосинку Курбана есть вознаграждение» (Абу Дауд).","Уважаемые братья и сестры!","Обряд жертвоприношения является обязательным (ваджиб) для каждого обеспеченного мусульманина, владеющих имуществом в размере нисаба (т.е. для людей, для которых выплата закята обязательна). Курбан является сунной Посланника Аллаха (салляллаху алейхи ва саллям) и сунной пророка Ибрахима (алехиссалям).","Ибн ‘Аббас (радыйаллаху анху) сказал: «Посланник Аллаха (салляллаху алейхи ва саллям) прожил в Медине десять лет, на протяжении которых он совершал Удхия (курбан)».[1]","«В десятый день зуль-хиджжа (день Курбана) нет более любимого и дорогого для Аллаха деяния, которое могут совершить дети Адама, чем курбан (жертвоприношение животных) Пожертвованное животное явится в Судный день со своими рогами, шерстью и копытами. Жертва достигает Аллаха прежде, чем кровь животного упадет на землю. Поэтому приносите жертву с открытым и чистым сердцем».[2]","Дорогие мусульмане!","Совершая курбан, нужно повернуться в сторону Каабы и резать с произнесением слов:","«Бисмилляхи, Аллаху Акбар».","Затем читают такую дуʻа:","@ar:بِسْمِ اللَِّ، ٱللَّهُ أَكْبَرُ","@ar:اللَّهُمَّ تَقَبَّلْ مِنِّي","«Аллахумма, такаббаль минни» (О Аллах! Прими мое жертвоприношение).","Время жертвоприношения наступает после времени праздничного намаза аль-’Ид и времени, достаточного для чтения двух ракатов намаза и двух проповедей. Если курбан режут раньше, он не принимается.","Имамы Муслим и аль-Бухари передали, что Пророк (салляллаху алейхи ва саллям) сказал:","@ar:مَنْ صَلَّى صَلاَتَنَا هَذِهِ وَنَسَكَ نُسْكَنَا فَقَدْ أَصَابَ سُنَّتَنَا وَمَنْ نَسَكَ قَبْلَ صَلاَتِنَا فَتِلْكَ شَاةُ لَحْمٍ فَلْيَذْبَحْ مَكَانَهُ","Это означает: «Кто совершал с нами намаз и после этого выполнил ритуал (жертвоприношения), то он правильно выполнил нашу сунну, а кто совершил ритуал до совершения нашего намаза вместе с нами, то этот курбан не принимается, и пусть режет заново».","Время для курбана продолжается до захода солнца четвертого дня праздника.","Обычно 1/3 часть курбана отдают как садака бедным и нуждающимся, 1/3 часть оставляют себе, а оставшуюся 1/3 часть можно подарить кому желаешь. Если же мясо курбана полностью отдают бедным, то это тоже принимается, ибо сказано в Священном Коране:","@ar:فَكُلُوا مِنْهَا وَأَطْعِمُوا الْقَانِعَ وَالْمُعْتَرَّ","Это означает: «Кушайте из него (мяса жертвенного животного) и кормите бедных, которые стесняются просить и нищих, вынужденных просить о помощи».[3]","Поэтому жертвоприношение в Исламе является реальным выражением человечности и щедрости.","Дорогие мусульмане!","Для курбана пригодны такие животные, как овца, баран – не меньше одного года; козел, коза – не меньше двух лет; корова, бык – старше двух лет; верблюд, верблюдица – старше пяти лет.","Мухаддис Джабир передал хадис пророка Мухаммада (салляллаху алейхи ва саллям):","@ar:لاَ تَذْبَحُوا إِلاَّ مُسِنَّةً إِلاَّ أَنْ تَعْسُرَ عَلَيْكُمْ فَاذْبَحُوا جَذَعَةً مِنَ الضَّأْنِ","Это означает: «Приносите в жертву только то животное, которое достигло зрелости (мусинна). Если же это затруднит вас, то приносите в жертву годовалого барана».","Не принимается курбан, если животное имеет такие недостатки, как отсутствие одного глаза, явная хромота, или сильное истощение, или оно имеет болезнь или недостаток, которые явно видны.","Лучшие жертвенные животные – это верблюды, затем коровы (быки), а затем овцы (козы). Других животных не режут для курбана.","Дорогие братья и сестры!","Пусть Аллах Всевышний даст нам провести праздник Курбан Байрам в кругу родных и близких и примет наше поклонение, нашу искренность и наши дуа. Просим Аллаха простить нам наши грехи и удостоить вхождением в Рай без мучений! Аминь!"]}]}}},
{"id":41,"collection":"c9","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Бухари, Ма‘ази, 12; Муслим, Зухд, 6.","Сура «аль-А’ля», 16-17.","Сура «аль-Касас», 77.","Муслим, Зухд, 3."],"bibliography":[],"versions":{"ru":{"title":"Увлеченность мирской жизнью","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا","@ar:وَالآْخِرَةُ خَيْرٌ وَأَبْقَى","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:عَنْ مُطَرِّفٍ، عَنْ أَبِيهِ قَالَ: أَتَيْتُ النَّبِيَّ (صَلَّى ٱللَّهُ عَلَيْهِ وَ سَلَّمْ) وَهُوَ يَقْرَأُ أَلْهَاكُمُ التَّكَاثُرُ قَالَ: “يَقُولُ ابْنُ آدَمَ: مَالِى، مَالِى قَالَ: وَهَلْ لَكَ، يَا ابْنَ آدَمَ مِنْ مَالِكَ إِلاَّ مَا أَكَلْتَ فَأَفْنَيْتَ، أَوْ لَبِسْتَ فَأَبْلَيْتَ، أَوْ تَصَدَّقْتَ فَأَمْضَيْتَ؟”","Уважаемые братья и сестры!","Как-то Посланник Аллаха (салляллаху алейхи ва саллям) отправил Абу ‘Убайду ибн аль-Джарраха (радыйаллаху анху) в Бахрейн, чтобы он привёз джизью, собранную с жителей этой области. Когда он привёз собранные средства из Бахрейна, ансары, узнав о его приезде, не стали расходиться после утреннего намаза. Посланник Аллаха (салляллаху алейхи ва саллям) собирался после намаза уйти по своим делам, но сахабы подошли к нему. Посланник Аллаха (салляллаху алейхи ва саллям) улыбнулся и сказал: «Я думаю, вы услышали о том, что Абу ‘Убайда что-то привёз из Бахрейна». Они сказали: «Да, о Посланник Аллаха!» И он сказал: «Тогда радуйтесь и надейтесь на то, что обрадует вас! Однако, клянусь Аллахом, не бедности вашей я боюсь, а боюсь того, что раскроется перед вами этот мир, как раскрылся он перед жившими до вас, и станете вы соперничать друг с другом из-за него, как соперничали они, и погубит это вас, как погубило их!»[1]","Дорогие братья и сестры!","Наша священная религия охватывает все стороны нашей жизни. Только строгое выполнение божественных предписаний и избегание запретного позволит следовать истинным путем (сират аль-мустаким) в земной жизни и удостоиться Рая в вечной жизни. Но мы, к сожалению, часто слишком погружаемся в мирскую суету, отодвигая на второй план нашу религию, являющуюся источником жизненной энергии и душевного покоя; отдаляемся от пути, указанного нам Посланником Аллаха (салляллаху алейхи ва саллям); перестаем ясно осознавать смысл земной жизни; устремляемся за мимолетными целями, не имеющими никакой ценности в вечной жизни; постепенно начинаем жить лишь ради земного, растрачивая попусту драгоценные дни и минуты своей жизни...","Братья и сестры!","Увлечение мирской жизнью является следствием пренебрежения к исполнению божественных предписаний; бесконечная погоня за мирским является признаком того, что мирское заслонило в душе человека религиозные ценности, и он ведет себя так, будто собирается жить вечно. О тех, кто встал на этот ошибочный путь, Всевышний Аллах говорит: «Но нет! Вы отдаете предпочтение мирской жизни, а (хотя) Вечная жизнь (в Раю) лучше (чем эта жизнь) и длительнее (она вечна)».[2]","Смысл данного аята: «Вы ставите жизнь земную выше жизни вечной, тем самым делаете свою жизнь нелегкой, беспокойной и лишенной смысла. Будущая жизнь превосходит мирскую жизнь по всем качествам и продолжается вечно, а дольный мир непременно разрушится и исчезнет. Верующий разумный человек никогда не предпочтет скверное благому и не пожелает вечно страдать за мирские удовольствия, которые длятся недолгие часы или даже короткие мгновения. Причиной всех несчастий является именно любовь к этому миру и предпочтение его миру вечному».","Уважаемые братья и сестры!","Всевышний Творец создал земной мир для того, чтобы мы прошли в нем испытание. Без сомнения, сохранение равновесия между заботой о благе земной жизни и усердствованием ради вечной жизни является для верующего человека одним из серьезных испытаний. Главное, чтобы мусульманин не стал рабом земных благ, увлекшись ими, а, напротив, честно и усердно трудился, чтобы заработанное им, кроме того, что необходимо для себя и потребностей семьи, тратил на добрые дела, чтобы удостоиться божественного благоволения.","Всевышний Аллах говорит: «А посредством того, что Аллах даровал тебе, стремись к Последней обители, но не забывай о своей доле в этом мире! Твори добро, подобно тому, как Аллах сотворил добро для тебя, и не стремись распространять нечестие на земле, ведь Аллах не любит распространяющих нечестие!»[3]","Смысл данного аята: «Тебе дарована прекрасная возможность заслужить вечную Райскую обитель, потому что ты обладаешь богатством, которого лишены многие другие. Раздавай милостыню, стремись снискать благоволение своего Господа и не сводите свою жизнь только к получению удовольствий для себя. Мы не требуем от тебя, чтобы ты, пренебрегая своей долей в этом мире, пожертвовал всем своим состоянием и остался нищим, но Мы призываем тебя раздавать часть имущества, чтобы ты мог обрести счастье в вечной жизни, и расходовать другую его часть на себя в этом мире. Так ты позаботишься о своей вере и последней жизни. Будь милостив по отношению к созданным и помни о том, как Всевышний Аллах одарил тебя великими щедротами. Не устремляйся к смутам на земле, не проявляй высокомерия, не совершай злодеяний и не забывай об Аллахе, Который наделил тебя неисчислимыми благами. Воистину, Он не любит бесчинствующих! Напротив, Он подвергает таких людей самому ужасному наказанию!»","Дорогие братья и сестры!","Первым негативным последствием увлеченности мирской жизнью является чрезмерное потребление. Существует целый спектр товаров и услуг, которые постоянно потребляет население мира: продукты питания, одежда и обувь, жилье, энергоносители, технологии, транспорт, образование, здравоохранение, финансовые и коммунальные услуги и т.д.. Чрезмерное потребление ведет к истощению ресурсов планеты, разрушению окружающей среды и ухудшению ее экологического состояния. Пока жители одной части планеты страдают от голода и жажды, другие уверены в том, жизнь дана для того, чтобы больше получать и больше тратить. Однако чрезмерное и неразумное потребление подрывает общечеловеческие моральные ценности. Сколько людей попало в долговую яму и оказалось в тяжелом материальном положении, оформив кредиты с процентами на покупку жилья, автомобиля или открытие и развитие бизнеса...","Сообщается, что Мутарриф передал от своего отца, что однажды он пришел к Пророку (салляллаху алейхи ва саллям), когда тот читал аят: «Страсть к приумножению увлекает вас…» (ат-Такасур, 1) и сказал: «Всевышний Аллах говорит: “О сын Адама! Это богатство – Мое богатство, ты Мой раб. Нет у тебя ничего из Моего богатства, кроме того, что ты съел и истратил, или того, что надел и износил, или того, что ты дал в милостыню и тем самым сохранил ее”.»[4]","Братья и сестры!","Предпочесть скромность вместо излишнего богатства, умеренность вместо расточительства, довольство имеющимся вместо безудержной страсти к земному – означает обрести гармонию между земной жизнью и вечной, сделав правильный вклад и в ту, и в другую. Не будем забывать, что земная жизнь – лишь короткое мгновение между моментом, когда мы открыли глаза, придя в этот мир, и моментом, когда мы закроем их, уходя в вечность. Не будем забывать, куда мы держим путь, и проявлять скромность и смирение, помня слова Всевышнего Аллаха Субханаху ва Та’аля (Преславен Он и Возвышен): «О люди! Воистину, обещание Аллаха истинно. Пусть не обольщает вас мирская жизнь, и пусть соблазнитель (дьявол) не обольщает вас относительно Аллаха»231, смысл которых:","«Знайте, что Аллах обещал воскресить вас и воздать каждому из вас за совершенные им деяния. У вас нет права сомневаться или колебаться, потому что аяты Небесных Книг и убедительные логические доводы не оставляют никаких сомнений в неизбежности будущей жизни. Если вы убеждены в том, что обещание Аллаха истинно, то начинайте готовиться к вечной жизни, не теряя своего драгоценного времени, совершайте много добрых дел и не идите на поводу у тех, кто мешает вам достичь этой цели. Не увлекайтесь прелестями и удовольствиями суетного мира, которые могут отвлечь вас от поклонения Всевышнему, ради которого вы сотворены. Не следуйте по стопам сатаны, который является вашим заклятым врагом и стремится ввести вас в заблуждение относительно Аллаха. 231."]}]}}},
{"id":42,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"О праздновании нового года — 1","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَلَئِنِ اتَّبَعْتَ أَهْوَاءَهُم مِّن بَعْدِ مَا جَاءَكَ مِنَ الْعِلْمِ إِنَّكَ إِذًا لَّمِنَ الظَّالِمِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ","Дорогие братья и сестры!","В этом прекрасном мире каждое создание знает своего Творца, неустанно возвеличивает, благодарит и поминает Его:","@ar:أَلَمْ تَرَ أَنَّ ٱللَّهَ يُسَبِّحُ لَهُ مَن فِي السَّمَاوَاتِ وَالأَْرْضِ وَالطَّيْرُ صَافَّاتٍ كُلٌّ قَدْ عَلِمَ صَلاَتَهُ وَتَسْبِيحَهُ وَاللَُّ عَلِيمٌ بِمَا يَفْعَلُونَ","«Разве ты не видел, что Аллаха славят те, кто на небесах и на земле, а также птицы с распростертыми крыльями? Каждый знает свою молитву и свое славословие. Аллах знает о том, что они совершают» (ан-Нур, 41).","К великому сожалению, большинство людей не знают своего Господа и далеки от поминания Его. Не зная истинной цели своей жизни, они блуждают в невежестве и, пытаясь найти утешение в мимолетных радостях, предаются различным празднествам и развлечениям, часто не вникая в их смысл.","@ar:تُسَبِّحُ لَهُ السَّمَاوَاتُ السَّبْعُ وَالأَْرْضُ وَمَن فِيهِنَّ وَإِن مِّن شَيْءٍ إِلاَّ يُسَبِّحُ بِحَمْدِهِ وَلَكِن لاَّ تَفْقَهُونَ تَسْبِيحَهُمْ إِنَّهُ كَانَ حَلِيمًا غَفُورًا","«Его славят семь небес, земля и те, кто на них. Нет ничего, что не прославляло бы Его хвалой, но вы не понимаете их славословия. Воистину, Он - Выдержанный, Прощающий» (аль-Исра, 44)","Животные, деревья, травы, кустарники, даже предметы, которые кажутся неживыми, – все – каждый на своем языке, славит Аллаха. Людям трудно понять, как восхваляют Аллаха творения, которые не владеют речью, однако Аллах ведает сокровенное и объемлет Своим знанием все творения.","Уважаемые братья и сестры!","Среди Его прекрасных Имен – “аль-Халим” (Снисходительный) и “аль-Гафур” (Прощающий). Аллах не спешит наказывать даже тех Своих рабов, которые приписывают Ему сына и празднуют его рождение, позволяя себе богохульство, от которого даже небеса и земля готовы расколоться, а горы – рассыпаться в прах. И даже этим грешникам Всемогущий Господь предоставляет отсрочку, наделяет благами, дарует благополучие, ниспосылает пропитание и оставляет открытыми для них Врата Покаяния. Но они вновь и вновь отвергают Его религию и не благодарят за бесчисленные блага. Если бы не терпение и всепрощение Господа, то небеса упали бы на землю, не оставив на ее поверхности ни одного живого существа, за те слова, которые они произносят, за празднества, которые они устраивают.","В прекрасные зимние дни, когда вся природа укрыта белоснежным покрывалом и погружена в глубокий сон, человек не задумывается и не спрашивает себя: «Если вся земля, горы и равнины покрыты снегом, реки и озера скованы крепким льдом, спят все деревья, закутавшись в белые пушистые одеяла, видят долгие сны в своих норах и берлогах лесные обитатели, не наступило ли время тишины и размышления о смысле этой жизни?»","Уважаемые мусульмане!","К сожалению, самый шумный и активно отмечаемый в нашей стране праздник, перешедший из язычества, Новый Год приходится именно на середину зимы. В то время, когда весь мир, укрытый снегом, замирает в состоянии постоянного поминания и благодарения Всевышнего Создателя, в этот порядок и покой вторгается хаос залпов петард, взрывов фейерверков, визга пил и стука топоров, губящих жизни миллионов хвойных деревьев, оглушительной музыки, шума массовых гуляний нетрезвых людей, забывших самих себя!","Каждый раз в преддверие Нового года тема запретности празднования его мусульманами поднимается с новой силой. Согласно Шариату, мусульманам не дозволено праздновать немусульманские праздники. В классических книгах исламского права по этому вопросу не существует разногласий, поэтому никакая другая точка зрения в связи с данной темой в наше время не может быть принята.","Но каждый раз находится немало людей, не желающие мириться с постановлением Священного Шариата. Эти люди так сильно хотят участвовать в новогодних языческих увеселениях, что закрывают глаза на хадисы, аяты и слова ученых. Их проблема в том, что они не могут понять причину решения Шариата и, основываясь на своем поверхностном понимании, утверждают, что какое-то решение устарело и неактуально. Но это не освобождает человека от его соблюдения.","Дорогие братья и сестры!","Обратимся же к аятам Корана и хадисам, ибо кто лучше, чем Аллах, Свят Он и Велик, и Его Посланник (салляллаху алейхи ва саллям) могут научить нас нашей религии?","«Потом Мы наставили тебя на путь из повеления. Следуй им и не потакай желаниям тех, которые не обладают знанием. Они нисколько не спасут тебя от Аллаха. Воистину, беззаконники являются помощниками и друзьями друг другу, а Аллах является Покровителем богобоязненных» (Cура «аль-Джасия», 18-19).","«А если ты станешь потакать их желаниям после того, как к тебе явилось знание, то тогда ты окажешься в числе беззаконников» (Сура «аль-Бакара», 145) (аят в начале хутбы).","Передается от Ибн ‘Умара, что Посланник Аллаха (салляллаху алейхи ва саллям) сказал: «Тот, кто уподобляется какому-либо народу, тот из них» (Абу Дауд, 4031) (хадис в начале хутбы).","Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","@ar:عَنْ أَبِي سَعِيدٍ رَضِيَ ٱللَّهُ عَنْهُ، أَنَّ النَّبِيَّ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ، قَالَ: «لَتَتَّبِعُنَّ سَنَنَ مَنْ قَبْلَكُمْ شِبْرًا بِشِبْرٍ، وَذِرَاعًا بِذِرَاعٍ، حَتَّى لَوْ سَلَكُوا جُحْرَ ضَبٍّ لَسَلَكْتُمُوهُ»، قُلْنَا يَا رَسُولَ اللَِّ: اليَهُودَ، وَالنَّصَارَى قَالَ: «فَمَنْ» »","«Поистине, будете вы следовать обычаям живших до вас, пядь за пядью и локоть за локтем, а кончится это тем, что если они проникнут в нору ящерицы, то и вы последуете за ними!» Мы спросили: «О Посланник Аллаха, ты имеешь в виду иудеев и христиан?» Он ответил: «Ну а кого же еще?» (аль-Бухари и Муслим).","Исламский ученый Абу Хафс аль-Кабир (радыйаллаху анху) сказал: «Если человек будет поклоняться Всевышнему Аллаху на протяжении пятидесяти лет, потом во время праздника Навруза подарит кому-нибудь из многобожников яйцо, почитая этот день, то совершит неверие (куфр), и все его дела падут прахом».","Абдуллах ибн ‘Умар (радыйаллаху анху) сказал: «Кто живет на земле многобожников, отмечает их Навруз и другие их праздники и будет уподобляться им до смерти, тот будет воскрешен с ними в Судный день»","Многие считают, что Новый год – это светский праздник, в отличии от Рождества, и поэтому Ислам не запрещает праздники такого рода. Но следует понимать, что любой праздник имеет свою идею. Например, празднование Нового года было придумано коммунистами как вид борьбы с религиозными праздниками. Задача введения этого праздника состояла в том, чтобы создать культ, который будет помогать вытеснять религиозные праздники различных народов, создавая нерелигиозное объединение людей.","Не секрет, что во многих мусульманских семьях Новый год любят больше, чем праздники Ураза-Байрам или Курбан-Байрам. Многие даже в дни двух мусульманских праздников не могут почувствовать праздничное настроение, в отличие от Нового года. В этом суть такого праздника – единение людей, оторванных от своих религиозных корней.","Культ Нового года содержит в себе много элементов магии, веры в силы природы, волшебство, даже если они преподносятся в игровой форме. Если дети будут воспитываться в такой атмосфере, они приобщатся к обычаям и убеждениям, противоречащим основам Единобожия.","Мы должны понимать, что сопричастность к этому празднику – это и сопричастность к тому массовому греху, которому люди предаются в эти дни: пьянству, прелюбодеянию, языческому буйству и бесовству. Неужели тот, кто верит в Аллаха и Его Посланника (салляллаху алейхи ва саллям), хоть в какой-то мере пожелает участвовать в этом сумасшествии?!","Пусть Аллах Всевышний убережет нас от козней шайтана, который показывает мерзкое прекрасным!","Пусть Аллах Всевышний сделает нас из тех, кто трепетно следует законам Священного Корана и Сунны!","Аминь!"]}]}}},
{"id":43,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"О праздновании нового года — 2","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:كُنتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنكَرِ وَتُؤْمِنُونَ بِاللَِّ وَلَوْ آمَنَ أَهْلُ الْكِتَابِ لَكَانَ خَيْرًا لَّهُم مِّنْهُمُ الْمُؤْمِنُونَ وَأَكْثَرُهُمُ الْفَاسِقُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:الدِّينُ النَّصِيحَةُ","Дорогие братья и сестры!","«Вы являетесь лучшей из общин, появившейся на благо человечества, повелевая совершать одобряемое, удерживая от предосудительного и веруя в Аллаха. Если бы люди Писания уверовали, то это было бы лучше для них. Среди них есть верующие, но большинство из них – нечестивцы». (Алю Имран, 110). То есть, эти сатанинские игрища, называемые Новым годом, можно использовать с благом для себя и окружающих – повелевая благое и удерживая от порицаемого.","И начать наш призыв к одобряемому следует с самих себя, определив правильную позицию в отношении праздников немусульман и четко следовать ей, подавая пример своим родственникам, соседям и знакомым.","Иначе, если мы сами не будем уверены в своей правоте, то наш призыв потерпит фиаско. В то же время это не означает, что нужно допускать грубость и неуважительность к людям, разъясняя им истину.","Пророки Муса и Харун вошли к фараону и начали разговор с наилучших слов. Несмотря на то, что перед ними был тиран, пророки по велению Всевышнего, обращались к нему с мягкостью и кротостью. И мы с уверенностью но, соблюдая приличия и деликатность, будем вести свой призыв.","Уважаемые братья и сестры!","Первыми, кого мы должны призывать – это наши дети, наша семья. Сделайте традицией встречать как праздник каждую пятницу, которая является лучшим днем для мусульман. Каждую пятницу мы должны устраивать себе праздник и создавать эту традицию среди своего окружения.","@ar:ذَلِكَ وَمَن يُعَظِّمْ شَعَائِرَ ٱللَّهِ فَإِنَّهَا مِن تَقْوَى الْقُلُوبِ","«…А тот, кто возвеличивает символы Аллаха, поистине – это от богобоязненности сердец...» (Сура «аль-Хадж», 32)","Основная причина такой упорной привязанности многих людей отмечать светские праздники – это невежество, незнание установлений Ислама и традиций мусульманских праздников. Мы должны поздравлять своих родных, близких, соседей с праздниками мусульман, приобщая их к традиции отмечать исламские праздники. Обязательно отправляйте им красивое поздравление, в интернете их можно найти на любой вкус. К поздравлению приобщите хадис, аят или красивое дуа.","Дарите детям и родным маленькие подарки в этот день, готовьте вкусную еду. Позвоните родственникам в четверг, накануне дня Джума и спросите о делах. И скажите, что готовитесь к празднику – делаете уборку, готовите праздничный пирог, потому что завтра самый лучший день для мусульман. Просвещайте и напоминайте, ибо Пророк (салляллаху алейхи ва саллям) сказал:","@ar:الدِّينُ النَّصِيحَةُ","«Ислам – это напоминание». Собирайтесь вместе, чтобы коллективно проводить мусульманские праздники.","Дорогие братья и сестры!","Не ожидайте мгновенного результата от своего призыва, но не отступайте, будьте настойчивыми и терпеливыми. Аллах – с терпеливыми. Вода камень точит, постепенно ваше усердие приведет вас к цели. Важно учитывать индивидуальность людей при этом – кому-то достаточно напомнить аят и или хадис, и он уже осознает свою ошибку, кается и оставляет свой грех. Другому нужно найти какие-то другие объяснения.","Например, об обычае наряжать елку…","Можно найти много информации на эту тему. Если коротко, то традиция наряжать елку заимствована у древних германских племен, которые почитали ель как дерево бессмертия и приносили людей и животных в жертву своему кровожадному божеству (ставшему прообразом Деда Мороза). Елку украшали головами и кишками жертв, которые потом заменили на расписные шарики и гирлянды. По сути, елка символизирует жертвенник языческого божества, и следовать этой традиции означает совершать явный куфр, от которого «все благие дела падут прахом».","Или, например, представить такую ситуацию…","Если вы на праздник Рамадан байрам (‘Ид-аль-фитр), совершив омовение, надев чистую одежду, пойдете в мечеть и в ряду совершающих праздничный намаз увидите своих соседей дядю Васю и дядю Колю, а потом увидите, что они на праздник Курбан байрам (‘Ид-аль-адха) порежут барашка и пойдут угощать мясом соседей в доме, что вы подумаете? Вы подумаете: «Мои соседи дядя Вася и дядя Коля стали мусульманами».","Но вот вы на Новый год ставите в своем доме украшенную елку, накрываете стол, на котором часто присутствует алкоголь, категорически запрещенный мусульманам, и в шапке то ли русского Деда Мороза, то ли американского Санты Клауса идете запускать фейерверки, не заботясь о том, что нарушаете права людей, которым ночью нужен покой. Что должны подумать о вас и о мусульманах ваши соседи дядя Вася и дядя Коля?","Если немусульмане не празднуют праздников мусульман, почему же мусульмане празднуют их праздники?","Дорогие мусульмане!","Кстати, соблюдающие христиане не отмечают этот праздник, т.к. на Новый год у них приходится строгий пост, который длится до Рождества. Есть также люди, не относящиеся к какой-либо религиозной конфессии, которые по своим убеждениям тоже не признают и не отмечают этот праздник, поэтому Новый год – это обычай только какой-то определенной части людей","«Поистине, будете вы следовать обычаям живших до вас, пядь за пядью и локоть за локтем, а кончится это тем, что если они проникнут в нору ящерицы, то и вы последуете за ними!» Мы спросили: «О Посланник Аллаха, ты имеешь в виду иудеев и христиан?» Он ответил: «Ну а кого же еще?» (аль-Бухари и Муслим).","Если запретным является следование иудеям и христианам, у которых есть какое-то понятие о Боге, то следовать за неверными означает полное отсутствие богобоязненности, поклонение желаниям своего нафса. Угождать нужно Всемогущему Создателю и Господу миров, а не грешным людям. Он не узаконил для нас эти праздники. Для мусульманина есть только два великих праздника – Курбан байрам и Ураза байрам, а также пятничный день. Запрещено уподобляться неверным, празднуя их праздники.","Пусть Аллах Всевышний даст нам всегда отличать добро от зла, благое от скверного, праведное от низменного!","Пусть Аллах Всевышний вложит в наши сердца любовь к Себе, к Своему Любимому Посланнику (салляллаху алейхи ва саллям) и к Своим праведным рабам и удостоит чести быть вместе с ними в этой жизни и вечном мире!","Аминь!"]}]}}},
{"id":44,"collection":"c9","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Зависть — 1","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قُلْ اَعُوذُ بِرَبِّ الْفَلَقِۙ","@ar:مِنْ شَرِّ مَا خَلَقَۙ","@ar:وَمِنْ شَرِّ غَاسِقٍ اِذَا وَقَبَۙ","@ar:وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِۙ","@ar:وَمِنْ شَرِّ حَاسِدٍ اِذَا حَسَدَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:لاَ حَسَدَ إِلاَّ فِي اثْنَتَيْنِ: رَجُلٌ آتَاهُ ٱللَّهُ الْقُرْآنَ فَهُوَ يَقُومُ بِهِ آنَاءَ اللَّيْلِ، وَآنَاءَ النَّهَارِ، وَرَجُلٌ آتَاهُ ٱللَّهُ مَالاً، فَهُوَ يُنْفِقُهُ آنَاءَ اللَّيْلِ، وَآنَاءَ النَّهَارِ","Уважаемые братья и сестры!","Зависть – один из распространенных пороков, появившихся вместе с родом человеческим. У каждого народа есть пословицы и поговорки, обличающие это постыдное чувство:","«Железо ржа съедает, а завистливый от зависти погибает», «Завидущие глаза не знают стыда», «Сосед спать не дает: хорошо живет». Народная мудрость поразительно точна, но что о зависти говорит Ислам? Пристало ли верующему человеку испытывать подобное чувство? Какая участь ожидает завистников?","О зависти есть множество хадисов. Пророк Мухаммад (салляллаху алейхи ва саллям) говорит:","«Остерегайтесь зависти, воистину, она пожирает благие дела, подобно тому, как огонь пожирает дрова» (Абу Дауд, 4903);","«У преподнесенных Аллахом даров есть враги. Это люди, завидующие тем, кого Аллах щедро наградил» (Табарани, от Ибн Аббаса).","Мусульманин не может радоваться, если его брат по вере попал в беду:","«Не радуйся из зависти, когда твой брат в беде. Потому что Всевышний Аллах может сделать так, что на его месте окажешься ты» (Тирмизи).","Братья и сестры!","Зависть наносит вред вере.","Завидуя, ты проявляешь недовольство предопределением Творца. Ты гневаешься на гармонию, существующую в мире людей, установленную Всевышним Господом в соответствии с Его Знанием о сокровенном.","Это противоречит сути Единобожия (таухида). Это подобно стреле, пущенной в глаз веры. Тебе достаточно осознать это, и тогда не потребуется никаких других аргументов против ее вреда. Встав на тропу зависти, ты оставляешь путь пророков и праведников, основанный на любви к рабам Всевышнего. Радуясь бедам мусульман и утрате ими благ и милостей Аллаха, ты радуешь неверующих и шайтана (дьявола). Это признак того, что сердце, наполненное грязными помыслами, поражено недугом.","Подобно тому, как огонь сжигает дрова, зависть сжигает твои благие деяния.","Зависть вредна для жизни.","Зависть лишает покоя. Она терзает тебя изнутри. Если Господь Аллах начинает одаривать еще большими благами того, кому ты завидуешь, по мере увеличения его успехов или благосостояния усиливается и твоя болезнь. Пропадает сон и аппетит, наступает моральное и физическое истощение, ведущие к погибели. Именно этого и добивается шайтан. Когда ты желаешь несчастья тому, кому завидуешь, на тебя самого обрушивается шквал бед.","И зависть твоя никак не уменьшит чужого благополучия. Она не может повлиять на количество и качество благ и даров, предопределенных их обладателю Всевышним Создателем. Он все равно получит то, что ему предначертано. Если ты уверен в обратном, то подумай о том, что если бы было иначе, то ни у кого не осталось бы ни единого блага.","Дорогие братья и сестры!","Если бы завистник мог увидеть свое состояние воочию, то впал бы в ужас. Движимый завистью, он уподобляется человеку, стреляющему в другого, желая убить его. Но пуля рикошетом попадает ему в глаз. В гневе он опять стреляет, но пуля вновь возвращается, поражая его второй глаз. После третьего выстрела пуля, возвращаясь, пробивает его мозг. А тем временем тот, кому он завидует, остается невредимым.","Состояние завистника даже хуже этого, потому что потерявший зрение страдает только в этой жизни, а завистник мучается и в этой, и в будущей жизни, так как будет отвечать за свой грех. Завистник навлекает на себя недовольство Аллаха и в итоге может попасть в Ад. Быть слепым лучше, чем быть брошенным в адский Огонь.","Уважаемые братья и сестры!","Если человек осознает все это, то сможет погасить пламя зависти в своем сердце. Ибо зависть уничтожает его, радует врага, становится причиной тревог и, в конце концов, навлекает недовольство Аллаха. Размышления о Величии, Могуществе и Владычестве Творца наполняют сердце человека ни с чем не сравнимым наслаждением и не оставляют места зависти. Его наслаждение не уменьшится, если появится еще кто-то другой, размышляющий таким же образом, а, напротив, только увеличится круг его друзей.","Зависть – это удел тех, кто удаляется от Рая и приближается к Аду. Из-за зависти к Адаму (мир ему) шайтан стал непокорным. Если ты благоразумный человек, заботящийся о себе, ищи милости Аллаха, путь к которой – в познании Его. Познать Аллаха через Его Качества (сыфаты) и Деяния – это значит познать тайны физического и духовного мира. Всеведающий Аллах сказал в Священном Коране:","«Мужи, которым ни торговля, ни купля не являются помехой помнить Аллаха» (ан-Нур, 24/37).","Другие не поймут такого наслаждения. Невкусивший не знает, незнающий не полюбит. Нелюбящий не ищет, неищущий не найдет. Ненашедший падет на уровень ниже животных (асфаля-сафилин).","В тафсире суры «аль-Фаляк» сказано, что если бы было чтото худшее, чем зависть, то в этой суре говорилось бы именно об этом. Однако в последнем аяте сказано:","«(Ищу защиты у Господа рассвета) от зла зависти завистника» (аль-Фаляк, 5).","Братья и сестры!","А кому же можно завидовать?","Пророк (салляллаху алейхи ва саллям) сказал (в хадисе, который мы прочитали в начале хутбы):","«Нельзя завидовать, кроме как двум:","1) Человеку, который знает Коран и читает его днем и ночью.","2) Человеку, которого Аллах наделил богатством, и он расходует это имущество днем и ночью (на пути Аллаха, для Ислама)» (аль-Бухари, № 7529; имам Муслим, № 815).","Да убережет нас Аллах от этого порока и отдалит от огня Ада.","Аминь!"]}]}}},
{"id":45,"collection":"c9","sn":"Уважаемые мусульмане!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Зависть — 2","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قُلْ اَعُوذُ بِرَبِّ الْفَلَقِۙ","@ar:مِنْ شَرِّ مَا خَلَقَۙ","@ar:وَمِنْ شَرِّ غَاسِقٍ اِذَا وَقَبَۙ","@ar:وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِۙ","@ar:وَمِنْ شَرِّ حَاسِدٍ اِذَا حَسَدَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:أَلْقَنَاعَةُ كَنْزٌ لاَ يَفْنَى","Уважаемые мусульмане!","Всевышний Господь пожелал, чтобы люди жили в обществе, и сделал так, чтобы они нуждались друг в друге. Различия в положении, которые существовали во все времена истории человечества, связаны с божественным предопределением и необходимы для испытания человека, которое он проходит в этом мире. Но эти различия могут порождать разные нежелательные отрицательные чувства, например, зависть.","Проявления зависти у разных людей многообразны. Зависть парализует благие наклонности человека, лишает здравого смысла, отравляет душу. По причине зависти вера и поклонение человека становятся слабыми, и жизнь его погружается в мрак. Поэтому Пророк (салляллаху алейхи ва саллям) сказал о зависти:","@ar:تَحْلُقُ الدِّينَ","«Она скашивает веру» (Ибрахим Джанан, Кутубу-Ситта, т. 278).","Завистник, желает, чтобы благо, которое он возжелал, было отобрано у человека, которому он завидует, и отдано ему. Если это невозможно, то он думает: «Если же не досталось мне, пусть не достанется и тебе!» и желает, чтобы обладатель этих благ лишился их. Завистник по отношению к человеку, которому он завидует, испытывает ненависть, пускает в ход предательство, месть, хитрость, осуждение, злословие. Свою короткую жизнь он проводит в бесполезных мыслях и беспокойстве.","Уважаемые мусульмане!","Зависть является проявлением недовольства по отношению к божественному предопределению и распределению. Человек не может знать, что на самом деле является добром, а что злом для него. И, может быть, его положение в настоящее время – это самое лучшее и благополучное положение для него.","Праведный Маруф Кархи говорил:","«Зрелый человек это тот, кто смотрит на богатых не с завистью, а извлекающим наставление, на бедных – не с высокомерием, а со смирением, на женщин – не с вожделением, а с состраданием».","Когда душа обретает тонкость и чуткость, из нее исчезают зависть и страсти, касающиеся мирского. Душа достигает степени понимания, что «ни твое имущество, ни мое не принадлежит нам, все принадлежит одному Аллаху».","Дорогие братья!","История зависти стара, как мир. И начинается она с Иблиса, который несмотря на то, что являлся учителем ангелов, был одним из джиннов, которые, как и люди, подвержены болезням нафса. Не осознав божественной мудрости в создании Адама (алехиссалям), он, обманувшись его телесной оболочкой, сотворенной из земли, позавидовал превосходству и почету, оказанному Адаму.","Он не знал, что повеление Аллаха поклониться Адаму было связано с тем, что он был наделен светом Мухаммада.","Другая известная история о том, как Кабиль убил Хабиля, учит и предупреждает, насколько зависть – отвратительное и опасное чувство, способное довести человека до преступления.","Еще один поучительный пример – это история пророка Юсуфа (алейхиссалям), который был брошен в колодец братьями, которых сжигала зависть к нему.","В благословенном хадисе говорится:","«Ни в коем случае не завидуйте! Потому что зависть съедает ваши хорошие поступки и благодеяния, как огонь съедает дрова». (Абу Дауд, Адаб, 44; Ибн Маджа, Зухд, 22)","Дорогие мусульмане!","Несмотря на то, что зависть является недостойным и осуждаемым чувством, но считается разрешенным ее проявление как желание получить и себе то же, что и у другого, но, чтобы это благо не исчезло у его обладателя.","В хадисе говорится:","«Можно завидовать только двоим Один из них – это тот, кому Аллах дал богатство, и он тратит его на пути Аллаха, второй же – тот, кому Аллах дал знание, и он поступает в соответствии с ним и учит других этому». (Бухари, Ильм 15; Муслим, Мусафирин, 268)","Можно завидовать богачу, который расходует свое имущество на благие дела, и ученому, который использует свое знание и передает его другим. Эта форма зависти, побуждающая к благому, которая превратилась в добродетель и стала полезной для вечной жизни. Можно завидовать положению пророков и праведников, являющихся образцовыми личностями.","Уважаемые мусульмане!","Единственное лечение зависти, одного из самых опасных порицаемых качеств, состоит в обретении удовлетворенности своим положением. Ведь духовные богатства, получаемые сердцем от этой удовлетворенности, никогда не иссякнут. Поэтому Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","@ar:أَلْقَنَاعَةُ كَنْزٌ لاَ يَفْنَى","«Воздержанность – это сокровищница, которая не иссякнет». (Дайлями, Муснад, 4699)","Следовательно, настоящая единица измерения богатства – это скромность, довольство божественным распределением. Богатство – в том, чтобы не завидовать тем, чьи возможности больше твоих. Настоящий вкус богатства можно ощутить только в воздержанности и удовлетворенности своим положением.","Совершенный человек не испытывает страданий из-за удела и материальных благ. Он ищет не удел и блага, а ищет Аллаха, того, кто наделяет уделом и благами. Не завидует глазами и душой возможностям и благам других. Всегда находится в довольстве.","О Аллах! Убереги нас от пламени страстей и зависти, которая сжигает благочестивые поступки, словно огонь, сжигающий дрова! Укрась нас воздержанностью и довольством, которые являются нескончаемой и неиссякаемой сокровищницей блага!","Аминь!"]}]}}},
{"id":46,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура «Лукман», 31/20.","Сура «аль-Маида», 5/90-91.","Муслим, 2003.","Ахмад, 1/316, 2/25; Абу Дауд, 3674; ат-Тирмизи, 1295; Ибн Маджа, 3380, 3381; Ибн Хиббан, 5356; аль-Хаким, 2/37.","ат-Табарани, аль-Кабир, 428; ибн Ахмад аш-Шайбани, аль-Фаваид, 46.","аль-Бухари, Тарих аль-Кабир, 1/1/386; Ибн Маджа, 3375.","Ибн Маджа 3376.","Ибн Маджа, Ашриба, 1.","Абу Дауд, Ашриба, 5/3681; Тирмизи, Ашриба, 3/1865.","Бухари, Муслим, Аль-Лу’-Лу’уу валь Марджан, Китаб Аль-Ашриба № 1303.","Бухари. Муслим, Рияд ас-Салихин пер. том 3: № 1839"],"bibliography":[],"versions":{"ru":{"title":"Алкоголизм, наркомания и азартные игры","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَٓا اَيُّهَا الَّذٖينَ اٰمَنُٓوا اِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالاَْنْصَابُ وَالاَْزْلاَمُ رِجْسٌ مِنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:كُلُّ مُسْكِرٍ خَمْرٌ، وَكُلُّ مُسْكِرٍ حَرَامٌ، وَمَنْ شَرِبَ الْخَمْرَ فِي الدُّنْيَا فَمَاتَ وَهُوَ يُدْمِنُهَا لَمْ يَتُبْ، لَمْ يَشْرَبْهَا فِي الآْخِرَةِ","Дорогие братья и сестры!","Аллах Всевышний сотворил человека и поставил на службу ему все, что есть в этом мире:","«Неужели вы не уразумели, что Аллах подчинил вам то, что на небесах и на земле, и одарил вас милостями и явными, и недоступными [вашему пониманию]?»[1]","При этом по Своей божественной мудрости Он запретил некоторые вещи, сделав это испытанием для людей в этом мире. Несомненно, в том, что запрещено, есть вред и зло для человека. Запрещенного в Исламе не так много, в то время как разрешенное безгранично. Но человек создан так, что его страсти и сатанинские наущения неизменно толкают его к запретному. В настоящее время наше общество поражено такими страшными болезнями, как пьянство, наркомания и игромания.","Уважаемые братья и сестры!","Всевышний Творец возвысил человека над всеми созданиями, наделив его разумом и интеллектом. Все благое и полезное как для этой, так и для вечной жизни, человек достигает посредством ясного разума и сознания. Алкоголь убивает клетки мозга, убивает разум.","Действие алкоголя, разрушающего весь организм человека, подобно медленно действующему яду. Он является причиной хронической депрессии, неадекватного поведения, снижения умственной и физической активности и может вызывать такие опасные болезни, как инфаркт, панкреатит, рак поджелудочной железы, цирроз печени, нефропатия и другие.","Под действием алкоголя происходят изменения в структуре генетического кода ДНК, которая содержит информацию о человеке и передается его потомкам. Уже давно ученые пришли к заключению, что 90% детей с умственными и физическими отклонениями рождаются у людей, злоупотребляющих алкоголем.","Уважаемые братья и сестры!","Когда разум покидает человека, он теряет самого себя и становится игрушкой в руках сатаны, извечного врага человечества. Наущая к дурному и преступному, он отвращает человека от намаза и поклонения, искушает к забвению Бога, делает «нищим в вечности».","«О те, которые уверовали! Воистину, опьяняющие напитки, азартные игры, каменные жертвенники (или идолы) и гадальные стрелы являются скверной из деяний сатаны. Сторонитесь же ее, – быть может, вы преуспеете. Воистину, сатана при помощи опьяняющих напитков и азартных игр хочет посеять между вами вражду и ненависть и отвратить вас от поминания Аллаха и намаза. Неужели вы не прекратите?»[2]","Употребление алкоголя было строго запрещено мусульманам в 4-м году хиджры. Когда Посланник Аллаха (салляллаху алейхи ва саллям) прочитал сподвижникам ниспосланные аяты о запрете употребления вина, они сказали: «О Господь, мы прекратили!» Те, кто в тот момент сидели и пили вино, вылили содержимое стаканов на землю и разбили кувшины с остатками вина. Потом жители Медины выносили вино, которое было в их домах, и выливали на землю. По улицам Медины в те дни текли реки вина.","Вначале проповеди был прочитан хадис. Когда Посланника Аллаха (салляллаху алейхи ва саллям) спросили о том, что считается вином, он ответил:","«Все, что опьяняет – это вино, и все опьяняющее является запретным».[3]","Это означает, что все опьяняющее является запретным, независимо от того, из чего оно сделано и как называется – водка, вино, ликер, виски, пиво и т.д.","Дорогие братья и сестры!","Аллах Всевышний проклял десять категорий людей, связанных с алкоголем. Пророк (салляллаху алейхи ва саллям) говорил:","«Явился ко мне ангел Джибриль и сказал: “О Мухаммад! Поистине, Всевышний Аллах проклял вино [и десятерых, кто связан с ним]. Он проклял само вино; и того, кто его выжимает (производит); и того, кому его выжимают (производят); и того, кто его несет; и того, кому его несут; и того, кто его продает; и того, кто его покупает; и того, кто ест заработанное на нем; и того, кто его пьет; и того, кто им поит”».[4]","Посланник Аллаха (салляллаху алейхи ва саллям) предупреждал:","«Тот, кто выпьет вино, лишится довольства Аллаха на сорок дней, а если умрет в таком состоянии, то умрет неверующим (кяфиром)».[5]","«Человек, пристрастившийся к вину (спиртному) подобен идолопоклоннику».[6]","«Человек, пристрастившийся к вину (спиртному), не войдет в Рай!».[7]","«Ни в коем случае не пей вино, ибо поистине оно является ключом ко всякому злу!»[8]","«Все, что опьяняет в большом количестве, запретно (харам) и в малом».[9]","Поэтому не надо обманывать себя, думая, что от алкоголя, выпитого в малом количестве, не будет вреда. Закрывая человеку путь к греху, Ислам устанавливает запреты, основанные на мудрости и абсолютном знании природы людей. Поэтому мусульманин не может употреблять алкоголь ни сам, ни позволять это другим. Он не сядет за стол, где предлагают спиртное, не будет использовать его в качестве лекарства. Пророк (салляллаху алейхи ва саллям) сказал: «Вино – не лекарство, а недуг».","Если мусульманин, поддавшись страсти и наущением шайтана, выпил спиртное, то должен немедленно покаяться и никогда больше не возвращаться к этому греху, ибо в хадисе сказано:","«Тот, кто, испив чашу вина в мирской жизни, не покается в этом, уйдя в мир иной, не вкусит вин садов райских».[10]","Все, что сказано об алкоголе, касается и наркотиков, таких как морфий, опий, кокаин, героин и другие. Исключение составляют препараты, используемые с медицинской целью под контролем врача.","Уважаемые братья мусульмане!","Азартные игры – это «риск деньгами с расчетом моментально увеличить их с наименьшими затратами сил, подразумевающий присвоение чужих денег». Если один из играющих непременно выигрывает, то все остальные проигрывают. Проигравший продолжает игру для того, чтобы вернуть проигрыш, а выигравший – для того, чтобы выиграть еще больше. Поэтому, как бы ни назывались азартные игры, там, где есть выигравший и проигравший, присутствует азарт, а то, что возбуждает азарт, является запретным (харам).","Запрет на азартные игры настолько строг в нашей религии, что даже приглашение к этому занятию считается предосудительным. Об этом в одном из хадисов говорится:","«Тот, кто скажет своему другу: «Идем, поиграем в азартные игры», пусть пойдет и подаст милостыню».[11]","Уважаемые мусульмане!","Алкоголизм, наркомания и пристрастие к азартным играм, уничтожая в человеке все человеческое, – любовь и дружбу, стыд и совесть, сеют в душах людей и в обществе семена вражды, ненависти и зависти, представляют убийство человека чем-то малозначительным, приводят к ранним смертям, распаду семей и осиротению детей.","Алкоголь, наркотики и азартные игры, которые в Священном Коране называются «мерзостью из деяний сатаны», категорически запрещены верующим. Поэтому мусульманин должен отстраниться от всего этого. А те, кто не может побороть свое пристрастие, которое приводит человека к физическому, материальному и моральному падению, лишает счастья жизни земной и жизни вечной, должны знать, что они ослушались Аллаха и служат сатане. Каждый из нас должен помнить, что обрести счастье и радость можно лишь в покорности Аллаху и Его Посланнику (салляллаху алейхи ва саллям).","Да убережет Всевышний Аллах нас, наших близких и всю умму от мерзостей из деяний сатаны! Пусть наш ум всегда будет ясным, сердце – чистым, наполненным верой, устремленным к довольству Аллаха и Его Раю! Аминь!"]}]}}},
{"id":47,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура аль-Бакара, 2/102.","Суры аль-Аʼраф, 7/116; Юнус, 10/76-81; Таха, 20/69; аз-Зухруф, 43/30; аз-Зарият, 51/52.","Суры аль-Аʼраф, 7/111-126; Юнус, 10/76-82; Таха, 20/65-73; аш-Шуʼара, 26/34-51.","Сура Таха, 20/72.","Сура Таха, 20/73.","Сура аль-Аʼраф, 7/126.","Бухари, Васая, 23; Тыб, 48; Худуд, 44; Муслим, Иман, 145.","Насаи, Тахримуд-дам, 19/4076.","Сура аль-Фаляк, 113/1-5."],"bibliography":[],"versions":{"ru":{"title":"«Сихр» (Магия и колдовство)","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَى مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّى يَقُولاَ إِنَّمَا نَحْنُ فِتْنَةٌ فَلاَ تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلاَّ بِإِذْنِ ٱللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلاَ يَنفَعُهُمْ وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الآْخِرَةِ مِنْ خَلاَقٍ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنفُسَهُمْ لَوْ كَانُوا يَعْلَمُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:«اجْتَنِبُوا السَّبْعَ المُوبِقَاتِ»، قَالُوا: يَا رَسُولَ ٱللَّهِ وَمَا هُنَّ؟ قَالَ: «الشِّرْكُ بِاللَِّ، وَالسِّحْرُ، وَقَتْلُ النَّفْسِ الَّتِي حَرَّمَ ٱللَّهُ إِلاَّ بِالحَقِّ، وَأَكْلُ الرِّبَا، وَأَكْلُ مَالِ اليَتِيمِ، وَالتَّوَلِّي يَوْمَ الزَّحْفِ، وَقَذْفُ المُحْصَنَاتِ المُؤْمِنَاتِ الغَافِلاَتِ»","Дорогие братья и сестры!","«Сихр» в переводе с арабского означает «магия» и «колдовство». Колдовство является запретным в Исламе и считается проявлением неверия (куфра). Несмотря на это, оно продолжает привлекать к себе внимание многих людей.","Колдовство, воздействуя на человека скрытно, на расстоянии, когда он находится в неведении об этом, причиняет ему большой вред. Поэтому спрос и наказание за этот грех суровы. Занимаются колдовством те, кто не боится Аллаха, не верит в Него или чья вера слаба. Демоны направляют людей к колдовству и обучают их этому. В Коране сказано","«Они последовали за тем, что читали дьяволы в царстве Сулеймана (Соломона). Сулейман (Соломон) не был неверующим. Неверующими были дьяволы, и они обучали людей колдовству… Они знали, что тому, кто приобрел это, нет доли в Последней жизни. Скверно то, что они купили за свои души! Если бы они только знали!»[1]","Аят указывает на то, что «сихр» и «куфр» являются равноценными по тяжести грехами, и этого вполне достаточно, чтобы понять гнусность колдовства, ибо в этих действиях содержится скрытый вызов превзойти волю и могущество Аллаха.","Всемогущий Аллах послал двух ангелов – Харута и Марута в Вавилон с некоторыми знаниями, чтобы люди использовали их для добрых дел, но также с целью испытания. Эти ангелы научили евреев и другим знаниям. Они советовали: «Не злоупотребляйте теми знаниями, которым мы вас научили, ибо в этом случае они станут источником смуты и могут привести вас к неверию. Будьте осторожны, совершая колдовство, не становитесь неверными». Но демоны из джиннов и людей не вняли наставлениям ангелов, передавая знания магии и колдовства, распространяя грех и разрушая души людей.","Дорогие мусульмане!","Когда разговор заходит о магии, то на ум приходит магия на разлучение супругов или приворот, магия на успех и на другие случаи жизни. Многие, не осознавая всех последствий этих действий. не воспринимают их серьезно. А ведь «сихр» может убить человека или свести с ума. В некоторых случаях демон может задушить человека или возбудить у него страшные заболевания (СПИД, онкология и т.д.). Самая страшная магия – это магия куфра (атеизма). Сила магии зависит от силы и неверия колдуна и силы его демонов.","Однако из этого не следует, что колдуны обладают невероятными способностями и им подвластно абсолютно все. Истинное воздействие заключается не в «сихре», не в колдунах, не в силах природы, не в духах, не в демонах и не в ангелах. Все находится во Всемогущей Воле Аллаха. Когда Господь с целью испытания лишает человека защиты, только тогда колдуны могут причинить ему вред. Поэтому бояться нужно, прежде всего, Всевышнего Аллаха, прибегать к Его защите и постоянно читать Его Книгу – Священный Коран.","Колдовство приносит только зло. Очевидно, что люди, которые, отринув Книгу Аллаха и добро, выбрали для себя такое греховное занятие, в вечной жизни будут в величайшем убытке. Поддавшись влиянию дьявола и собственных страстей, они толкают себя к погибели, приносят в жертву свою вечную жизнь.","Дорогие братья и сестры!","Всевышний Господь сообщает, что божественные откровения, ниспосланные пророкам, являются истинными и ничего общего не имеют с колдовством. Также в Коране говорится, что колдовство противоречит учению пророков, а обвинение в нем является клеветой на них. Колдуны, где бы они ни были, и что бы ни делали, не достигнут успеха и счастья и не спасутся от божественного гнева.[2]","В Коране рассказывается, как чародеи Фараона вступили в состязание с пророком Мусой (алейхиссалям). Увидев чудо, явленное пророком Аллаха, они отказались от награды, обещанной Фараоном и, хотя хорошо сознавали, какая мучительная казнь их ждет, раскаялись и без колебаний уверовали в Аллаха.[3]","«Они сказали: “Мы не отдадим тебе предпочтения перед ясными знамениями, которые явились нам, и перед нашим Творцом. Выноси же свой приговор! Воистину, ты выносишь приговор только в мирской жизни”».[4]","«Воистину, мы уверовали в нашего Господа для того, чтобы Он простил нам наши грехи и колдовство, к которому ты нас принудил. Аллах лучше и долговечнее».[5]","«Господь наш! Ниспошли нам терпение и упокой нас мусульманами».[6]","Однажды Посланник Аллаха (салляллаху алейхи ва саллям) сказал своим сподвижникам:","• Сторонитесь семи вещей, которые ведут человека к погибели!","Его спросили:","• О Посланник Аллаха! А что это за вещи?","Он ответил:","• Придавать равных Аллаху, заниматься колдовством, убить невинного человека, жить на проценты, растрачивать имущество сирот, убегать с поля боя, клеветать на целомудренную женщину.[7]","Также Пророк (салляллаху алейхи ва саллям) сказал:","«Кто, завязав узел и подув на него, совершит колдовство, тот впадет в язычество (ширк). Кто (, надеясь, что это принесет пользу,) повесит на себя когти, кости животных, будет оставлен с этим (то есть, Аллах лишит его Своей защиты и милости)».[8]","Дорогие мусульмане!","Тем, кто пострадал от колдовства, для избавления от его последствий не следует обращаться к несведущим людям. Прежде всего нужно прибегать в мольбах к помощи Аллаха, раздавать милостыню нуждающимся. Если есть ученый человек, известный своей праведностью, который может помочь пострадавшим от колдовства, можно обратиться к нему.","Обучая нас способам защиты от вреда колдунов и указывая, к чьей помощи нужно прибегать, Всевышний Аллах повелевает:","«Скажи: “Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла колдуний, дующих на узлы, от зла завистника, когда он завидует”».[9]","Да защитит нас Аллах от всякого зла на земле и небесах, ибо Он – Создатель и Повелитель всего сущего!","Аминь!"]}]}}},
{"id":48,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура аль-Фуркан, 25/67.","Сура аль-Исра, 17/26-27.","Хайсами, 2/280.","Бухари, аль-Адабуль-муфрад, № 471; Ибн Сад, 8/50.","Сура аль-Аʼраф, 7/31.","Ат-Тирмизи, 2381; Ибн Маджа 3/217.","Абу Дауд, Тахарат, 45/96.","Один «са» составляет четыре «мудд». «Са» – 3,328 кг, «мудд» – 832 грамма.","Ибн Маджа, Тахарат, 1.","Сура аль-ʼАср, 1-3.","Ибн Маджа, Мукаддима, 17.","Сура аль-Муʼмин, 40/28.","Сура аль-Анбия, 21/9.","Сура аш-Шуʼара, 26/151-152."],"bibliography":[],"versions":{"ru":{"title":"Избегайте расточительства (Исраф)","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَالَّذِينَ إِذَا أَنفَقُوا لَمْ يُسْرِفُوا وَلَمْ يَقْتُرُوا وَكَانَ بَيْنَ ذَلِكَ قَوَامًا","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:«ما مَلَ آدَمِيٌّ وِعَاءً شَرًّا من بطن، بِحَسْبِ ابن آدم أُكُلاَتٍ يُقِمْنَ صُلْبَه،ُ فإن كان لا مَحَالةَ، فَثُلُثٌ لطعامه، وثلث لشرابه، وثلث لِنَفَسِهِ»","Дорогие братья и сестры!","Материальные и духовные возможности, дарованные Всевышним Творцом, являются для человека ответственностью (аманатом). Каким образом их нужно использовать разъяснено аятами и хадисами. В Судный день каждый будет спрошен за блага, которыми был наделен, поэтому нельзя тратить их на греховное – на запрещенное религией, на бессмысленную роскошь, взятки, подкуп. Ислам запретил все виды расточительства (исрафа). Даже излишние расходы без острой нужды считаются расточительством.","Кто тратит чрезмерно, через некоторое время попадает в зависимое положение от других, поэтому в любых тратах – как на собственные потребности, так и на оказание помощи кому-то – нужно придерживаться умеренности. Не следует быть скупым, но и не следует быть излишне расточительным, чтобы не ввести в трудное положение себя и тех, кто находится на вашем попечении. Всевышний Аллах повелевает:","«Когда они делают пожертвования, то не расточительствуют и не скупятся, а придерживаются середины между этими крайностями».[1]","«Раздавай должное родственнику, бедняку и путнику, но не расточай чрезмерно. Воистину, расточители – братья шайтанов, а ведь шайтан неблагодарен своему Господу».[2]","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Кто экономит, тот никогда не впадает в нужду».[3]","Кесир бин Убайд, невольник, освобожденный Абу Бакром, и молочный брат благородной Айши, рассказывал: «Однажды я отправился к Айше. Она сказала мне:","• Подожди снаружи. Мне нужно зашить платье.","Я заметил:","• О мать правоверных! Если я пойду и расскажу об этом людям, они назовут тебя скупой.","В ответ она сказала:","• Лучше занимайся своими делами! Кто не носит старое, у того не может быть нового![4]","Благородная Айша (радыйаллаху анха) была щедрым человеком, но сама вела очень скромный образ жизни, что позволяло ей больше отдавать нуждающимся.","Во все времена среди мусульман были такие, которые старались больше средств вкладывать в благие дела, ограничивая себя даже в необходимом. Они желали увековечить эти средства, отправив их впереди себя в вечный мир (ахират).","Дорогие мусульмане!","В наше время благосостояние людей значительно улучшилось, и чрезмерные траты на питание теперь являются одним из распространенных видов расточительства. Человек должен помнить, что еда – не цель жизни, а средство поддержания ее. Чрезмерность в еде является расточительством и в отношении материальных средств, и в отношении физического здоровья, ибо переедание приводит к болезням. В то время, как много людей страдает от голода, много других людей страдает от болезней, вызванных неумеренным потреблением пищи. Если бы одни делились излишками еды с другими, все обрели бы покой. Всевышний Аллах повелевает:","«О сыны Адама! Отправляясь в мечеть, облекайтесь в красивые одежды. Ешьте и пейте, но не расточительствуйте, ибо Он не любит расточительных».[5]","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Не наполнял человек худшего сосуда, чем его собственный желудок! Достаточно сыну Адама нескольких кусочков пищи, чтобы поддерживать свои силы. Но если уж неизбежно (для него поесть больше), пусть треть его желудка будет для еды, треть – для питья, а треть – для воздуха».[6]","Уважаемые мусульмане!","О других видах расточительства Посланник Аллаха (салляллаху алейхи ва саллям) сказал следующее:","«Из этой уммы в будущем придет группа людей, которые при очищении (используя чрезмерно много воды) и при молитве (громким голосом прося о никчемных вещах) перейдут разумные пределы».[7]","Акил бин Абу Талиб (радыйаллаху анху) передал слова Пророка (салляллаху алейхи ва саллям):","«Для очищения (тахарата) вполне достаточно одного “мудд” воды, а для полного омовения (гусуль) – одного “са”».[8]","Один из присутствующих заметил:","• Нам не хватит такого количества воды.","В ответ Акил (радыйаллаху анху), имея в виду Пророка (салляллаху алейхи ва саллям), заметил:","• Столько воды хватало для человека, который был гораздо лучше тебя, и волосы которого были гораздо длиннее твоих.[9]","Не следует излишествовать и совершая мольбу. Считается неуместным делать «дуа» в стихотворной форме, подбирая рифму к словам, произносить ее громким голосом и просить о никчемных вещах.","Дорогие друзья!","После веры самым большим даром Всевышнего Аллаха является время, которое часто люди не замечают и не ценят. Господь Бог в Коране очень часто клянется временем суток, а значит это является очень дорогим, иначе Господь не упоминал бы об этом в Коране и не клялся бы этим:","«Клянусь предвечерним временем, что люди несут убытки, кроме тех, которые уверовали, совершали праведные деяния, заповедали друг другу истину и заповедали друг другу терпение!»[10]","Имам Шафии говорил:","«Если бы люди как следует размышляли над сурой “аль-ʼАср”, этого для них было бы вполне достаточно, и они были бы спасены».","Расточительством является обучение знаниям людей, которые не достойны этого и имеют дурные намерения. В хадисе это объясняется посредством такого сравнения:","«Приобретение знаний является обязанностью для каждого мусульманина. А тот, кто дает это знание не заслуживающим его, подобен тому, кто вешает на свиней алмазы, жемчуг и золото».[11]","Уважаемые мусульмане!","Одним из видов расточительства, несущим огромный вред человеку, является духовное расточительство. Когда человек, не желая принимать божественные повеления, а следуя только своим низменным страстям, ведет аморальный, образ жизни, то постепенно скатывается в положение хуже животных. Таких людей постигает божественный гнев, и они, потеряв все в обоих мирах, уходят в небытие. О тех, кто, расточая свою духовность, погряз в непокорности, смуте и безнравственности, Всевышний Аллах повелевает:","«Воистину, Аллах не ведет прямым путем того, кто расточительствует и лжет».[12]","История человечества на множестве примеров учит тому, какая судьба уготована Всемогущим Творцом этим грешникам за их мерзкие дела.[13] Предостерегая Своих рабов, Аллах Всевышний говорит:","«И не слушайтесь повелений преступников, которые распространяют на земле нечестие и ничего не улучшают».[14]","Дорогие мусульмане!","Итак, расточительство (исраф) может проявляться в любых сферах жизни, начиная с излишеств в еде, одежде, и заканчивая лютой ненавистью и безумной любовью. Всегда нужно стараться соблюдать умеренность, не впадая ни в одну из крайностей – не быть расточительным и не быть скупым.","Но при этом нужно чувствовать разницу между расточительством (исраф) и щедростью. Расточительность означает чрезмерную или ненужную трату. А щедрость – это бескорыстное пожертвование на то, что действительно необходимо. Более высокой степенью щедрости является «исар», то есть, будучи нуждающимся, предпочитать нужду братьев по вере.","Зачастую люди, когда дело касается их самих или их близких, проявляют невиданную щедрость, но когда дело касается нуждающихся, то они бывают очень осторожны и расчетливы. Такой подход означает неправильное понимания щедрости.","Лучший пример того, как следует правильно расходовать средства, дарованные Аллахом, можно найти в жизни нашего Пророка (салляллаху алейхи ва саллям), поэтому самым коротким путем избавления от расточительности и скупости является изучение жизни и Сунны Пророка (салляллаху алейхи ва саллям) и практическое применение полученных знаний.","Пусть Аллах Всевышний даст нам знание и понимание того, кто является истинным Владыкой всех мирских благ! Пусть наделит нас способностью делиться с нуждающимися теми благами, которые нам ниспосланы в этом мире, чтобы они принесли нам прибыль в мире вечном!","Аминь!"]}]}}},
{"id":49,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Багдади, аль-Фарк байналь-фирак, Бейрут 1990, с. 272.","Сура аль-Анʼам, 6/27-28.","Сура аль-Муʼминун, 23/99-100.","Сура Йасин, 36/31.","Суры аль-Анбия, 21/95. см. аль-Аʼраф, 7/53; Фатыр, 35/37; Ибрахим, 14/44; аль-Мунафикун, 63/10-11; Марьям, 19/67; ан-Нахль, 16/78.","Сура аль-Муʼминун, 23/15-16.","Тирмизи, Тафсир, 3/3010.","Бухари, Джанаиз, 68, 87; Муслим, Масаджид, 123.","Байхаки, Далаиль, 5/75-76."],"bibliography":[],"versions":{"ru":{"title":"Ошибочность веры в переселение душ","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَلَوْ تَرَى إِذْ وُقِفُوا عَلَى النَّارِ فَقَالُوا يَا لَيْتَنَا نُرَدُّ وَلاَ نُكَذِّبَ بِآيَاتِ رَبِّنَا وَنَكُونَ مِنَ الْمُؤْمِنِينَ","@ar:بَلْ بَدَا لَهُم مَّا كَانُوا يُخْفُونَ مِن قَبْلُ وَلَوْ رُدُّوا لَعَادُوا لِمَا نُهُوا عَنْهُ وَإِنَّهُمْ لَكَاذِبُونَ","Дорогие братья и сестры!","Во многих религиях существует учение о реинкарнации – повторном воплощении души в новом теле после смерти. Те, кто верят в реинкарнацию, считают, что душа после смерти переселяется из одного тела в другое и так проживает несколько жизней. Души тех, кто прожил благую жизнь, в следующей реинкарнации занимают более высокий уровень, а души плохих людей могут переселиться даже в животных.","До Ислама это учение было распространено среди египтян, древних греков, у северных народов, индейцев Америки, у езидов. В истории Ислама подобных представлений придерживались такие заблудшие секты, как Кадариты и Рафидиты.[1] У некоторых радикальных шиитских течений, таких как исмаилиты и кармаиты также существует вера в реинкарнацию души человека. Особенно широкое развитие это учение получило в индуизме и через различные его направления повсеместно распространилось в наши дни.","Уважаемые друзья!","Возникает закономерный вопрос, допустимо ли мусульманину верить в реинкарнацию, то есть в то, что душа человека после смерти приобретает новое тело и возвращается в этот мир, чтобы прожить новую жизнь?","Идея реинкарнации душ несовместима с вероучением Ислама, верой в Судный день и вечную жизнь. Всевышний Аллах повелевает:","«Если бы ты только увидел их, когда их остановят перед Огнем. Они скажут: “О, если бы нас вернули обратно! Мы не считали бы ложью знамения нашего Господа и стали бы верующими!” О нет! Им открылось то, что они скрывали прежде. Если бы их вернули обратно, то они непременно вернулись бы к тому, что им было запрещено. Воистину, они – лжецы».[2]","«Когда же смерть подступает к кому-нибудь из них, он говорит: “Господи! Верни меня обратно. Быть может, я стану совершать праведные поступки, которые я отбросил”. Но нет! Это – всего лишь слова, которые он произносит. Позади них будет преграда вплоть до того дня, когда они будут воскрешены».[3]","«Неужели они не видят, сколько поколений Мы погубили до них, и что они не вернутся к ним?»[4]","«Запрет лежит на селениях, которые Мы погубили, и они не вернутся».[5]","После описания стадий сотворения человека говорится:","«После этого вы непременно умрете. А потом, в День воскресения, вы непременно будете воскрешены».[6]","Павшие за веру пожелают вновь вернуться в земную жизнь, чтобы снова и снова пасть на пути Аллаха, но Господь ответит им:","«Я ранее повелел: “Умершие люди больше не вернутся обратно”».[7]","Во многих хадисах также сообщается о допросе умершего ангелами и о том, что могила, в зависимости от состояния человека, может стать для кого-то райским садом, а для кого-то – ямой Ада.[8] Все это доказывает, что душа не переселяется в другое тело, и люди не могут вернуться обратно в этот мир после смерти.","Уважаемые мусульмане!","С точки зрения учения реинкарнации невозможно объяснить причину внешнего и внутреннего сходства детей и родителей, причину постоянного увеличение населения земного шара.","Что касается людей, обладающих даром провидения и сообщающих сведения из прошлого, то они получают эти сведения от джиннов и демонов, которые живут намного дольше людей. Поддаваясь обману джиннов, все начинают верить, что этот человек раньше уже жил на этом свете.","Некоторые «ясновидящие» вызывают духов, святых или пророков и разговаривают с ними. Подобные сеансы являются запретными для мусульман. Нужно знать, что большей чвстью, на так называемых сеансах «общения» с духами, если это даже не явное шарлатанство, принимают участие джинны, которые вводят людей в заблуждение. Эти творения видят нас, но по милости Творца, мы не видим их. Среди джиннов есть как верующие в Аллаха, так и неверные, последовавшие за Иблисом, и их большинство.","Иблис, главный враг человека, и его приспешники идут на любые уловки, чтобы сбить потомков Адама с пути истины. Джинны могут принимать различный облик, как людей, так и животных, имитировать внешность и голос конкретного человека. Известно много примеров, когда джинны являлись в образе умерших людей, говорили их голосом, принимая их облик. Если сведения, полученные в результате таких сеансов, противоречат основам нашей религии, то, несомненно, источником их являются наущения джиннов и шайтанов.","У слуг дьявола имеется множество разных способов обмана. Шайтаны имеют способность вселяться в скульптуры. статуэтки, изваяния. Известно, что в доисламский период у арабов шайтан входил в их идолов и разговаривал с людьми. А во время завоевания Мекки из идола, которого звали Найле, вышло существо в образе отвратительной старухи, которое видели несколько сподвижников.[9] После прихода Ислама, когда идолы были разрушены и уничтожено язычество, слуги дьявола, чтобы ввести людей в заблуждение, стали прибегать к другим методам.","Уважаемые мусульмане!","Ислам совершенен и дает людям все необходимые знания для того, чтобы они удостоились Рая. Душа человека находится во власти Аллаха. По установлению Всевышнего Творца, человек единожды приходит в этот мир, чтобы пройти испытание на верность своему Господу. Через 4 месяца после зачатия, когда ребенок находится в чреве матери, Господь вселяет в него душу. Человек рождается, проживает свою жизнь, и, когда заканчивается срок его земного пребывания, его душа покидает тело и уходит в мир душ. Тело похоронят, и оно станет частью земли. В День воскрешения Всевышний Аллах воскресит всех людей, и души устремятся в свои тела, чтобы предстать пред Господом миров для ответа за свои дела в жизни земной. И как бы человек потом ни желал вернуться обратно и прожить свою жизнь заново в праведности, другого такого шанса ему дано не будет: «Позади них будет преграда вплоть до того дня, когда они будут воскрешены» (Сура аль-Муʼминун, 23/100).","О Аллах, веди нас прямым путем и убереги от заблуждений! Дай нам возможность использовать свою единственно данную жизнь для служения Тебе и возвышения Твоей религии, чтобы заслужить Твое довольство! И сделай наше возвращение к Тебе самым прекрасным и благим!","Аминь!"]}]}}},
{"id":50,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Радость жизни и страх смерти","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلاً وَهُوَ الْعَزِيزُ الْغَفُورُ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:أَكْثِرُوا ذِكْرَ هَاذِمِ اللَّذَّاتِ","Дорогие братья и сестры!","Жизнь человека, подобно маятнику, колеблется между двумя противоположными точками – «радостью жизни» и «страхом смерти». Суета будничной череды дней, отвлекает человека от размышлений о мудрости его прихода в этот мир и попытке постичь тайну смерти.","Те же, кто, преодолев завесу земной беспечности, остановились и задумались о смысле своего пребывания в этом мире, поняли, что жизнь – это только период испытания, а смерть – это возвращение к Господу».","Человек, обладающий здравым смыслом, понимает, что пробуждение зерен в земле с приходом весны, рождение и смерть, микро- и макромиры, электроны и метагалактики, – все во вселенной находится в непостижимом уму человека порядке и постоянном движении, в котором не бывает сбоев и аварий.","Во всем великолепии этого мироздания только мрачная тайна смерти остается самым волнующим и пугающим вопросом для большей части человечества, несмотря на то, что Всевышний Господь посылал множество пророков для просвещения людей.","Все небесные религии сообщают о Судном дне, но в Священном Коране имеются наиболее подробные сведения и доказательства Судного дня, доступные пониманию разумом и сердцем. Цель появления человека на свет Всевышний Аллах объясняет во втором аяте суры «аль-Мульк»:","«Тот, кто сотворил жизнь и смерть, сделал это, чтобы испытать вас и увидеть, чьи деяния окажутся лучше…»","Уважаемые братья и сестры!","Земной мир – лишь обманчивый мираж, а потусторонний мир – бессмертие. Конец света для каждого человека наступает в момент его смерти. Необходимо проснутьс
