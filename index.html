ляллаху алейхи ва саллям) сказал:","«…Настоящая жизнь – лишь жизнь в ахирате». (Истинное счастье – счастье вечной жизни!)[4].","Несмотря на эти очевидные истины, в современном капиталистическом мире с его либерализмом и меркантилизмом в умы и души людей вкладывается понятие «мира без вечной жизни». Под воздействием лживой навязчивой рекламы и интернета, негативных телешоу и сериалов, люди, словно возвратившись в эпоху невежества, ориентируют свой образ жизни, ограниченный лишь материальными стремлениями, на эгоизм, безудержное потребление, удовольствия и беззаботность. Но, поистине, общество, которое живет в забвении о жизни вечной, деградирует и возвращается обратно эпоху невежества. Время и место в этом случае не имеют значения.","Обращаясь к истории невежественных обществ, в которые приходили пророки, можно заметить общую духовную болезнь, выраженную в отрицании вечной жизни. То же самое относится к периоду джахилии, завершившемуся с приходом Ислама. Самой неприятной и отвергаемой для язычников была весть о будущем воскрешении и отчете за совершенные дела.","Современное общество невежества, надеясь на жизнь без продолжения в вечности, погрязло в пучине грехов и несправедливости. Обладатели власти, не думающие о божественном расчете, ради своих страстей, корысти и прихотей превращают граждан страны в рабов, подвергая безжалостному притеснению и гнету. Ведь человек, отдаляясь от божественных истин, забывает о совести, справедливости, сострадании, забывает о человечности.","В наши дни слабость или отсутствие веры большинства людей приводит их к атеизму и ошибочным мировоззрениям. Если отсутствует вера в вечную жизнь, сердца, не занятые истиной, заполняют ложные идеи.","Поэтому чрезвычайно важно постоянно держать на контроле свое состояние, глубоко задумываться о том, насколько наши сердца проникнуты верой в вечную жизнь, и стараться исправить наши изъяны и недостатки.","Дорогие братья и сестры!","Хвала Аллаху, мы – мусульмане. Мы принимаем сердцем основы нашей веры и подтверждаем их на словах. Однако когда жизнь проверяет нас благами этого мира, умеем ли мы предпочесть вечную жизнь? Достаточно ли стойким иммунитетом против вируса врастания в мирское, ставшего эпидемией в наши дни, обладают наши сердца? Является ли вечный мир, который на самом деле и есть настоящая жизнь, основой, на которой мы возводим здание своей жизни временной? То есть, насколько мы подтверждаем нашу веру в вечную жизнь своим образом жизни?","Несомненно, в век близкий к Судному дню, мы еще больше нуждаемся в божественных и пророческих напоминаниях об истине смерти, могиле, Судном дне и вечной жизни, в частом размышлении о том, что настоящей жизнью является жизнь вечная. Поддержание в наших душах свежести веры в вечную жизнь является самой сильной броней, которая защитит нас от погружения в бренную жизнь и в будущем – от мучительного наказания.","Не стоит забывать, что жизнь, в которой нет озаряющего светом истины размышления о смерти, погружена в бедствие темной ночи. Солнце вечного счастья всходит на горизонте того, кто познал переход в вечную жизнь с умиротворенной душой, пройдя жизненный путь под сенью божественных откровений. А о тех, кого ветры смерти унесли в беспечности об Истинно Сущем, не будет плакать дольный мир и не встретит улыбкой мир вечный.","Ведь небо над нами – это то же самое небо, с которого на протяжении истории человечества обрушивались на отрицающих Всевышнего Бога наказания и беды. Солнце над нами – это тоже самое солнце, которое освещало дворцы и замки тиранов, таких как Фараон, Хаман, Карун и Немруд, а потом всходило над их развалинами.","Итак, нет более великого самообмана и ущерба для человека, чем уничтожение своего будущего вечного мира переживаниями о мирском будущем. Тому, кто подчинит свою душу миру, который перед Господом Богом не имеет ценности даже на крыло комара, и забудет вечную жизнь, Всевышний Аллах тоже не придаст значения. И те, кто сегодня забывают Всевышнего Бога, погрузившись в суету этого мира, завтра, когда будет распределяться божественная милость, окажутся в числе забытых Им.","Поэтому давайте не будем забывать, что мы пришли в этот мир для того, чтобы заслужить счастье вечной жизни.","Дорогие братья и сестры!","Впереди нас ждут очень тяжелые преодоления. Последний вздох, могила, Судный день, воскрешение, Сбор, Мизан, Сырат…","Пусть Всевышний Аллах сделает нас из числа праведных рабов, которым с помощью света божественных откровений, озарившим их души, станут доступны тайны смерти и вечного мира, из числа праведных рабов, обретших богобоязненность, стремящихся украсить свою смерть и пребывать в благоденствии в жизни вечной. Пусть защитит наши сердца от привязанности к этому миру, в котором мы являемся лишь путниками, идущими в вечность.","Пусть не обделяет наши сердца мудростью и духовным знанием того, что в один день мы станем частичкой земли, по которой ходим сегодня!"]}]}}},
{"id":12,"collection":"c1","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["ат-Тауба, 24","Али Имран, 31","аль-Худжурат, 1","Али Имран, 31","аль-Бухари 15; Муслим 44","Фатх аль-Бари 1/59","аль-Хашр, 9","Али Имран, 146, 148","аль-Бакара, 222","аль-Маида, 54"],"bibliography":[],"versions":{"ru":{"title":"Любовь к Аллаху и Его Посланнику — 1","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قُلْ إِنْ كَانَ آَبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُمْ مِنَ ٱللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّى يَأْتِيَ ٱللَّهُ بِأَمْرِهِ وَاللَُّ لاَ يَهْدِي الْقَوْمَ الْفَاسِقِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ","Дорогие братья и сестры!","Тема нашей сегодняшней хутбы является очень важной и в ее разъяснении нуждается каждый из нас. Более того, осуществление и выполнение этого - неотъемлемая часть веры, а оставление же этого – куфр. Наша сегодняшняя тема – это любовь ко Всевышнему Аллаху и Его Посланнику (салляллаху алейхи ва саллям).","Величайшее испытание человека в этом мире – испытание души любовью и стремлением познать истину. Тому, кто успешно преодолеет это испытание, не принесут тягот земные несчастья и беды. Их земная жизнь станет вдохновенным путешествием к встрече с Господом, который будет наполнять Своей Любовью каждый миг их бренного бытия.","Любовь к Аллаху и Его посланнику - это составная часть веры. Не становится человек верующим, пока любовь к Аллаху и Его Посланнику (салляллаху алейхи ва саллям) не станет сильнее, чем к кому-либо или чему-либо другому.","Искренность поклонения зависит от любви к Аллаху и Его посланнику (салляллаху алейхи ва саллям). Чем сильнее любовь к Аллаху и Его посланнику, тем искреннее и усерднее поклонение пред Аллахом, свят Он и велик.","Уважаемые братья и сестры!","Аллах Всевышний говорит:","«Скажи: «Если ваши отцы, ваши сыновья, ваши братья, ваши супруги, ваши семьи, приобретенное вами имущество, торговля, застоя в которой вы опасаетесь, и жилища, которые вы облюбовали, милее вам, чем Аллах, Его Посланник и борьба на Его пути, то ждите, пока Аллах не придет со Своим велением. Аллах не наставляет на прямой путь нечестивых людей»[1].","Кады Ийад (рахматуллахи алейхи) указывает:","«Достаточно этого аята, как указания, как доказательства, и как довода на необходимость любви к Посланнику Аллаха (салляллаху алейхи ва саллям), на ее обязательность (т.е. обязательность любви) и его право (т.е. Пророка - салляллаху алейхи ва саллям). Так как Всевышний упрекнул тех, чье имущество, семья и дети были более любимы ими, чем Аллах и Его Посланник (салляллаху алейхи ва саллям). А также высказал угрозу (т.е. Аллах Всевышний) Своими словами «…то ждите, пока Аллах не придет со Своим велением». Затем Он Аллах (свят Он и велик) в завершении аята объявил их нечестивцами и дал им понять, что они из числа заблудших и являются теми, кого Аллах Всевышний не наставил на прямой путь».","Аллах Всевышний говорит:","@ar:قُلْ إِنْ كُنْتُمْ تُحِبُّونَ ٱللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَاللَُّ غَفُورٌ رَحِيمٌ","«Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас и простит вам ваши грехи…»[2];","@ar:يَا أَيُّهَا الَّذِينَ آَمَنُوا لاَ تُقَدِّمُوا بَيْنَ يَدَيِ ٱللَّهِ وَرَسُولِهِ وَاتَّقُوا ٱللَّهَ إِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌ","«О те, которые уверовали! Не опережайте Аллаха и Его Посланника и бойтесь Аллаха, ибо Аллах – Слышащий, Знающий»[3].","Передается от Анаса (радыйаллаху анху), что Пророк (салляллаху алейхи ва саллям) сказал:","«Не уверует ни один из вас до тех пор, пока я не буду для него любимей, чем его отец, сын, и чем все люди».","Также передается от Анаса (радыйаллаху анху), что Пророк (салляллаху алейхи ва саллям) сказал:","«В том, в ком были (эти) три (качества), познал сладость веры: чтоб были Аллах и Его посланник более любимы для него, чем все остальное; если он любит (кого-то), то любит не иначе, кроме как ради Аллаха; и чтоб возвращение в неверие было ему ненавистно настолько, насколько ненавистно ему, чтоб его бросили в огонь».","Дорогие мусульмане!","Поистине, у любви к Всевышнему Аллаху и Его Посланнику (салляллаху алейхи ва саллям) есть извлеченные из Священного Корана и Сунны признаки, которые упомянули ученые, разъяснив их достоинства.","Сюда относятся такие качества, как следование за Посланником (салляллаху алейхи ва саллям), соблюдение его Сунны и мольба за то, чтобы Аллах благословил его (произнесение салаватов).","Аллах Всевышний повелевает нам:","@ar:قُلْ إِنْ كُنْتُمْ تُحِبُّونَ ٱللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَاللَُّ غَفُورٌ رَحِيمٌ","«Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас и простит вам ваши грехи, ведь Аллах – Прощающий, Милосердный»[4].","Правдивым и искренним в своей любви к Пророку (салляллаху алейхи ва саллям) является тот, на ком эта любовь оставляет след.","К признакам любви к Пророку (салляллаху алейхи ва саллям) относится следующее: сделать его своим примером для подражания; внимать и следовать его словам и делам; подчиняться его приказам и сторониться его запретов; придерживаться его нрава во всех случаях жизни.","Братья и сестры, приведу пример:","В тот момент, когда пророка Ибрахима (алейхиссалям), являющегося воплощением божественной любви, язычники катапультой бросили в огромный костер, перед ним предстали ангелы во главе с Джибрилем/Гавриилом (алейхиссалям) и спросили:","• О Халилуллах (Друг Аллаха)! Вели нам сделать, что тебе угодно!","Ибрахим (алейхиссалям), покорный Воле Всевышнего Аллаха, уповая лишь на Него, воскликнул:","• Не вмешивайтесь в отношения друга с Другом!","Это те степени божественной любви и духовного озарения, которые возносят человека выше ангелов.","Именно эти две тайны: божественная любовь и духовное озарение позволяют человеку преодолевать любые земные лишения и страдания. Это таинственный эликсир, превращающий даже нестерпимую боль в сладкий мед.","Именно поэтому все пророки безропотно переносили страдания, причиняемые им их народом, и достигали великих духовных высот. Посланник Аллаха (салляллаху алейхи ва саллям), самый лучший из всех творений Создателя, в своей жизни перенесший самые тяжелые и мучительные испытания, является имамом (предводителем) всех пророков и посланников и обладает титулом «Хабибуллах» (Любимец Всевышнего Аллаха).","Душа того, кто удостоится хотя бы малой доли божественной любви, без сомнения, расправит крылья и вознесется к небесам духовности Посланника Аллаха (салляллаху алейхи ва саллям). Но тем, кто обделен благом божественной любви, даже сладкий мед будет казаться горькой отравой.","Подтверждением этому является аят:","@ar:قُلْ إِنْ كُنْتُمْ تُحِبُّونَ ٱللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ ٱللَّهُ","«Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас…»","Передают со слов Анаса, что Пророк (салляллаху алейхи ва саллям) сказал:","@ar:لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ","«Никто из вас не уверует до тех пор, пока не возлюбит меня сильнее, чем своих родителей, своих детей и всех людей вместе»[5].","Ибн Хаджар сказал: «Здесь имеется в виду любовь добровольная, а не врождённая. Это подметил аль-Хаттаби. Ан-Навави сказал: “Это указание на проблему души, повелевающей зло (нафс аммара) и обретшей покой (нафс мутмаинна). Тот, кто предпочёл душу, обретшую покой, скорее всего, любит Пророка (салляллаху алейхи ва саллям), а тот, кто предпочёл душу, повелевающую зло, испытывает противоположные чувства. Если человек поразмыслит над пользой, которую принёс ему Пророк (салляллаху алейхи ва саллям), выведший его из мрака неверия к свету веры или ставший причиной этого, ему станет ясно, что он — причина его вечного пребывания в бесконечном блаженстве и что пользы от него больше, чем от всего остального. Следовательно, он заслуживает того, чтобы его любили сильнее, чем кого-то другого»[6].","Уважаемые братья и сестры!","Другим признаком любви является предпочтение того, что он узаконил, над своими желаниями и страстями.","Аллах Всевышний сказал:","@ar:وَالَّذِينَ تَبَوَّءُوا الدَّارَ وَالإِْيمَانَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلاَ يَجِدُونَ فِي صُدُورِهِمْ حَاجَةً مِّمَّا أُوتُوا وَيُؤْثِرُونَ عَلَى أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ وَمَن يُوقَ شُحَّ نَفْسِهِ فَأُولَئِكَ هُمُ الْمُفْلِحُونَ","«А те, которые жили в доме (Медине) и обрели веру до них, любят переселившихся к ним и не ощущают никакой нужды к тому, что даровано им. Они отдают им предпочтение перед собой, даже если они сами нуждаются…»[7].","Также к признакам любви относится: помощь его религии словом и делом; защита его Сунны; желание встретиться с ним; ненависть к тому, кого ненавидят Аллах и Его посланник (салляллаху алейхи ва саллям).","Что же касается тех вещей, посредством которых мы можем добиться любви Аллаха и Его посланника (салляллаху алейхи ва саллям), то к ним относятся: вера, терпение, покаяние и праведные дела.","Аллах Всевышний говорит:","@ar:وَاللَُّ يُحِبُّ الصَّابِرِينَ وَاللَُّ يُحِبُّ الْمُحْسِنِينَ","«… Аллах любит терпеливых»;","«… Аллах любит творящих добро»[8].","@ar:إِنَّ ٱللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ","«… Воистину, Аллах любит кающихся и любит очищающихся»[9].","@ar:يَا أَيُّهَا الَّذِينَ آَمَنُوا مَنْ يَرْتَدَّ مِنْكُمْ عَنْ دِينِهِ فَسَوْفَ يَأْتِي ٱللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ","«О те, которые уверовали! Если кто-нибудь из вас отступит от своей религии, то Аллах приведет других людей, которых Он будет любить, и которые будут любить Его. Они будут смиренны перед верующими и непреклонны перед неверующими…»[10].","О Аллах! Надели нас жизнью, наполненной любовью к Тебе и познанием Тебя, и призови нас к Себе на последнем вдохе верующими! Одари нас такой любовью к Тебе, чтобы наш последний вдох стал моментом долгожданной встречи, а воскрешение в Судный День – рассветом вечного счастья!","Аминь!"]}]}}},
{"id":13,"collection":"c1","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Ахмад 18482","Хадис приводится у Абу Дауда и ат-Тирмизи","Сонмы, 56","Ахмад 12304"],"bibliography":[],"versions":{"ru":{"title":"Любовь к Аллаху и Его Посланнику — 2","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:إنَّ ٱللَّهَ وَمَلاَئِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آَمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:وَالَّذِي نَفْسِي بِيَدِهِ لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ نَفْسِهِ","Дорогие братья и сестры!","Сказал `Амр ибн аль-`Ас (радыйаллаху анху):","«Не было никого, кто был бы любимей и более велик в моих глазах, чем Посланник Аллаха (салляллаху алейхи ва саллям)…».","Спросили `Али (радыйаллаху анху):","«Какова была ваша любовь по отношению к Посланнику (салляллаху алейхи ва саллям)?» На что он ответил: «Клянусь Аллахом, он был для нас любимей, чем наше имущество, наши дети, наши отцы, наши матеря, и чем холодная вода во время жажды».","Также сообщается, что Биляль, Хузейфа ибн аль-Йаман и `Аммар ибн Ясир (радыйаллаху анхум) во время своей смерти говорили: «Завтра я встречу своих любимых: Мухаммада и его последователей».","Аллах Всевышний говорит:","@ar:قُلْ إِنْ كُنْتُمْ تُحِبُّونَ ٱللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ ٱللَّهُ","«Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас…»","Уважаемые братья и сестры!","Комментируя этот аят, Ибн Касир сказал:","«Этот благородный аят является судьей в отношении того, кто заявляет о своей любви по отношению к Аллаху, не находясь при этом на пути Мухаммада (салляллаху алейхи ва саллям).","Поистине этот человек является лжецом в данном деле до тех пор, пока он не последует за законодательством Мухаммада (салляллаху алейхи ва саллям), и за пророческой религией во всех своих словах, делах в каком бы состоянии он не оказался.","Как передано в «Сахихе», что Посланник Аллаха (салляллаху алейхи ва саллям), сказал: «Кто совершит дело, на которое не было нашего повеления, оно будет отвергнуто».","Аллах Всевышний сказал: «Скажи: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас…» То есть, вы добьетесь большего, чем ваше требование (любовь к Нему), добьетесь Его любви к вам, что является более важным. Как сказали об этом некоторые ученые-мудрецы: «Не в том суть, чтоб ты любил, но в том, чтоб тебя любили».","Дорогие братья и сестры!","Подчинение Пророку (салляллаху алейхи ва саллям), которое возможно лишь тогда, когда человек полон любви к Аллаху и Его (салляллаху алейхи ва саллям).","В одном из хадисов сообщается, что однажды Посланник Аллаха (салляллаху алейхи ва саллям), взял ‘Умара ибн аль-Хаттаба за руку, и тот сказал: «Клянусь Аллахом, о Посланник Аллаха, я люблю тебя сильнее всего на свете, кроме самого себя». В ответ Пророк (салляллаху алейхи ва саллям), сказал:","«Клянусь Тем, в Чьей длани моя душа, никто из вас не уверует, пока не возлюбит меня сильнее, чем самого себя». Тогда ‘Умар сказал: «Воистину, сейчас я возлюбил тебя сильнее, чем самого себя». Пророк же Пророку (салляллаху алейхи ва саллям) сказал:","@ar:وَالَّذِي نَفْسِي بِيَدِهِ لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ نَفْسِهِ.","@ar:الآْنَ يَا عُمَرُ.","«Вот теперь, ‘Умар»[1].","Передают со слов Анаса, что Пророк (салляллаху алейхи ва саллям) сказал:","@ar:لاَ يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ.","И сказал Пророк (салляллаху алейхи ва саллям):","«Держитесь моей сунны и сунны праведных халифов, вцепитесь за нее коренными зубами. И сторонитесь нововведений, ведь каждое нововведение (является) ересью, а каждая ересь (является) заблуждением»[2].","Дорогие братья и сестры!","Сообщается от Муаза, что Пророк (салляллаху алейхи ва саллям) сказал:","«Обязанностью рабов по отношению к Аллаху является то, чтоб они поклонялись Ему, не приобщая сотоварищей. А обязанностью Аллаха по отношению к рабам является то, чтоб Он не наказывал того из них, кто не придавал Ему сотоварищей».","Одним из обязанностей этой общины по отношению к Пророку (салляллаху алейхи ва саллям) является его благословение и приветствие:","@ar:إنَّ ٱللَّهَ وَمَلاَئِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آَمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا","«Воистину, Аллах и Его ангелы благословляют Пророка. О те, которые уверовали! Благословляйте его и приветствуйте миром»[3].","Уважаемые братья и сестры!","Передают со слов Анаса, что как-то раз один мужчина спросил Посланника Аллаха (салляллаху алейхи ва саллям) о наступлении [Судного] часа, и тут объявили о начале намаза. После завершения намаза Посланник Аллаха (салляллаху алейхи ва саллям), спросил:","@ar:أَيْنَ السَّائِلُ عَنْ السَّاعَةِ ؟","«Где тот, кто спрашивал о [Судном] часе?» Мужчина ответил: «Я здесь, Посланник Аллаха». Он сказал:","@ar:وَمَا أَعْدَدْتَ لَهَا فَإِنَّهَا قَائِمَةٌ ؟","«Он непременно наступит. Что же ты приготовил для него?» Тот ответил: «Я не приготовил для него больших деяний, кроме того, что я люблю Аллаха и Его посланника». Пророк (салляллаху алейхи ва саллям), сказал:","@ar:فَأَنْتَ مَعَ مَنْ أَحْبَبْتَ.","«Ты будешь с тем, кого любишь». Анас сказал: «После обращения в ислам мусульмане ничему не радовались так, как этому»[4].","Какое же это блаженство! Любовь к Посланнику (салляллаху алейхи ва саллям) позволяет человеку стать его спутником в Раю.","О, Аллах! Прости нам наши грехи и сделай нас из тех, которые поклоняются Тебе наилучшим образом!","Мир и благословение нашему любимому пророку Мухаммаду (салляллаху алейхи ва саллям)."]}]}}},
{"id":14,"collection":"c1","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Муватта, Хуснуль-хуль, 8; Ахмад бин Ханбаль, 2/381; Байхаки, ас-Сунану кубра, 10/192.","Сура аль-Калам, 68/4.","Бухари, Адаб, 96.","Ибн Саад, 1/378.","Тирмизи, Джанаиз, 32/1017; Ибн Маджа, Зухд, 16; Хаким, 2/506/3734.","Хаким, 1/129205.","Ибн Маджа, Атима, 30; Хаким, 3/50/4366; Байхаки, Далаилуль-нубувва, 5/69.","Сура аль-Ахзаб, 33/6.","Бухари, Тафсир, 33/1, Кафалат, 5, Фараиз, 4, 15, 25; Муслим, Фараиз, 14.","Хайсами, 3/163-164; Абу Дауд, Закят, 36/1670; Хаким, 1/571/1501.","Сура аль-Инширах, 94/7-8.","Сура аш-Шамс, 91/1-10."],"bibliography":[],"versions":{"ru":{"title":"Нравственность Посланника Аллаха","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ وَإِنَّكَ لَعَلَى خُلُقٍ عَظِيمٍ قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم إِنَّمَا بُعِثْتُ لأُِتَمِّمَ صَالِحَ الأَْخْلاَقِ","Дорогие братья и сестры!","Наш Пророк (салляллаху алейхи ва саллям), которого Всевышний Аллах послал людям как «усва-и хасана», то есть «лучший пример», так отразил суть своей миссии:","«Я послан, чтобы завершить прекрасную нравственность, и ни с какой другой целью».[1]","Воистину, все проявления Посланника Аллаха (салляллаху алейхи ва саллям) с любой стороны находятся на вершине благонравия и духовной красоты. Всевышний Аллах, подтверждая эту истину, сказал:","«Воистину, ты великого нрава!»[2]","В Посланнике Аллаха (салляллаху алейхи ва саллям) воплотилось чудо божественного творения, которое Создатель проявляет в Своих рабах, так как каждый человек, к каким бы слоям общества ни принадлежал – от низших до самых высших, найдет в нем прекрасный пример для себя. На примере его пророческой жизни человечество может найти решение любых проблем, которые существовали и 1400 лет назад, и будут существовать до самого Конца света, и, благодаря этому, достичь мира и покоя.","Пророки не оставляют в наследство золото и бриллианты. Главное наследство, оставшееся от Посланника Аллаха (салляллаху алейхи ва саллям) – это его превосходные духовные качества. Наследовать эти качества можно только обретением своей доли от «пророческой нравственности» на пути духовного воспитания.","Более всего к этой цели приблизились благородные сподвижники. Они лучше всех постигли суть хадиса: «Человек рядом с тем, кого любит»[3] и жили согласно этому пониманию.","Любовь, подобно электрической связи, возникающая между двумя сердцами, подразумевает уподобление объекту любви и подчинение ему. Любящий человек похож на того, кого любит.","Чтобы и в вечном мире быть вместе с любимым Пророком (салляллаху алейхи ва саллям), поколение сподвижников усердствовало в том, чтобы проникнуться его душевными качествами, жить по его Сунне и сердцем всегда быть вместе с ним.","Уважаемые мусульмане!","В наши дни, когда человечество погрязло в болоте безверия и безнравственности, мы, как никогда, нуждаемся в том, чтобы с искренностью и любовью обратиться к нравственным принципам нашего Пророка (салляллаху алейхи ва саллям) и стараться возродить их в нашей жизни и в нашем обществе.","Благочестивая Айша (радыйаллаху анха) сообщает: «Для Пророка (салляллаху алейхи ва саллям) не было черты отвратительнее лжи. Стоило ему узнать, что кто-то из сподвижников солгал, он не желал с ним встречаться и не подпускал близко, пока тот не раскаивался»[4].","Посланник Аллаха (салляллаху алейхи ва саллям) был очень скромным, будучи в этом прекрасным примером для своих сподвижников. Анас бин Малик (радыйаллаху анху) рассказывал: «Пророк (салляллаху алейхи ва саллям) навещал больных, участвовал в похоронах, ходил в гости к рабам, которые его приглашали…»[5]","Абу Муса (радыйаллаху анху) рассказывал: «Пророк (салляллаху алейхи ва саллям) ездил на муле, носил одежду, сшитую из грубой ткани, доил овец, встречал гостей, служил им и угощал их».[6]","Джарир (радыйаллаху анху) рассказывал:","«В день захвата Мекки к Пророку (салляллаху алейхи ва саллям) подошел один человек. Благородство внешности и духовная сила, исходившая от Посланника Аллаха (салляллаху алейхи ва саллям), привели его в страх и дрожь.","Заметив состояние этого человека, Пророк (салляллаху алейхи ва саллям) мягко сказал ему, проявив скромность:","«Успокойся, возьми себя в руки. Я не являюсь правителем. Я из племени Курайш, сын женщины, которая ела вяленое мясо».[7]","Дорогие мусульмане!","Посланник Аллаха (салляллаху алейхи ва саллям) занимался всеми проблемами своих сподвижников и помогал всем, что было в его силах. Когда у него была возможность, он выплачивал долги умерших людей, спасал их семьи от материальных трудностей. Однажды он сказал:","«Безусловно, я являюсь самым близким для каждого верующего в земном мире и в вечном мире. Читайте следующий аят: “Пророк ближе к верующим, чем они сами…”[8] Если кто-то оставляет имущество, то оно принадлежит его семье, кто же оставляет долг или семью без средств к существованию, то обращайтесь ко мне, ибо я первый, кто должен помочь верующим [я оплачу долги и помогу оставшимся без пропитания]».[9]","По своему примеру наш Пророк (салляллаху алейхи ва саллям) воспитывал и своих сподвижников. Как-то после утреннего намаза он, повернувшись к ним, спросил:","• Есть ли среди вас те, кто держит сегодня пост?","Благородный Умар (радыйаллаху анху) ответил:","• О Посланник Аллаха! Вчера вечером я не подумал об этом. Поэтому сегодня я не держу пост.","А благородный Абу Бакр (радыйаллаху анху) сказал:","• Вчера вечером я решил соблюдать пост и проснулся с этим намерением.","Пророк (салляллаху алейхи ва саллям) задал следующий вопрос:","• А есть ли среди вас те, кто посетил сегодня больного?","Умар (радыйаллаху анху) ответил:","• О Посланник Аллаха! Мы (недавно) совершили утренний намаз и не покидали это место. Как мы смогли бы посетить больного?","Но Абу Бакр (радыйаллаху анху) сказал:","• Я услышал, что мой брат Абдуррахман бин Ауф захворал. Когда я направлялся в мечеть, по пути заглянул к нему, чтобы узнать о его состоянии.","Посланник Аллаха (салляллаху алейхи ва саллям) вновь задал вопрос:","• Есть ли из вас кто-нибудь, кто накормил сегодня бедняка?","Благородный Умар (радыйаллаху анху) опять удивился:","• О Посланник Аллаха! Мы ведь совсем недавно завершили намаз и никуда не выходили.","Но благородный Абу Бакр (радыйаллаху анху) сказал:","• Когда я вошел в мечеть, то заметил человека, который пожаловался на нужду. В руке моего сына Абдуррахмана был кусок ржаного хлеба. Я взял у него этот хлеб и отдал тому человеку.","В ответ Посланник Аллаха (салляллаху алейхи ва саллям) произнес:","• Я обрадую тебя радостью о Рае.","Благородный Умар (радыйаллаху анху) тяжело вздохнул:","• О Рай!","Чтобы утешить его, Пророк (салляллаху алейхи ва саллям) что-то сказал ему и добавил:","• Да смилуется Аллах над Умаром! Да смилуется Аллах над Умаром! Стоит ему только вознамериться совершить какое-либо благое дело, как Абу Бакр обязательно обходит его в этом.[10]","В Коране Всевышний Аллах повелевает:","@ar:فَاِذَا فَرَغْتَ فَانْصَبْۙ. وَاِلٰى رَبِّكَ فَارْغَبْ","«Посему, как только освободишься, будь деятелен и устремись к своему Господу».[11]","Следуя этому повелению, верующий, завершив одно благое дело, должен спешить к совершению другого и стараться постоянно быть в состоянии любви и готовности к служению.","Подавая сподвижникам пример многочисленных проявлений прекрасной нравственности и перенося их в атмосферу высокой духовности, Посланник Аллаха (салляллаху алейхи ва саллям) был для них и останется для всей уммы образцом для подражания во всем и на все времена вплоть до самого Судного дня.","Уважаемые мусульмане!","Когда люди начинают отходить от прямого пути по причине изобилия жизни или многочисленных успехов, рискуя быть охваченным гордыней и высокомерием, наш Пророк (салляллаху алейхи ва саллям) послужит для них прекрасным примером.","И наоборот, когда уже кажется невозможным проявлять терпение, чтобы не восстать против воли Всевышнего, а быть в состоянии довольства своим положением и вверить себя воле Аллаха, снова наш Пророк (салляллаху алейхи ва саллям) будет самым прекрасным примером.","В битве Хендек, когда страдания превосходили силы и возможности людей, когда мусульмане сражались с врагом, будучи изможденными и голодными, в холоде и темноте, Посланник Аллаха (салляллаху алейхи ва саллям) взывал к Господу:","«О Аллах! Истинная жизнь – жизнь вечная. Даруй победу ансарам и мухаджирам!»","Таким образом, своим терпением, довольством, покорностью и упованием он показывал умение сохранять умиротворение духа и обучал этому других.","Обязательным условием достижения такого духовного совершенства является очищение души, ибо в суре «аш-Шамс» Всевышний Господь, семь раз поклявшись Своими самыми величественными творениями, повелевает:","«Клянусь солнцем и его сиянием! Клянусь луной, которая следует за ним! Клянусь днем, который выявляет его (солнца) сияние! Клянусь ночью, которая скрывает его! Клянусь небом и Тем, Кто его воздвиг! Клянусь землей и Тем, Кто ее распростер! Клянусь душой и Тем, Кто придал ей соразмерный облик и внушил ей порочность и богобоязненность! Преуспел тот, кто очистил ее, и понес урон тот, кто опорочил ее».[12]","Следовательно, в душе человека уживаются, с одной стороны, порочность, а с другой стороны – благочестие. С одной стороны – телесная душа (нафс), склонная к грехам, с другой стороны – дух, устремленный к небесам. Таким образом, чтобы преуспеть, человек должен всю жизнь заниматься духовным очищением и воспитанием сердца, стремясь к обретению своей доли от нравственности Пророка (салляллаху алейхи ва саллям).","Пусть Всевышний Аллах сделает нас из числа Его рабов, следующих по стопам Его любимого Пророка (салляллаху алейхи ва саллям)! Пусть облачит Он нас в нравственность Хабибуллах (салляллаху алейхи ва саллям), которого Он воспитал и послал человечеству, как образцовую личность, и пусть присоединит нас к собранию праведных рабов, являющихся его свидетелями на земле! Аминь!"]}]}}},
{"id":15,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура «Алю Имран», 3/102","Сура «Раскалывание» 82/1-5","Сура «Йасин», 36/77-79","Сура «аль-Исра» 17/71","Сура «аль-Исра» 17/13-14","см. Сура «Зальзаля» 99/6-8","Бухари, Мазалим, 10; Рикак, 48","Сура «аль-Анбия» 21/47","Сура «аль-А’раф» 7/9","Бухари, Рикак, 53, № 6208, 5/2405","Сура «аль-А’раф» 7/50-51","См. Бухари, Бадʼуль-Хальк, 8","Сура «аль-Хиджр» 15/45-48","Сура «Украшения» 43/68-73"],"bibliography":[],"versions":{"ru":{"title":"Вера в вечную жизнь","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا ٱللَّهَ حَقَّ تُقَاتِهِ وَلاَ تَمُوتُنَّ إِلاَّ وَأَنتُم مُّسْلِمُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:مَنْ كَانَتْ لَهُ مَظْلَمَةٌ لأَِخِيهِ مِنْ عِرْضِهِ أَوْ شَيْءٍ، فَلْيَتَحَلَّلْهُ مِنْهُ اليَوْمَ، قَبْلَ أَنْ لاَ يَكُونَ دِينَارٌ وَلاَ دِرْهَمٌ، إِنْ كَانَ لَهُ عَمَلٌ صَالِحٌ أُخِذَ مِنْهُ بِقَدْرِ مَظْلَمَتِهِ، وَإِنْ لَمْ تَكُنْ لَهُ حَسَنَاتٌ أُخِذَ مِنْ سَيِّئَاتِ صَاحِبِهِ فَحُمِلَ عَلَيْهِ","Дорогие братья и сестры!","Приходя в этот мир по предопределению Творца, каждый человек становится путником, направляющимся в вечность. Этот путь может быть долгим или коротким, трудным, полным лишений, или, наоборот, легким и беззаботным. Кого-то Господь наделил богатством, красотой, положением, а кто следует по жизни налегке. Однако никто не приходит в этот мир, чтобы остаться в нем навсегда. Жизнь земная – лишь временная остановка, гостиница на пути странника, направляющегося в вечность.","Всевышний Господь каждому дал жизнь, чтобы различить людей по деяниям – хорошим или плохим. Когда человек покидает этот мир, он ничего не забирает с собой, кроме своих добрых дел или грехов. Поэтому мы все должны стремиться к тому, чтобы прожить и умереть с верой (с иманом). Аллах Всевышний повелевает:","«О те, которые уверовали! Бойтесь Аллаха должным образом и умирайте не иначе, как будучи мусульманами!»[1].","Уважаемые братья и сестры!","Смерть, которая обязательно постигнет каждого обладателя жизни, является его личным концом света. Но те, кто верил в Аллаха и прожил свою жизнь, будучи на прямом пути и в поклонении, в момент смерти они не испытают страха.","Смерть – это не исчезновение, а рождение для вечной жизни. Так же как младенец приходит в этот мир через рождение, так и исход души из тела является рождением в загробный мир.","Аллах создал этот мир лишь на определенное ограниченное время. Когда наступит срок, о котором знает только Он, этот мир исчезнет. О начале Конца Света возвестит ангел Исрафил (алейхиссалям), который вострубит в Сур (Рог), диаметр которого равен размеру небес и земли. Этот звук приведет в ужас все живое на семи землях и семи небесах. Все будут разбегаться от страха в разные стороны. Молодые люди станут седыми. Домашние и дикие животные, птицы, насекомые, джинны прибегут к людям. Во второй раз ангел Исрафил подует в Сур в тысячу раз сильнее прежнего. Миропорядок вселенной нарушится. Погибнет все живое. Останется только Всевышний Аллах.","«Когда небо расколется, когда звезды осыплются, когда моря смешаются (или высохнут), когда могилы перевернутся, тогда каждая душа узнает, что она совершила и что оставила после себя»[2].","Всевышний Аллах пошлет на землю дождь, от которого все начнет наполняться жизнью. Когда могучий ангел Исрафил (алейхиссалям) по приказу Всевышнего Творца подует в Сур третий раз, все будут воскрешены заново. Аллах создаст людям новые тела, и каждая душа, найдя свое тело, войдет в него.","«…Он сказал: “Кто оживит кости, которые истлели?” Скажи: “Оживит их Тот, Кто создал их в первый раз. Он ведает о всяком творении”»[3].","Ожившие люди, словно прорастающая трава, выйдут из своих могил и предстанут перед Аллахом в ожидании Великого Суда. Первым будет воскрешен пророк Мухаммад (салляллаху алейхи ва саллям) и будет препровожден на свое почетное место в окружении 70 тысяч ангелов.","После воскрешения все обладатели душ будут собраны на Махшаре для ответа за свои дела и поступки, совершенные в земной жизни. Слово «Махшар» переводится как «место великого собрания». Все будут собраны вместе с теми, в кого они верили, и за кем следовали в земной жизни. Верующие и неверующие, грешники и лицемеры – все будут собраны вместе со своими лидерами и руководителями:","«В тот день Мы созовем все [общины] людей вместе с их предводителями...»[4].","Каждому будет вручена книга, в которой записаны все деяния, совершенные в земной жизни.","«А в День воскресения Мы представим ему книгу, которую он увидит развернутой. Читай свою книгу! Сегодня достаточно того, что ты сам сосчитаешь свои деяния против самого себя»[5].","Уважаемые мусульмане!","Всевышний Аллах, обладатель высшей Мудрости и Справедливости, призовет всех людей к отчету после вручения им книг записи деяний.","Судный День – это день различения добра и зла, истины и лжи. Если человек сделал добро даже весом в пылинку, он будет вознагражден за него. А если совершил зло весом в пылинку, то будет наказан за него (если Аллах его не помилует)[6].","О деяниях человека будут свидетельствовать его собственный язык, руки и ноги, которые обретут дар речи. Даже земля, по которой ходил человек, известит обо всем, что он ежедневно и ежечасно совершал на ней.","Пророк (салляллаху алейхи ва саллям) сказал:","«Если кто-то совершил насилие, посягнув на честь, достоинство или имущество другого, пусть помириться с ним, прежде чем наступит Судный День, когда уже не будет золота и серебра. Ибо если у него имеются вознаграждения (саваб) за добрые дела, из них вычтут по мере совершенного им насилия (и отдадут тому, кого он притеснял). Если у него нет добрых дел, то на него возложат грехи того, кого он притеснял»[7].","Дорогие мусульмане!","Все дела и поступки людей будут взвешены на справедливых Весах (Мизан), внутренняя суть и форма которых известна только Всевышнему Аллаху:","«В день воскресения Мы установим точные Весы, и ни одна душа не будет обижена даже на вес горчичного зернышка. Достаточно Нас в проведении расчета»[8].","Если чаша Весов с благими делами окажется тяжелее, то человек войдет в число спасенных. Если перевесят плохие дела, то его ждет печальный исход.","«В тот день взвешивать будут правильно. Те, чья чаша Весов будет перевешивать, окажутся преуспевшими. Те же, чья чаша Весов окажется легче, потеряют самих себя, поскольку они были несправедливы к Нашим знамениям»[9].","В этих аятах говорится о положении верующих и о положении неверующих, посчитавших ложью божественные Откровения. Даже если неверующие совершали добрые дела в земной жизни, в Судный День они не принесут им пользы, так дела приобретают ценность перед Аллахом только при условии истинной веры.","В Судный День наш Пророк (салляллаху алейхи ва саллям) будет ждать свою общину у водоема Кяусар. Он говорил:","«Один берег моего водоема равен пути, который можно одолеть за месяц. Вода в нем белее молока, запах приятнее мускуса, кубков больше, чем звезд на небе. Выпивший (его воды) из этого кубка никогда больше не почувствует жажды»[10].","Уважаемые мусульмане!","Сырат – это мост над Адом, который тоньше волоса и острее лезвия меча. На другом его конце находится Рай. Мусульмане пройдут по нему в зависимости от своей веры и поступков. Некоторые пронесутся со скоростью молнии, некоторые преодолеют мост бегом, некоторые – неуверенными шагами или даже ползком. Неверующие и те, чья чаша грехов оказалась тяжелее, не смогут пройти этот мост и, поскользнувшись, упадут в Ад.","Ад, как место наказания неверующих и грешников, уже создан. Когда наступит Конец Света, Ад будет перемещен с того места, где он сейчас находится, на место Сбора (Махшар). Несчастные люди, отвернувшиеся от света истинного пути и удалившиеся во тьму неверия, будут нести наказание там. О чудовищности Ада Посланник Аллаха (салляллаху алейхи ва саллям) говорил, что огонь Ада в 70 раз жарче земного огня, его обитатели уже издалека будут слышать его яростный рев. Огненный шатер будет окружать их со всех сторон, сжигая лица, кожу, сердца. Когда их кожа будет сгорать, то она будет заменяться новой, чтобы их страдания не прекращались.","Верующие грешники (если Аллах их не помилует) будут получать наказание в Аду в зависимости от тяжести своих грехов. Очистившись от грехов, они будут освобождены из Ада. Но те, кто не веровал, зайдут в Ад и останутся там навечно. Всевышний Создатель не проявит к ним милости:","«Обитатели Огня воззовут к обитателям Рая: “Пролейте на нас воду или то, чем вас наделил Аллах”. Они скажут: “Аллах запретил это для неверующих, которые обратили свою религию в потеху и игру и обольстились мирской жизнью”»[11].","Рай, как проявление безграничной милости, благоволения и щедрости Аллаха, уже создан и существует в настоящее время[12]. Это вечный, не исчезающий божественный дар, наполненный красотами и благами, которые невозможно постичь разумом, и которых будет удостоен тот, кто был богобоязнен и прожил жизнь, осененную духовностью и светом Корана и Сунны. В Коране есть множество аятов, описывающих райские блага. Вот некоторые из них:","«Воистину, богобоязненные (страшившиеся наказания Аллаха и просившие Его милости) пребудут в Райских садах и среди источников. (Им скажут:) “Входите сюда с миром, будучи в безопасности”. Мы исторгнем из их сердец злобу, и они, как братья, будут лежать на ложах, обратившись лицом друг к другу. Там их не коснется усталость, и их не изгонят оттуда»[13];","«О рабы Мои! Сегодня вы не познаете страха и не будете опечалены. Вы были теми, которые уверовали в Наши знамения и были мусульманами. Войдите в Рай счастливыми – вы и ваши супруги. Их будут обносить блюдами из золота и чашами. Там будет то, чего жаждут души и чем услаждаются глаза. Вы пребудете там вечно. Этот Рай дан вам в наследство за то, что вы совершали. Для вас там уготованы многочисленные фрукты, которые вы будете есть»[14].","В Раю нет ни печали, ни ненависти, ни вражды. Все будут любить и уважать друг друга. Люди будут ходить друг к другу в гости и, сидя на красивых местах, вести приятные беседы.","Дорогие мусульмане!","Ахират – это будущая жизнь, которая начнется после завершения земной жизни и будет длиться вечно. Мусульманин должен верить в то, что с наступлением Конца Света все умершие люди воскреснут, и в то, что за все благие и дурные дела человек получит воздаяние в будущей жизни. Это является одной из шести основ Ислама, без которой вера человека будет недействительна.","Пусть Аллах Всевышний сделает нас из числа праведных рабов, обретших богобоязненность, стремящихся покинуть этот мир с иманом и войти в сады Эдема! Пусть защитит наши сердца от привязанности к этому миру, в котором мы являемся только путниками, идущими в вечность! Аминь!"]}]}}},
{"id":16,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Суры аль-Бакара, 2/35-36; аль-Аʼраф, 7/19-22.","Сура аль-Бакара, 2/168.","Суры аль-Маида, 5/88; аль-Анфаль, 8/69; ан-Нахль, 16/114.","Ибн Асир, Усдуль-габа, 1/424-425; Ибн Хаджар, аль-Исаба, 3/86.","Сарахси, Мабсут, 7/62.","Байхаки, Шуаб, 6/401; Али аль-Муттаки, 16/443.","Абу Нуайм, Хилья, 1/31; Бухари, Манакибуль-ансар, 26; Ахмад бин Абдуллах ат-Табари, ар-Риядун-надра, 2/140-141.","Сура ан-Назиʼат, 79/40-41; Куртуби, 19/135.","Суюти, Джамиус-Сагир, № 3848.","Суюти, Джамиус-Сагир, 1/65.","Сура аль-Маида, 5/100; Вахиди, Асбабун-нузуль, стр. 212-213.","Ахмад, 1/387.","Бухари, Буйу, 7, 23.","Тирмизи, Даʼват, 110/3563; Ахмад, 1/153.","Ибн Маджа, Икама, 32; Ахмад, 6/322."],"bibliography":[],"versions":{"ru":{"title":"Дозволенная пища","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ وَكُلُوا مِمَّا رَزَقَكُمُ ٱللَّهُ حَلاَلاً طَيِّبًا وَاتَّقُوا ٱللَّهَ الَّذِي أَنتُم بِهِ مُؤْمِنُونَ قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم اَللّٰهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","Дорогие братья и сестры!","Не только химический состав и пищевая ценность продуктов питания, но и их дозволенность с точки зрения религии оказывает физическое и духовное влияние на того, кто их употребляет.","Когда Создатель сотворил в Раю первых мужчину и женщину, то разрешил им есть все райские плоды, но запретил приближаться только к одному дереву. Сатана искусил их, показав это дерево очень привлекательным. Он обещал, что, вкусив плодов этого дерева, они обретут вечность и навсегда останутся в Раю, и таким образом заставил их нарушить запреты Аллаха.[1]","Также и на земле существует много видов пропитания, которые дозволены Господом. То, что запрещено (харам) весьма ограничено. Но душа, следующая за страстями (нафса), и сатана, вводя человека в заблуждение легкостью заработка, который якобы откроет возможности для совершения благих дел, показывают ему красивыми запретные вещи. Таким образом, многие люди сбиваются с истинного пути. Указывая на эти истины, Всевышний Аллах повелевает:","«О люди! Вкушайте на земле то, что дозволено и чисто, и не следуйте по стопам сатаны. Воистину, он для вас – явный враг».[2]","«Ешьте из того, чем Аллах наделил вас, дозволенное и благое, и бойтесь Аллаха, в Которого вы веруете».[3]","Уважаемые братья и сестры!","Когда Посланник Аллаха (салляллаху алейхи ва саллям) возвращался из похода Табук, его встретил Саʼд бин Ансари (радыйаллаху анху). Пророк (салляллаху алейхи ва саллям) поздоровался с ним за руку и почувствовал, что его ладони шершавы и покрыты мозолями. Он спросил:","• Почему твои руки стали такими?","Саʼд ответил:","• Это мозоли от лопаты и тяпки, которыми я зарабатываю средства для содержания своей семьи.","Посланник Аллаха (салляллаху алейхи ва саллям), будучи довольным им, воскликнул:","• Это руки, которых не коснется адский огонь![4]","В другой передаче сказано:","«Это руки, которые любит Аллах».[5]","Как-то у Пророка (салляллаху алейхи ва саллям) спросили о правах детей в отношении родителей. Он ответил:","«Права ребенка таковы: отец обязан обучить его чтению и письму, научить плаванию и стрельбе, а также кормить его только дозволенной пищей».[6]","Дорогие братья и сестры!","Тело, вскормленное харамом, достойно лишь стать растопкой Ада. Следовательно, мусульмане должны строго «следить за тем, что входит в их рот и что выходит из него», то есть, следить за тем, что они едят и что говорят.","У Абу Бакра (радыйаллаху анху) был невольник, который на свой заработок покупал съестное для своего хозяина. Обычно Абу Бакр спрашивал, что за еду подал ему невольник, но в этот раз без вопросов приступил к еде. Через некоторое время раб заметил:","• Ты каждый вечер спрашивал у меня откуда у меня средства на еду, но сегодня ничего не спросил.","Абу Бакр (радыйаллаху анху) ответил:","• Ну говори, что у тебя?","Раб рассказал, что в прежние времена, еще до принятия им Ислама, он обманул одного человека, сказав, что может предсказывать будущее. Разумеется, у него не было таких способностей, но он сделал ему предсказание. В этот день он встретил того человека, и тот дал ему эту еду в качестве платы за то «предсказание».","Услышав это, Абу Бакр вскочил с места и, засунув в рот два пальца, вызвал рвоту. Очистив желудок от сомнительной пищи, он сказал своему слуге:","• Горе тебе! Ты чуть не убил меня.","Его спросили:","• Стоит ли так мучить себя из-за одного куска?","Он ответил:","• Если бы я даже знал, что при этом моя душа покинет тело, все равно освободился бы от этого куска, потому что слышал, как Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Тело, вскормленное харамом, достойно Ада!»[7]","После этого был ниспослан аят:","«Тому же, кто боялся предстать перед своим Господом и удерживал себя от страстей, пристанищем будет Рай».[8]","Когда человек начинает серьезно относиться к различению «халяль» и «харам», отказываясь от запрещенного заработка, он, вопреки опасениям некоторых людей, не беднеет. Даже наоборот, Всевышний Аллах дарует изобилие его доходу. Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Ангел Джибриль внушил мне, что не умрет человек, пока не проживет свой срок и не употребит весь свой удел полностью. Так бойтесь же Аллаха и правильно ищите пропитание (то есть дозволенным путем в Исламе). Пусть ни один из вас не ищет пропитание ослушанием Аллаха, полагая, что получение его удела запаздывает, ибо то, что во владении Аллаха, обретают только послушанием Ему».[9]","Люди, доход которых чист, даже если он небольшой, всегда живут в состоянии душевного покоя. Их любит Аллах. В хадисе сообщается такая благая весть:","«Аллах любит видеть Своего раба, уставшего в поиске дозволенного пропитания».[10]","Уважаемые мусульмане!","Халяль величиной с пшеничное зернышко для Аллаха более любим, чем харам, заполнивший весь мир, ибо харам – нечистый и всегда отвергается Аллахом. А халяль хороший и всегда чистый. Халяль угоден Аллаху. Поэтому они не равны.","Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Всевышний Аллах сделал для вас запретным поклонение идолам, употребление спиртных напитков, унижение людей из-за происхождения. Будьте внимательны, прокляты все, кто пьет спиртные напитки, кто изготавливает, кто разливает, кто продает и кто использует вырученные на них средства (то есть, содержит себя и свою семью).","В ответ на эти слова поднялся какой-то бедуин и сказал:","• О Посланник Аллаха! Я раньше продавал спиртные напитки и собрал некоторое количество денег. Будет ли мне польза, если я эти средства потрачу на пути Аллаха?","Пророк (салляллаху алейхи ва саллям) ответил:","• Даже если ты потратишь эти средства на хадж, джихад или раздашь в качестве милостыни, они не будут иметь перед Аллахом ценности даже на вес крылышка мухи. Ибо Аллах принимает только чистое.","Позже был ниспослан следующий аят:","«Скажи: “Скверное и благое не равны, даже если изобилие скверного понравилось тебе (или удивило тебя). Бойтесь же Аллаха, обладатели разума, – быть может, вы преуспеете”».[11]","В хадисе говорится:","«Если кто-то заработает средства запретным путем и будет тратить на себя. это не принесет ему изобилия. Если он раздаст их на благие цели, они не будут угодны Аллаху. Оставшиеся средства приблизят его к адскому огню, так как Аллах не стирает плохое плохим, но плохое стирает хорошим. Несомненно, “хабис” (грязное) не стирает “хабис”».[12]","Уважаемые мусульмане!","Когда людей очаровывает мирское, и они полностью уходят в суетные дела, забывая о вечной жизни или думая об этом, как о чем-то далеком, то погружаются в запретное, утрачивая переживание о чистом пропитании и стремление к нему. Посланник Аллаха (салляллаху алейхи ва саллям) предупреждал:","«Настанут такие времена, когда человек не будет обращать внимания на халяль и харам».[13]","В такое время мусульманин должен проявлять еще большую тщательность в вопросах дозволенности пищи, ибо умиротворение и особое духовное состояние во время поклонений можно достичь исключительно при условии употребления дозволенной пищи.","Наш Пророк (салляллаху алейхи ва саллям) обращался к Аллаху с такой мольбой:","@ar:اَللّٰهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ","«О Аллах! Дай мне дозволенное пропитание и огради меня от запретного. По Своей милости избавь меня от нужды в ком бы то ни было, кроме Тебя».[14]","После утреннего намаза «ас-субх» он читал такую молитву:","@ar:اَللّٰهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلاً مُتَقَبَّلاً","«О Аллах! Я прошу у Тебя полезных знаний, дозволенного и чистого удела и дел, которыми Ты доволен».[15]"]}]}}},
{"id":17,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Страх и надежда","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:تَتَجَافٰى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:لَوْ أَنَّكُمْ كُنْتُمْ تَوَكَّلُونَ عَلَى ٱللَّهِ حَقَّ تَوَكُّلِهِ لَرُزِقْتُمْ كَمَا يُرْزَقُ الطَّيْرُ تَغْدُو خِمَاصًا وَتَرُوحُ بِطَانًا","Дорогие братья и сестры!","Священный аят повелевает:","«Они отрывают свои бока от постелей, (чтобы совершать намаз и истигфар) взывая к своему Господу со страхом и надеждой, и расходуют из того, чем Мы их наделили» (ас-Сажда, 32/16).","Чувства страха и надежды в душе верующего должны находиться в равновесии и гармонии. То есть, сохраняя необходимый баланс, нельзя от страха перед Аллахом доходить до полного отчаяния, в то же время нельзя превращать надежду в самоуверенность. Если вдруг скажут: «В Рай попадет один человек!», истинный мусульманин подумает: «Неужели это я?», а если скажут: «В Ад попадет один человек!», он подумает: «Может, это я?»","Чтобы вложить в сердца рабов богобоязненность и уберечь от тщетных надежд и низменных желаний, Всемогущий Господь посылает с небес и земли бедствия и несчастья, служащие божественным предостережением и наставлением. Считать, что эти беды и несчастья приходят случайно, является легкомыслием и глубоким заблуждением. Бедствия, приходящие внезапно и уносящие тысячи жизней, несущие несчастья и страдания огромному числу людей, не происходят просто так, в каждом из них заключена глубокая мудрость и назидание.","Уважаемые мусульмане!","Не нужно искать видимые причины постигшего нас несчастья, а нужно стараться понять его скрытые, духовные причины. Следует оценивать бедствия, в которых заключена глубокая мудрость, не только материальными критериями, а с точки зрения имана и ислама.","Все мироздание существует по законам, установленным Всевышним Творцом. Даже неверующий не допускает мысли, что может увеличиться или уменьшиться скорость движения Земли или измениться продолжительность суток. Душой он признает божественную волю, но, отрицая ее из-за своего нафса (низменных страстей), называет основные законы вселенной «законами природы» и считает их самостоятельной силой, управляющей жизнью на земле. В то время как эти законы и принципы, истинность которых неоспорима, называются «адатуллах» или «суннатуллах» (законы, правила и положения, установленные Аллахом). Желая сделать этот мир местом испытаний, Создатель проявляет в нем два Своих противоположных сыфата (качества) «Карающий (аль-Каххар)» и «Наделяющий благами (ал-Латыф)».","Землетрясения, пожары, войны, нашествие врагов, эпидемии, засухи, и, наоборот, милость и изобилие, которые относятся к «суннатуллах», приходят внезапно, в соответствии с духовным состоянием рабов. Если большинство рабов находятся на истинном пути (сыратум-мустакым), то дожди ниспадут на землю как благо и милость, принесут с собой благополучие и покой.","Кара Всевышнего начинает проявляться там, где есть харам (запретное), зульм (несправедливость) и массовое распутство. Когда в обществе правит зло, когда большинство людей, отвергнув веру в Истинного Бога, становятся рабами своих страстей, творят мерзость и несправедливость, то дожди милости превратятся в уничтожающее наводнение, или прекратится навсегда, превратив землю в пустыню, или обернутся взрывом в недрах земли, влекущим за собой землетрясение. Эти катастрофы, несомненно, происходят из-за людских грехов, то есть грязь сердец и растление душ ведет к стихийным бедствиям. В аяте повелевается:","«…Воистину, Аллах не меняет положения людей, пока они не изменят самих себя...» (ар-Ра’д, 13/11).","Всевышний Аллах не совершает насилия в отношении своих рабов. Но стихийные бедствия – это то, что своими руками приобрели жестокие и несправедливые рабы. Несомненно, что те, кто выступил против божественного порядка и священных устоев, познает жестокое наказание Аллаха. Всевышний Аллах повелевает:","@ar:وَمَا تَسْقُطُ مِنْ وَرَقَةٍ اِلاَّ يَعْلَمُهَا وَلاَ حَبَّةٍ فِي ظُلُمَاتِ الاَْرْضِ وَلاَ رَطْبٍ وَلاَ يَابِسٍ اِلاَّ فِي كِتَابٍ مُبِينٍ","«…И не падет лист [с дерева] без Его ведома. И нет ни зернышка во мраке земли, ни чего-либо влажного или сухого, о чем бы не было [сказано] в ясной книге» (аль-Ан’ам, 6/59).","Когда даже лист с дерева не падает без ведома Аллаха, находиться в уверенности, что целые страны могут жить бездумно, как заблагорассудиться, является заблуждением и верхом легкомыслия. В то время, как во всем заключена мудрость и тайна.","Дорогие друзья!","Также иногда Господь желает испытать терпение и покорность Своего раба лишениями и тяготами для того, чтобы возвысить его. Об этом Он говорит так:","«Поистине, Мы испытаем вас и долей страха, и голодом, убытками в добре, потерей жизни (тех, кто дорог), потерями плодов (труда). Ты сообщи благую весть всем тем, кто стойко терпит (беды)!..» (аль-Бакара, 2/155).","В хадисе сказано:","«Если Всевышний Аллах дал Своему рабу страдание или чтото еще более тяжелое, то Он мог это сделать по двум причинам: либо для того, чтобы искупить вину раба, либо возвысить его степень» (Рамузуль-Ахадис).","Поэтому проявление сыфата «аль-Каххар» не должно становиться причиной отчаяния, а проявление сыфата «ал-Латыф» не должно становиться причиной полной уверенности и безмятежности.","Уважаемые мусульмане!","Каждое бедствие, конечно, связано с рядом причин, ведущих к возникновению катастрофы, начиная с ветхости зданий, и заканчивая некомпетентностью должностных лиц. Вместе с тем, среди причин, влияющих на течение событий, есть и другие: видимые и невидимые, явные и тайные, определенные и неопределенные, – те, которые скрыты в сердцах людей, – от сопротивления или покорности до конкретных действий. Считается очень большой ошибкой видеть лишь явные стороны события и не замечать его духовных сторон. Некоторые люди, вместо того, чтобы раскаяться в своем неповиновении, продолжают упорствовать в грехах, навлекая на себя еще большую беду.","Но это не значит, что не следует принимать меры по увеличению устойчивости зданий и снижению ущерба для населения в случае чрезвычайных обстоятельств. Только предприняв и сделав все от него зависящее, человек может уповать на Аллаха. Пустое упование неверно.","Однако, даже находясь в укрепленных крепостях, невозможно избежать предопределения Аллаха и спастись от Его гнева, как не смогло спастись племя Самуд, погрязшее в неверии и распущенности. «Мы построим дома на прочных скалах. И нам не будут страшны никакие бури», – говорили они. Высоко в горах они искусно выдолбили себе дома в скалах.","Но их убил ужасный звук, пришедший из-под земли. Всемогущий Аллах повелевает:","«Зловещий вопль поразил неверных – и уж наутро в собственных домах они поверженными ниц лежали, как будто никогда там и не жили. Увы! Ведь самудяне не уверовали (в Аллаха), пусть сгинут со свету они!» (Худ, 11/67-68).","Уважаемые друзья!","Эта истина указывает на то, что для спасения от многих бедствий недостаточно жить в прочных зданиях или в защищенных охраняемых местах. Так как преумножение того, что пробуждает гнев Создателя, а именно: распущенность, смута, неблагодарность, непокорность, грехи, несправедливость, станет причиной бед и страданий, пришедших в наказание от Аллаха.","«Зло появляется на суше и на море по причине того, что совершают людские руки, чтобы они вкусили часть того, что они натворили, и чтобы они вернулись на прямой путь» (ар-Рум, 30/41).","В аяте Корана говорится о «части наказания» за непокорность и грехи, означающее, что истинное наказание ждет людей в ахирате (мире вечном). Кроме того, это наказание служит наставлением и предупреждением для согрешивших рабов, то есть послано ради их воспитания.","Значит, во время бедствий и несчастий раб должен еще больше прибегать к Всевышнему Аллаху и постоянно совершать «истигфар» (взывать о прощении), так как Создатель в аяте Корана повелевает:","@ar:وَمَا كَانَ ٱللَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ","«..Аллах не станет подвергать их мучениям, пока они молят о прощении» (аль-Анфаль, 8/33).","Для защиты от несчастий и обретения блага, вместе с мольбой о прощении следует совершить два раката намаза-хаджат и просить Всевышнего Аллаха о милосердии и сострадании. В аяте сказано:","«О те, которые уверовали! Обращайтесь за помощью к Аллаху с терпением и намазом…» (аль-Бакара, 2/153).","Кроме того, в хадисе говорится:","«Если кто-то морально и материально поможет тому, кто попал в беду, то взамен получит столько же» (Рамузуль-ахадис).","О Аллах! Спаси и сохрани общину пророка Мухаммада (салляллаху алейхи ва саллям) от всяких бед, несчастий, страданий и Своего гнева! Сделай нас обществом счастливых людей во время благополучия и во время нужды, которые, находясь между страхом и надеждой, выдержали все испытания и удостоились наград от Тебя! Даруй нам покой и душевное умиротворение!","Аминь!.."]}]}}},
{"id":18,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура аль-Маида, 4/48; аль-Бакара, 2/148.","Сура аль-Хиджр, 15/29; ас-Сажда, 32/9; Сад, 38/72; аль-Анбия, 21/91; ат-Тахрим, 66/12.","Сура аль-Худжурат, 49/13.","Тирмизи, Адаб, 49/3270; Абу Дауд, Адаб, 110-111/5116.","Муслим, Зикр, 38; Ибн Маджа, Мукаддима, 17.","Ахмад, 5/411.","Бухари, Иман, 22, Итк, 15; Муслим, Айман, 40."],"bibliography":[],"versions":{"ru":{"title":"Превосходство лишь в богобоязненности","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَى وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَاكُمْ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٌ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:اِنَّ ٱللَّهَ تَجَاوَزَ لأُِمَّتِي عَمَّا حَدَّثَتْ بِهِ أَنْفُسَهَا مَا لَمْ تَتَكَلَّمْ أَوْ تَعْمَلْ بِهِ","Дорогие братья и сестры!","Ислам не делает никаких различий между людьми по национальным, религиозным, социальным или клановым признакам. Божественные откровения обращены ко всем людям. Все люди произошли от одного отца – пророка Адама и одной матери – его супруги Евы (Хаввы). Некоторые различия между сынами Адама не должны быть причиной вражды. В существовании различных народов и наций заключено испытание за дарованные блага, чтобы все они состязались в благих деяниях для обретения общих духовных ценностей и достижения общих целей. Это является причиной единения разных народов.[1]","Ислам учит, что превосходство людей друг перед другом определяется не цветом кожи или принадлежностью к тому или иному народу, а степенью богобоязненности (таква). Мусульманин, который строго следует повелениям Аллаха, избегает запретного и наилучшим образом выполняет возложенные на него обязанности, находится в гораздо лучшем положении перед Всевышним Господом, чем те, которые не делают этого. Национальность – это особенность, относящаяся к нашему бренному телу. Тело – это оболочка души (руха). Душа бессмертна, и у нее нет национальности, ибо все души пришли от Аллаха.[2]","Уважаемые братья и сестры!","В Коране повелевается:","«О люди! Воистину, Мы создали вас из мужчины и женщины и сделали вас народами и племенами, чтобы вы узнавали друг друга, и самый почитаемый перед Аллахом среди вас – наиболее богобоязненный. Воистину, Аллах – Знающий, Ведающий».[3]","Причиной ниспослания этого аята послужила такая история: «Как-то Пророк (салляллаху алейхи ва саллям) заглянул на городской рынок Медины. Там продавали чернокожего невольника, который говорил:","• У меня есть условие к человеку, который купит меня.","Один из покупателей спросил:","• Интересно, какое у тебя условие?","Невольник ответил:","• Тот, кто купит меня, не должен мне препятствовать совершению обязательных намазов за нашим Пророком (салляллаху алейхи ва саллям).","Тот человек принял это условие и купил невольника. Посланник Аллаха (салляллаху алейхи ва саллям) каждый раз перед намазом искал глазами этого невольника, но однажды не увидел его среди присутствующих. В следующий раз он опять не увидел его и спросил у его хозяина:","• Где твой невольник?","• У него лихорадка.","Пророк (салляллаху алейхи ва саллям), обращаясь к своим сподвижникам, повелел:","• Вставайте, пойдем проведаем его.","Все вместе они отправились к больному. Придя к нему, они справились о его здоровье и пожелали скорого выздоровления. Через несколько дней Пророк (салляллаху алейхи ва саллям) снова спросил у хозяина о его невольнике. Тот ответил:","• О Посланник Аллаха! Он скоро покинет нас.","Пророк (салляллаху алейхи ва саллям) сразу встал и отправился к нему. Он подошел к нему в тот момент, когда душа покидала его. Невольник скончался на его глазах. Посланник Аллаха (салляллаху алейхи ва саллям) сам руководил обмыванием его тела, облачением в саван и похоронами. Сподвижники были очень удивлены этим. Мухаджиры говорили:","• Мы покинули родину, оставили имущество и семьи. И ни одному из нас, ни в жизни, ни во время болезни, ни после смерти не было оказано такое внимание.","В свою очередь, ансары вторили им:","• Мы приняли Посланника Аллаха, помогли ему и оказали материальную помощь, но он предпочел нам эфиопского невольника.","После этого случая был ниспослан приведенный выше аят суры «аль-Худжурат».","Дорогие братья и сестры!","В день взятия Мекки, когда в руки Посланника Аллаха (салляллаху алейхи ва саллям) попали самые злейшие враги мусульман, он обратился к ним с речью:","«Пусть люди прекратят хвалиться своими предками, иначе станут они пред Богом даже ниже по значению, чем навозный жук. Аллах очистил вас от бахвальства своими предками времен невежества (джахилии). Каждый из вас – либо богобоязненный верующий, либо бахвалящийся грешник. Все люди – дети Адама, а Адам был создан из глины».[4]","Также он говорил:","«Человека, которого деяния отбросили назад, родословная не выведет вперед».[5]","В своей прощальной хутбе Пророк (салляллаху алейхи ва саллям) сказал:","«Поистине, ваш Господь – один, и ваш отец – один! Поистине, араб не превосходит неараба, неараб – араба, красный – черного, а черный – белого ни в чем, кроме богобоязненности. Довел ли я?»[6]","Уважаемые братья и сестры!","Вместе с тем, такие вещи, как национальность, наследство, благородное происхождение, являются реалиями нашей жизни. Ислам не отрицает это полностью, но обращает на это внимание, соблюдая разумную меру.","Рядом с Пророком (салляллаху алейхи ва саллям) были разные люди: с черной и белой кожей, арабы и неарабы, старейшины племен и простые бедуины, свободные и рабы, богатые и бедные. И все они, встав в один ряд за спиной Посланника Аллаха (салляллаху алейхи ва саллям), совершали намаз. Они относились друг к другу с любовью и уважением. И когда они временами совершали ошибку, ища другие, кроме богобоязненности, превосходства, Пророк (салляллаху алейхи ва саллям) сразу делал им предупреждение.","Марур ибн Сувайд (радыйаллаху анху) рассказывал, что в однажды в местечке Рабаза он встретил Абу Зарра (радыйаллаху анху). На нем была богатая одежда, и его слуга был одет так же. Когда его спросили о причине этого, он рассказал такую историю:","«При жизни Пророка (салляллаху алейхи ва саллям) я сказал что-то нехорошее о человеке, который был рабом, и осудил его за прошлое его матери. Посланник Аллаха (салляллаху алейхи ва саллям) узнав об этом, сказал мне:","“Абу Зарр! Ты осуждаешь его за прошлое его матери? Если это так, то оказывается, что ты человек с пережитками невежества. Они ваши слуги, и в то же время они – ваши братья. Аллах отдал их под ваше покровительство. У кого под покровительством есть брат, пусть кормит его тем, что ест сам, и одевает его так, как одевается сам. И не загружает тяжелой работой. Если же им поручена тяжелая работа, то помогите им!”»[7]","О наш Господь! Удали из наших сердец высокомерие и сделай нас из тех, от слов и действий которых не исходит вреда для людей и всех созданных!","О наш Господь, дай нам с милостью и добром относиться к Твоим созданиям ради их Создателя!","О наш Господь, сделавший нас народами и племенами, удали от нас гордыню, ненависть и вражду и направь к добру, миру и любви!"]}]}}},
{"id":19,"collection":"c9","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Сура аль-Бакара, 2/286.","Сура аль-Бакара, 2/185.","Сура аль-Хадж, 22/78.","Сура ан-Ниса, 4/78.","Сура аль-Инширах, 94/5-6.","Сура Таха, 20/25-28.","Сура Таха, 20/1-2.","Сура аль-Аʼраф, 7/157.","Бухари, Таухид, 35; Муслим, Иман, 203, 205.","Муслим, Талак, 29.","Бухари, Ахкам, 43; Муслим, Имара, 90; Муватта, Байат, 1.","Бухари, Иман, 29.","Мисвак – веточка с дерева арак, которое произрастает на Аравийском полуострове.","Бухари, Джума, 8, Темени, 9; Саум, 27; Муслим, Тахарат, 42.","Ахмад, 2/108.","Бухари, Худуд, 10.","Сура аль-Бакара, 2/280.","Ибн Маджа, Садака, 14.","Бухари, Буйу, 17-18; Муслим, Мусакат, 26-31.","Ахмад, 6/167.","Хаким, 2/575."],"bibliography":[],"versions":{"ru":{"title":"Принцип Ислама – не утяжелять, а облегчать","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يُرِيدُ ٱللَّهُ بِكُمُ الْيُسْرَ وَلاَ يُرِيدُ بِكُمُ الْعُسْرَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:لَنْ يَغْلِبَ عُسْرٌ يُسْرَيْنِ: إِنَّ مَعَ الْعُسْرِ يُسْرًا إِنَّ مَعَ الْعُسْرِ يُسْرًا","Уважаемые братья и сестры!","Аллах, обладатель безграничной Милости, желает, чтобы Его рабы не испытывали тягот, и облегчил им Ислам. То есть, жить по законам религии вовсе не означает ведения аскетического образа жизни, отказа от всех мирских радостей и причинение себе страданий ради усмирения плоти. Принятие Ислама и следование его предписаниям под силу даже самым слабым людям.","В аятах Корана повелевается:","«Аллах не возлагает на человека сверх его возможностей»[1];","«Аллах желает вам облегчения и не желает вам затруднения»[2];","«Он избрал вас и не сделал для вас никакого затруднения в религии»[3];","«Аллах желает вам облегчения, ведь человек создан слабым»[4].","Когда была ниспослана сура «аль-Инширах», Посланник Аллаха (салляллаху алейхи ва саллям), обрадовавшись, что Господь обещал после одной трудности два облегчения, с улыбкой сказал:","@ar:لَنْ يَغْلِبَ عُسْرٌ يُسْرَيْنِ: إِنَّ مَعَ الْعُسْرِ يُسْرًا إِنَّ مَعَ الْعُسْرِ يُسْرًا","«Одна трудность не может превзойти два облегчения, так как: «Воистину, за каждой тягостью наступает облегчение. За каждой тягостью наступает облегчение».[5] 138","Господь устами пророка Мусы (алейхиссалям) обучает нас такой молитве:","«Облегчи мою миссию!»[6]","Дорогие братья и сестры!","Всевышний Аллах сообщает, что Он ниспослал Коран не с целью затруднения жизни Пророка (салляллаху алейхи ва саллям) и людей.[7]","«Которые последуют за посланником, неграмотным (не умеющим читать и писать) пророком, запись о котором они найдут в Таурате (Торе) и Инжиле (Евангелии). Он повелит им совершать одобряемое и запретит им совершать предосудительное, объявит дозволенным благое и запрещенным скверное, освободит их от бремени и оков. Те, которые уверуют в него, станут почитать его, окажут ему поддержку и последуют за ниспосланным вместе с ним светом, непременно преуспеют».[8]","Об одном из облегчений Пророк (салляллаху алейхи ва саллям) сообщал следующее:","«Аллах повелел ангелам: “Если Мой раб пожелает совершить грех, не записывайте его до тех пор, пока он действительно не согрешит! И если он совершит грех, то запишите ему один грех! Если же он, желая снискать Мою милость, переменит свое решение, запишете это как награду! Если Мой раб намерится совершить благое деяние, запишите ему одно вознаграждение, даже если он не совершит его! Если Мой раб совершит это деяние, запишите на его счет вознаграждение в десятикратном и даже семисоткратном размере»[9].","Уважаемые братья и сестры!","Пророк (салляллаху алейхи ва саллям) говорил:","«Аллах меня послал не утяжеляющим, а облегчающим и обучающим (пророком)».[10]","Поэтому, когда люди давали обет, что будут слушать его и во всем подчиняться ему, Посланник Аллаха (салляллаху алейхи ва саллям) сам добавлял небольшую оговорку: «По мере сил и возможностей». И таким образом облегчал положение мусульман.[11]","Ислам облегчает не только поклонения, но и выполнение обязанностей перед обществом. Советуя во всем соблюдать меру, Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Бесспорно, эта религия вся состоит из облегчений. Кто постарается затруднить эту религию, напрягая для этого все силы, тот будет побежден. В таком случае придерживайтесь золотой середины и радуйтесь благим вестям от Аллаха».[12]","Пророк (салляллаху алейхи ва саллям) всегда предпочитал более легкие решения по причине сострадания к своей общине:","«Если бы я не опасался затруднить положение своей уммы (общины), то с наступлением времени каждого намаза я повелел бы чистить зубы мисваком[13]».[14]","Другой причиной этого является желание Пророка (салляллаху алейхи ва саллям) снискать любовь и милость Аллаха, ибо он говорил:","«Как Аллах не любит, когда совершают запрещенные Им поступки, также Он любит, когда пользуются облегчениями, дозволенными Им».[15]","Братья и сестры!","Когда Пророк (салляллаху алейхи ва саллям) руководил коллективным намазом, он, заботясь о присутствующих стариках, больных и слабых людях, женщинах и детях, не затягивал его и советовал то же самое другим, руководящим коллективной молитвой. Но когда он оставался один, то долго находился в намазе. Досточтимая Айша (радыйаллаху анха) говорила:","«Когда перед Посланником Аллаха (салляллаху алейхи ва саллям) было два варианта выбора, то если это не противоречило шариату, он всегда предпочитал более легкое. Если дело касалось запретного, то это было далеко от него. Клянусь Аллахом, когда к нему обращались, он никогда не склонялся к мести из личных побуждений. Но, если люди проявляли неуважение к законам Аллаха, и преступали божественные запреты, он никогда не медлил, чтобы выполнить предписание Аллаха».[16]","Абу Муса (радыйаллаху анху) рассказывал: «Когда Посланник Аллаха (салляллаху алейхи ва саллям) поручал кому-то из своих сподвижников выполнение какого-либо дела, то напутствовал его:","«Радуйте, и не приводите в уныние, облегчайте и не утяжеляйте!»","Уважаемые братья и сестры!","Он сам был прекрасным образцом для своих сподвижников и всегда поощрял их к тому, чтобы и они были облегчающими положение других. Это касается, в том числе, и положения должников:","«Если должник находится в трудном положении, то дайте ему отсрочку, пока его положение не улучшится. Но дать милостыню будет лучше для вас, если бы вы только знали!»[17]","Тем, кто облегчает людям их положение, Посланник Аллаха (салляллаху алейхи ва саллям) сообщает благую весть:","«Кто даст отсрочку своему должнику, тот за каждый день отсрочки получит награду, как за милостыню. Кто по наступлении срока отложит возврат долга (его должником), тому за каждый день отсрочки запишется награда как за милостыню в размере долга».[18]","«К одному человеку, жившему до вас, явился ангел, чтобы забрать его душу. Ангел спросил:","• Совершал ли ты хорошие дела?","Тот ответил:","• Не знаю!","Ангел повторил свой вопрос и человек ответил:","• Я не помню, но при жизни я занимался торговлей. При этом состоятельным людям я давал отсрочку, а бедным старался облегчать (входил в положение и некоторые вещи отдавал даром).","За эти добрые дела Всевышний Аллах ввел этого раба в Рай».[19]","Эти и многие другие примеры свидетельствуют о том, насколько Всевышний Господь облегчил для нас соблюдение Его религии. За эту великую Милость, дарованную нам, мы проникнувшись чувством благодарности, как наш любимый Пророк (салляллаху алейхи ва саллям), обязаны восславлять Всевышнего Господа:","«Слава Аллаху, который сделал в религии так много облегчений!»[20]","О наш Господь! Сделай нас из покорных Твоих рабов, усердно выполняющих Твои повеления, отстраняющихся от того, что Ты запретил и искренне поклоняющихся Тебе ради Твоего довольства нами!","О наш Господь, сделай нас из тех, которые облегчают дела людей, и не из тех, которые утяжеляют!"]}]}}},
{"id":20,"collection":"c0","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Сура аль-Аʼраф, 7/156.","Бухари, Таухид, 15.","Сура аль-Бакара, 2/216.","Муслим, Зухд, 64.","Сура аз-Зумар, 39/53-54.","Тирмизи, Даʼват, 98/3540."],"bibliography":[],"versions":{"ru":{"title":"Надежда на лучшее","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَعَسَى أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ وَعَسَى أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ وَاللَُّ يَعْلَمُ وَأَنتُمْ لاَ تَعْلَمُونَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:«عَجَبًا لأَِمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ، وَلَيْسَ ذَاكَ لأَِحَدٍ إِلاَّ لِلْمُؤْمِنِ، إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ، فَكَانَ خَيْرًا لَهُ، وَإِنْ أَصَابَتْهُ ضَرَّاءُ، صَبَرَ فَكَانَ خَيْرًا لَهُ»","Уважаемые братья и сестры!","Ислам учит верующих сохранять надежду на лучшее. Всевышний Аллах повелевает:","«Моя милость объемлет всякую вещь».[1]","Пророк (салляллаху алейхи ва саллям) сказал:","«Когда Господь сотворил все сущее, то в Книге, которая находится над Аршем, записал: “Воистину, Моя милость превосходит Мой гнев!”»[2]","С другой стороны, такие прекрасные качества, как прощение, милосердие, терпение, довольство, благое мнение (хусни зан), значительно облегчают жизнь мусульманина. В моменты испытаний также помогает такое понимание, что несчастье, случившееся с человеком, служит искуплением за грехи или способствует духовному возвышению. Мусульманин, который сделал все возможное, а потом, покорившись судьбе, проявил довольство всем, что дал ему Аллах, не может пребывать в печали или отчаянии. С ним всегда будет умиротворение и ощущение радости. Это повеление Аллаха дает ему утешение, надежду на защиту и спасение:","«Быть может, вам неприятно то, что является благом для вас. И быть может, вы любите то, что является злом для вас. Аллах знает, а вы не знаете».[3]","Дорогие братья и сестры!","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Сколь удивительно положение верующего! Поистине, все в положении его является для него благом и никому (не дано) этого, кроме верующего: если что-нибудь радует его, он благодарит (Аллаха), и это становится для него благом; если же его постигает горе, он проявляет терпение, и это (тоже) становится для него благом».[4]","Врата покаяния для неверующих и грешников раскрыты, пока к ним не приблизилась смерть, или пока не придет Судный День. Но эти события могут наступить внезапно и застать их врасплох, поэтому, не теряя времени, нужно устремиться к Аллаху, ибо Он повелевает:","«Скажи Моим рабам, которые излишествовали во вред самим себе: “Не отчаивайтесь в милости Аллаха. Воистину, Аллах прощает все грехи, ибо Он – Прощающий, Милосердный”. Обратитесь к вашему Господу и покоритесь Ему до того, как мучения явятся к вам, ведь тогда вам уже не будет оказана помощь».[5]","В хадисе-кудси передается такая благая весть от Всевышнего Господа:","«О сын человеческий! Пока ты будешь молиться Мне и будешь надеяться на Мое прощение, Я прощу твои грехи, независимо от количества их и величины их.","О сын человеческий! Если у тебя столько грехов, что они могут заполнить небеса, и ты попросишь Меня простить, Я прощу твои грехи.","О сын человеческий! Если ты предстанешь предо Мной с грехами, которые могут заполнить всю землю, но при этом ты не приобщал Мне равных, не замарал себя скверной многобожия (ширка), Я встречу тебя с милосердием, которое может заполнить всю землю».[6]","Поэтому мусульманин никогда не должен терять надежду на милость и прощение Аллаха.","О наш Господь! Помоги нам быть из тех, кто боится Твоего гнева, но не теряет надежды на Твою Милость и прощение!","О наш Господь! Помоги нам быть из тех, кто в любых обстоятельствах – и в радости, и в горе, взывают к Тебе с благодарностью и терпением, никогда не забывая о Тебе и желая быть всегда вместе с Тобой!"]}]}}},
{"id":21,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура аль-Анкабут, 29/2-3.","Сура аль-Бакара, 2/143.","ан-Насаи 6/26, хадис 3140.","См. сура аль-Джумуа, 62/5."],"bibliography":[],"versions":{"ru":{"title":"Искренность веры","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:أَحَسِبَ النَّاسُ أَن يُتْرَكُوا أَن يَقُولُوا آمَنَّا وَهُمْ لاَ يُفْتَنُونَ","@ar:وَلَقَدْ فَتَنَّا الَّذِينَ مِن قَبْلِهِمْ فَلَيَعْلَمَنَّ ٱللَّهُ الَّذِينَ صَدَقُوا وَلَيَعْلَمَنَّ الْكَاذِبِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:إِنَّ ٱللَّهَ لا يَقْبَلُ مِنْ الْعَمَلِ إِلاَّ مَا كَانَ لَهُ خَالِصًا وَابْتُغِيَ بِهِ وَجْهُهُ","Дорогие братья и сестры!","Всевышний Аллах повелевает:","«Неужели люди полагают, что их оставят и не подвергнут испытанию только за то, что они скажут: “Мы уверовали”? Мы уже подвергли искушению тех, кто был до них. Аллах непременно узнает тех, которые говорят правду, и непременно узнает лжецов».[1]","Всегда существует противостояние между верой и неверием. Данное противостояние порой напоминает судебный процесс, во время которого противоборствующие стороны обязаны предоставить свои доводы и доказательства. Всевышний Аллах, подвергая Своих рабов в этом мире множеству испытаний, желает проверить нашу искренность и преданность.","Если кто-то заявляет о себе, что он милосерден и терпелив, а в реальной жизни не проявляет добросердечия, то его утверждения ложны. Если кто-то искренне относится ко всем созданиям Господа с заботой и состраданием, то он на самом деле милосерден. Насколько человек желает добра всем людям так же, как самому себе, насколько он готов поделиться тем, что имеет, настолько милосердие и доброта утвердились в его сердце, настолько он вобрал в себя черты прекрасной нравственности Посланника Аллаха (салляллаху алейхи ва саллям).","То есть, только праведные поступки могут свидетельствовать о благом нраве человека.","Уважаемые братья и сестры!","Всевышний Аллах желает, чтобы
