я до наступления конца света, чтобы не оказаться из тех, кто потерпит ущерб и испытает отчаяние. В аятах говорится:","«Все на земле смертны» (ар-Рахман, 26),","«Каждая душа вкусит смерть…» (аль-Анбийа, 35).","Смерть однажды обязательно постучится в дверь каждого живущего. Ее страшную тайну предстоит разгадать каждому человеку. Какой бы долгой ни была жизнь человека, если сравнивать его земную жизнь с вечной жизнью, она – всего лишь короткий миг. Как говорится в аяте:","«В тот день, когда они увидят его, им покажется, что они провели в этом мире лишь послеполуденные часы или утро» (ан-Назиат, 46).","Пророк Мухаммад (салляллаху алейхи ва саллям) сказал о продолжительности и ценности этого мира:","«Этот мир, по сравнению с вечным миром, подобен тому, как если бы человек окунул палец в море и посмотрел, сколько воды осталось на нем» (Муслим, Джаннат, 55; Тирмизи, Зухд, 15; Ибн Маджа, Зухд, 3; Ахмад, IV, 229).","Человеку не дано знать, где и когда его настигнет смерть. Нет места, где можно было бы скрыться от нее. В аяте бессилие человека перед смертью описывается так:","«Смерть настигнет вас, где бы вы ни находились, даже если вы будете в возведенных башнях...» (ан-Ниса, 78).","Дорогие братья и сестры!","Разве не кажется странным, что, когда смерть ходит по пятам, и, без всякого сомнения, настигнет каждого, человек тратит жизнь на преходящее, будто рассчитывая остаться в этом мире навсегда? О человеческой беспечности праведный Суфьян Саури говорит:","«Если глашатай объявит: «Пусть поднимется тот, кто уверен, что доживет до сегодняшнего вечера!» Никто не встанет. Но что поразительно, если глашатай объявит: «Пусть встанет тот, кто подготовился к смерти!» Опять же никто не встанет!»","Неужели человек не задумывается, что на протяжении своей жизни он бесчисленное количество раз встречался лицом к лицу со смертью: пережитые болезни, опасные ситуации, аварии, стихийные бедствия и т.п. Неужели человек из-за своей беспечности и невнимательности, неоднократно минуя угрозу своей жизни, не замечал, насколько тонка завеса между человеком и смертью?","Безусловно, каждый живущий в определенное время и в определенном месте встретится с ангелом смерти, и нет места, где можно спрятаться от него. Человек, вникнув в смысл аята: «Бегите же к Аллаху!..» (аз-Зарийат, 50), должен признать Аллаха единственным прибежищем для себя.","Дорогие мусульмане!","Всякая смерть – безмолвный, бессловестный урок, наполненный самыми выразительными наставлениями, назиданиями и мудростью для чистых и восприимчивых сердец. У смерти нет определенного языка. Но в ее немом безмолвии скрыты ужасающие тайны. Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Я оставил вам двух наставников. Один – безмолвный, другой – говорящий. Безмолвный наставник – это смерть, а говорящий – Священный Коран».","Исчерпав земной удел, на кладбища уходят родители, дети, близкие и родственники, друзья и товарищи.","Где бы ни прошла жизнь: в великолепном дворце или в крытой соломой хижине, какой бы длинной или короткой, прямой или извилистой ни была линия жизни, она приведет к одной точке – к могиле. У всех одна история: сначала земля – место проживания для бедных и богатых, для рабов и султанов, для юных и старых, а затем она же – могила для всех.","Поразительно, насколько может обмануться человек земными наслаждениями, придя в гости в этот мир всего на пару дней. Каждый день видя похоронные процессии, он все также уверен, что смерть придет к нему не скоро. Он продолжает считать себя вечным хозяином всего того, что приобрел в жизни, не задумываясь о том, что может потерять все это в любой момент. В тот миг, когда его душа облеклась в тело, он вошел в этот мир, чтобы в нем умереть, но ни разу не вспомнил об этом. Придет день, когда его душа вновь отделится от тела, и через могилу, являющуюся дверью в вечный мир, он направится в другое долгое путешествие.","От Абу Хурайры сообщается, что Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Часто вспоминайте разрушительницу наслаждений – смерть!»","Чаще нужно задумываться о том, что нет на земле такого времени и места, где можно избежать смерти, нет возможности из могилы вернуться назад, нет прибежища на Страшном Суде.","В суре «Фатыр» Всевышний Аллах так описывает стенания грешников, брошенных в Ад:","«Там они завопят: «Господь наш! Выведи нас отсюда, и мы будем поступать праведно, а не так, как мы поступали прежде». Им будет сказано: «Разве Мы не даровали вам жизнь достаточно долгую для того, чтобы опомнился тот, кто мог опомниться? Да и предостерегающий увещеватель приходил к вам. Вкусите же наказание, и нет для беззаконников помощников» (Фатыр, 37).","Аят указывает на два важных аспекта:","во-первых, каждому человеку дано достаточно времени, чтобы понять смысл жизни и смерти;","во-вторых, для предупреждения людей о будущей жизни в потустороннем мире Всевышний Аллах направлял пророков.","Неверующие и грешники испытают горькое раскаяние, но уже будет поздно.","Главной причиной их раскаяний будет осознание впустую потраченного времени жизни. Ведь время нельзя купить или отложить про запас. Даже если человек скопит все богатства этого мира, и проживет с ними тысячу лет, какая от этого польза? В конце концов, исчезнет и его богатство, и он сам уйдет под землю, в темную яму могилы.","О Аллах! Пробуди нас, пока мы не истратили свое время, пока не зашло солнце жизни, чтобы мы не были из тех, кто утопил себя в стакане воды, нырнув в море преходящего мира! О Господь, Милостивейший из милостивых! Укрась нашу жизнь и смерть такими же благами и превосходствами, какими ты одарил своих праведных рабов и сделай наше возвращение к Тебе самым прекрасным и благим!..","Аминь!"]}]}}},
{"id":51,"collection":"c0","sn":"Дорогие братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Тайна судьбы","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قُلْ إِنَّ رَبِّي يَبْسُطُ الرِّزْقَ لِمَن يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ وَمَا أَنفَقْتُم مِّن شَيْءٍ فَهُوَ يُخْلِفُهُ وَهُوَ خَيْرُ الرَّازِقِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:إِذَا ذُكِرَ القَدَرُ فَأَمْسِكُوا","Дорогие братья и сестры!","Божественная Воля присутствует в каждом событии. Без Воли Создателя не поднимется и пылинка, не шевельнется и комариное крылышко. Всевышнему Творцу принадлежит Знание, Он знает все, что было, что есть и что будет. Предопределение всех событий Всевышним Аллахом называется «кадар», или судьба. Исполнение предопределенного в свой срок – это «када». Если сравнить «кадар» с планом, то «када» – осуществление этого плана. Людям не дано постичь тайны судьбы. Сказано:","«У Него [Аллаха] – ключи тайного, о котором знает только Он» («аль-Ан’ам», 6/59).","Лишь немногие, которых Всевышний Господь наделил сокровенными знаниями (ильми–лядуни), способны приоткрыть покров неведомого. Суть этих знаний, записанная на Досках Судьбы (Лавхи-ль-Махфуз), принадлежит запредельному миру, где не действуют законы причинно-следственных связей. Из созданных только Посланник Аллаха (салляллаху алейхи ва саллям) в ночь чудесного Вознесения (Мираджа) удостоился чести заглянуть в вечность: «Я слышал скрип пера, пишущего судьбу» (Хаким, Мустадрак, II, 405). Посланник Аллаха (салляллаху алейхи ва саллям) запретил споры на тему предопределения и сказал: «Если речь идет о судьбе, то воздержитесь [от того, чтобы чрезмерно углубляться в этот вопрос]», и для нас достаточно только веры в него.","Уважаемые мусульмане!","Человек является частицей Вселенной, созданной Всевышним Творцом. Как и другие творения, он появился и существует по воле Аллаха. Обладающий полным знанием обо всем, Всевышний Господь наделил человека волей. Он дал ему свободу выбора совершать или не совершать то или иное действие. Аллах Всевышний сделал это с целью испытания человека. Однако некоторые действия не зависят от воли и желания человека.","Например, рождение, смерть, старение, воскресение – все это предопределено судьбой (кадар). Поскольку эти события происходят независимо от выбора человека, то он не отвечает за них. Никто не может знать своей судьбы заранее до ее наступления (то есть никто заранее не знает «када»).","События, которым предопределено случиться, наступают строго в свой срок. Ни верующий, ни атеист не сомневаются, например, что солнце взойдет и зайдет в установленное время, что после зимы наступит весна. В Коране сказано:","«Веление Аллаха предопределено и исполнено» («аль-Ахзаб», 33/38).","Уважаемые мусульмане!","В том, что человек не знает своего предопределения, есть величайшее благо для него. Ведь жизнь стала бы невыносимой, если бы человек знал наперед, что его постигнут какие-то несчастья или в известный день он умрет. Но из-за того, что Аллах Всевышний скрыл судьбу, человек всегда к чему-нибудь стремится. Это – закон жизни, условие нашего бытия.","Вместе с тем, всякое зло случается по Воле Господа. Всевышний Господь не одобряет его, но позволяет ему свершиться, дабы испытать человека. И не всякому злу суждено произойти, потому что Аллах Всевышний по Своей милости хранит нас от многих бед и грехов, совершаемых по неведению или искушению от собственной души или от дьявола. По незнанию человек может желать себе не только добра, но и зла.","«И человек испрашивает злое так же, как желает добра. Поистине, человек всегда тороплив» («аль-Исра» 17/11).","Например, если кто-то для большей убедительности скажет: «Да лучше я умру на месте, чем это сделаю!», но все-таки сделает то, от чего зарекался, Всевышний Аллах обычно отвечает милостью, не давая этому осуществиться.","Уважаемые друзья!","Другой вид действий, совершаемых человеком, связан с проявлением ограниченной воли (ирада джузиййя), которой его наделил Всевышний Аллах. Используя данную волю во благо, люди заслуживают награду. Если же они используют ее во зло, то их ожидает наказание. Однако любое действие совершается человеком только в том случае, если его воля совпадает с Волей Творца.","Если бы у человека не было выбора, не было бы и отчета. Всевышний Господь определил степень ответственности Своего раба за соблюдение божественных предписаний и запретов соответственно данной ему воле.","Мы не можем снимать с себя ответственности за действия (хотя они и предопределены), если действия эти находятся в поле нашего выбора. Если вставший на дурной путь говорит: «Что поделаешь, так предопределено!» – то тем самым, пытаясь снять с себя ответственность за свои грехи, проявляет невежество и навлекает на себя гнев Господа. Тот, кто желает быть на истинном пути, совершать поклонения Всевышнему Аллаху и искать довольства своего Господа, всегда найдет возможности для этого, а кто не желает – ищет причины не делать этого.","Дорогие мусульмане!","Все живое на земле выполняет свои функции в соответствии с целью своего творения: рождается, растет, выводит потомство, ищет предписанное ему пропитание. Птицы, которые каждое утро голодными вылетают из своих гнезд, возвращаются вечером сытыми. Неутомимые пчелы начинают свой рабочий день с первого раскрывшегося на рассвете цветка и завершают на закате. Подобает ли человеку бездействовать, когда все живые существа постоянно трудятся, выполняя свои обязанности? Всевышний Господь сообщает, что каждое живое существо наделит пропитанием (ризк), но, чтобы получить его, нужно приложить усилия и труд.","«Скажи: “Воистину, мой Господь увеличивает или ограничивает удел тому из Своих рабов, кому пожелает. Он возместит все, что бы вы ни израсходовали. Он – Наилучший из дарующих удел”» («Саба» 34/39).","Пророк Мухаммад (салляллаху алейхи ва саллям) говорил:","«Никто не питался более благой пищей, чем та, которую он честно заработал. Дауд/Давид (алейхиссалям), посланник Аллаха, питался тем, что он заработал своим трудом» (Бухари, Анбия, 37).","После того, как человек предпринял все возможное и зависящее от него для достижения желаемой цели, он возлагает исход дела на Всевышнего Господа. Всевышний Аллах говорит:","«Человек получит только то, к чему он стремился» («ан-Наджм», 53/39).","Например, фермер, который во всем полагается на волю Аллаха, должен в нужное время вспахать поле и засеять его, по мере необходимости удобрять, бороться с сорняками и поливать посевы. После всего этого ему нужно возложить исход своих дел на Аллаха и просить, чтобы Он даровал обильный урожай. Труд – от нас, результат – от Аллаха.","Дорогие друзья!","Тот, кто верит в предопределение, знает, что в мире ничто не происходит без ведома Аллаха.","«Если Аллах коснется тебя вредом, то никто, кроме Него, не избавит тебя от него. Если Он пожелает одарить тебя добром, то никто не отвратит Его милости. Он одаряет ею того из Своих рабов, кого пожелает. Он – Прощающий, Милосердный» (Коран, «Иона» 10/107).","Вера в предопределение приводит мысли и всю жизнь людей в порядок. Привычка считать случившееся следствием определенных причин и видеть связь между событиями исключает понятие случайности. Вера в предопределение вырабатывает в человеке такие прекрасные качества, как стойкость, бесстрашие, постоянство, терпение и старательность. Он никогда не падает духом, не проявляет небрежности, слабости и лени. Он довольствуется тем, что имеет, и неукоснительно соблюдает чужие права. Он избавлен от таких пороков, как алчность, жадность и зависть. Он доволен своим Господом, обретая такие прекрасные качества, как «таваккуль» (упование) на волю Аллаха и «таслим» (покорность), и удостаивается Его милости. Вера в предопределение прибавляет человеку уверенности, избавляет от сомнений, негативных мыслей, излишних тревог и беспричинных волнений. Она делает человека не пассивным, униженным, нищим и неуверенным, а активным, смелым, деятельным.","Она наполняет нас надеждой на Всевышнего Господа и спасает от пустых тревог и волнений о нашем будущем.","О Господь, сделай нас из Твоих богобоязненных рабов, принимающих свою судьбу с благодарностью, проявляющих терпение в тяготах и сдержанность в радостях. Дай нам достойно пройти через то, что нам предопределено, чтобы через эти испытания воспитать себя и освободиться от всего низменного и недостойного Взора нашего Господа, чтобы через эти испытания заслужить Твою милость и довольство. Аминь!"]}]}}},
{"id":52,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура ан-Ниса, 4/36.","аль-Бухари 6014, 6015, Муслим 2624, 2625","Ибн Хаджар, Фатхуль-Бари; Даруль-Фикр, Фуат Абдулбаки, X, 456; Суйюти, аль-Джами’ус-сагир, I, 146.","Ахмад, III, 407.","Насаи, Истиаза, 44.","Тирмизи, Зухд, 2/2305; Ибн Маджа, Зухд, 24.","Муслим, Бирр, 143.","Хаким, 2/15; Хайсами, 8/167.","Хаким, 2/526.","Байхаки, Шуайб, 7/83; Куртуби, 5/120-123.","Бухари, Адаб, 29; Муслим, Иман,"],"bibliography":[],"versions":{"ru":{"title":"Права соседей","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَاعْبُدُوا ٱللَّهَ وَلاَ تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَى وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ إِنَّ ٱللَّهَ لاَ يُحِبُّ مَن كَانَ مُخْتَالاً فَخُورًا","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:مَا زَالَ جِبْريلُ يُوصِيني بِالجَارِ حَتَّى ظَنَنْتُ أنَّهُ سَيُورِّثُهُ","Дорогие братья и сестры!","Всевышний Создатель повелевает соблюдать права соседей, ибо человек в повседневной жизни постоянно находится ближе к своим соседям, чем к родственникам. В Коране повелевается:","«Поклоняйтесь Аллаху и не приобщайте к Нему сотоварищей. Делайте добро родителям, родственникам, сиротам, беднякам, соседям из числа ваших родственников и соседям, которые не являются вашими родственниками, находящимся рядом спутникам, странникам и невольникам, которыми овладели ваши десницы».[1]","Выражение «делайте добро... ближним соседям» означает хорошо обходиться, помогать и быть снисходительным к недостаткам соседей, которые живут рядом.","Передают со слов Ибн ‘Умара и ‘Аиши, да будет доволен Аллах ими обоими, что Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Джибрил не прекращал давать мне наставления о необходимости хорошего отношения к соседу (так долго), что я даже подумал, что он включит его и в число наследников»[2].","«Делайте добро... дальним соседям» означает быть дружелюбными и оказывать помощь тем соседям, кто живет на отдалении от вас, или к тем, с которыми вас не связывают родственные узы, или которые не являются верующими.","Посланник Аллаха (салляллаху алейхи ва саллям) подразделил соседей на три категории с учетом их права:","а) Соседи, обладающие одним правом, – это немусульмане. У них есть только право соседей.","б) Соседи, обладающие двумя правами – это мусульмане. У них есть права как соседей, так и единоверцев.","в) Соседи, обладающие тремя правами – это мусульмане, являющиеся родственниками. У них есть и права соседей, и права братьев по вере, и права родственников.[3]","Уважаемые друзья!","Стремясь иметь хороших соседей, мы сами, прежде всего, должны стать хорошими соседями, а во-вторых, прилагать усилия, чтобы жить в окружении праведных соседей. Одно из обстоятельств, которое делает мусульманина счастливым в земном мире, – это проживание рядом с благочестивым соседом.[4] Поэтому наш Пророк (салляллаху алейхи ва саллям) сказал:","«Просите у Аллаха, чтобы Он уберег вас от соседства со скверным человеком в месте постоянного проживания! Каким бы ни был сосед там, где вы живете временно, с ним вы когда-нибудь расстанетесь».[5]","В народе говорится: «Не дом покупай, а соседа выбирай!», что показывает, насколько важно с духовной точки зрения проживание среди хороших соседей.","Вместе с тем нужно терпеливо переносить и небольшие трудности, причиняемые соседями. Всевышний Аллах любит человека, который терпелив в отношении своего соседа ради довольства Аллаха. Всевышний Аллах охраняет его от вреда соседа. Наш Пророк (салляллаху алейхи ва саллям) сказал:","«…Делай добро соседу, чтобы быть совершенным верующим...»[6].","Абу Зарр (радыйаллаху анху) передал: «Мой друг Посланник Аллаха (салляллаху алейхи ва саллям) давал мне такое наставление:","“Когда варишь суп, наливай побольше воды. Затем мысленно перебери своих соседей и с радостью поделись с теми, кого ты считаешь нужным накормить!”»[7].","Исходя из этого хадиса, даже бедность не является уважительной причиной, когда идет речь о соблюдении прав соседей. Человек, находящийся в стесненных материальных условиях, тоже должен поддерживать своего соседа. Посланник Аллаха (салляллаху алейхи ва саллям) сделал следующее предостережение:","«Не из верующих тот, кто ложится спать сытым, в то время как его сосед голоден».[8]","Примером того, как благородные сподвижники, следуя этому хадису, соблюдали права соседей, является рассказ Ибн Умара (радыйаллаху анху):","«Было семь домов, и все они были бедными. Хозяин одного из этих домов отправил соседу в подарок баранью голову. Тот, подумав, что другой сосед больше нуждается в этом, отдал баранью голову ему. А третий сосед с той же мыслью отправил баранью голову следующему соседу. Таким образом, баранья голова обошла все дома и вернулась в тот дом, откуда она была послана изначально».[9]","Мы видим, насколько благородна и высока нравственность, которая создала эту цивилизацию.","Добро и милосердие являются основополагающими принципами Ислама. Так как даже небольшой некрасивый поступок бросает тень на суть Ислама, то о недопустимости чего-либо, порочащего нашу великую религию, был ниспослан ряд серьезных предупреждений.","Уважаемые мусульмане!","Причинение беспокойства соседям свидетельствует о слабости веры. Соседи не должны причинять друг другу зло. Сообщается со слов Абу Хурейры (радыйаллаху анху), что наш Пророк (салляллаху алейхи ва саллям) сказал:","«Не уверовал, клянусь Аллахом. Не уверовал, клянусь Аллахом. Не уверовал, клянусь Аллахом».","Сподвижники спросили:","«Кто, о Посланник Аллаха?»","«Тот человек, чей сосед не находится в безопасности от него!» 284","Наш Пророк (салляллаху алейхи ва саллям) так сформулировал права соседей:","«Если кто-то вынужден запирать дверь из-за опасения, что сосед может причинить его семье и его имуществу вред, то сосед не является действительно уверовавшим. Так и сосед, от которого можно ожидать любой неприятности, не является действительно уверовавшим.","Знаете ли вы, какие права имеют соседи? Нужно помогать им, когда они обращаются за помощью; давать им в долг, когда они просят; помогать им в случае нужды; посещать их, когда они болеют; поздравлять их, когда в их жизни случается хорошее; утешать их, когда их постигает несчастье; участвовать в их похоронах, когда они умирают. Чтобы не заслонять приток свежего воздуха, нельзя без разрешения соседа строить дом выше его дома. Чтобы запах (готовящейся) пищи не доставлял неудобства соседу, угости и его, даже если у тебя мало. Если покупаешь фрукты, угости и его. Если не можешь этого сделать, то заноси домой фрукты так, чтобы не было видно. Пусть твои дети, не выходят с фруктами на улицу, дабы не вызывать зависть соседских детей».[10]","О Аллах, сделай нас из тех, кто самым лучшим образом соблюдает права соседей, не причиняет им вреда ни действием, ни словом, проявляет внимательность и чуткость к их заботам и нуждам! Помоги нам стать совершенными верующими, делая добро нашим соседям ради Твоего довольства! Аминь!"]}]}}}
];

const sect=(t,body)=>`<div class="orn">${star}<h2>${t}</h2><i></i></div>${body}`;

function home(){
 const q=S.q.trim().toLowerCase();let h=`<div class="top"><span class="t">Библиотека хутб</span><button class="ib" onclick="sheet(1)" aria-label="Настройки">${I("set")}</button></div><div class="wrap"><div class="hero"><div class="eb">Цифровая библиотека</div><h1>Пятничные хутбы</h1><p class="sub">Собрание проповедей по порядку: удобно читать, искать и возвращаться.</p><label class="search">${I("s")}<input id="q" placeholder="Поиск по названию, теме, тексту" value="${esc(S.q)}" oninput="S.q=this.value;sr()"></label></div><div id="hc">`;
 return h+hc()+"</div></div>"}
function hc(){
 const q=S.q.trim().toLowerCase();
 if(q){const r=KHUTBAS.filter(k=>JSON.stringify(k.versions).toLowerCase().includes(q));return sect("Результаты",r.length?r.map(card).join(""):'<div class="empty">Ничего не найдено</div>')}
 if(S.col){const c=COLLECTIONS.find(x=>x.id===S.col);return `<button class="chip" style="margin-top:18px;color:var(--tx);border-color:var(--ln)" onclick="S.col=null;render()">← Все сборники</button>`+sect(esc(c.name),KHUTBAS.filter(k=>k.collection===S.col).map(card).join("")||'<div class="empty">Пока пусто</div>')}
 let h="";const last=D.recent.map(get).find(k=>k&&D.pos[k.id]>0.01&&D.pos[k.id]<.98);
 if(last)h+=sect("Продолжить чтение",`<button class="big" onclick="go('read',${last.id})"><span class="eb" style="color:inherit;opacity:.7">№${last.id}</span><b>${esc(ttl(last))}</b><div class="pr"><i style="width:${Math.round(D.pos[last.id]*100)}%"></i></div></button>`);
 h+=sect("Тематические сборники",`<div class="row">${COLLECTIONS.map(c=>`<button class="col" onclick="S.col='${c.id}';render()"><span class="num">${KHUTBAS.filter(k=>k.collection===c.id).length}</span><b>${esc(c.name)}</b><small>${esc(c.desc)}</small></button>`).join("")}</div>`);
 h+=sect("Последние открытые",D.recent.length?D.recent.map(get).filter(Boolean).slice(0,4).map(card).join(""):'<div class="empty">Вы ещё ничего не открывали</div>');
 h+=sect("Избранное",D.fav.length?D.fav.map(get).filter(Boolean).map(card).join(""):'<div class="empty">Нажмите «В избранное» на странице хутбы</div>');
 return h+sect("Все хутбы по порядку",KHUTBAS.map(card).join(""))}
function sr(){$("hc").innerHTML=hc()}

function pr(p){if(p.startsWith("@ar:"))return `<p class="ar" dir="rtl" lang="ar">${esc(p.slice(4))}</p>`;let c="";if(/^(Уважаемые|Дорогие|Братья|Сестры|Мусульмане)/.test(p)&&p.length<70&&/!$/.test(p))c="gr";else if(p[0]==="«")c="q";else if(p[0]==="•")c="li";return `<p${c?` class="${c}"`:""}>${esc(p).replace(/\[(\d+)\]/g,'<sup onclick="fnj($1)">$1</sup>')}</p>`}
const mark='<svg viewBox="0 0 84 40" width="84" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 0v9"/><g transform="rotate(-14 18 22)"><path d="M24 12A11 11 0 1 0 29 30 9 9 0 1 1 24 12Z" fill="currentColor" stroke="none"/></g><text x="46" y="31" font-family="Literata,Georgia,serif" font-size="26" font-weight="600" fill="currentColor" stroke="none">M</text></svg>';
function read(){
 const k=get(S.id),v=ver(k,S.lang),s=D.set,fav=D.fav.includes(k.id),off=D.off.includes(k.id),n=D.notes[k.id];
  const rtl=S.lang==="ar"?' dir="rtl"':"";
 const body=v.sections.map((x,i)=>(x.h?`<h2 id="s${i}"><span>${i+1}</span>${esc(x.h)}</h2>`:"")+x.p.map(pr).join("")).join("");
 return `<div class="rd" data-rt="${s.rt}"><div class="top" style="background:color-mix(in srgb,var(--rb) 88%,transparent);color:var(--rt);border-color:var(--rl)"><button class="ib" onclick="go('home')" aria-label="Назад">${I("back")}</button><span class="t">№${k.id} · ${esc(v.title)}</span><button class="ib" onclick="sheet(1)" aria-label="Настройки чтения">${I("set")}</button><div class="bar" id="bar"></div></div>
 <article class="art" style="--fs:${s.fs}px;--lh:${s.lh};--w:${s.w}px"${rtl}>
 <div class="eb">Хутба №${k.id}</div><h1>${esc(v.title)}</h1>
 ${Object.keys(k.versions).length>1?`<div class="acts">${Object.keys(k.versions).map(l=>`<button class="chip ${l===S.lang?"on":""}" onclick="S.lang='${l}';render()">${LN[l]||l}</button>`).join("")}</div>`:""}
 <div class="acts"><button class="chip ${fav?"on":""}" onclick="tf(${k.id})">${fav?"★ В избранном":"☆ В избранное"}</button><button class="chip ${n?"on":""}" onclick="S.noteOpen=!S.noteOpen;render()">✎ Заметка</button><button class="chip" onclick="shr()">↗ Поделиться</button><button class="chip" onclick="try{print()}catch(e){}">⎙ Печать</button><button class="chip ${off?"on":""}" onclick="tof(${k.id})">${off?"✓ Сохранено":"⇩ Офлайн"}</button></div>
 ${S.noteOpen?`<textarea id="nt" placeholder="Ваша заметка" oninput="D.notes[${k.id}]=this.value;save()">${esc(n||"")}</textarea>`:n?`<div class="note">${esc(n)}</div>`:""}
 ${v.sections.filter(x=>x.h).length>1?`<details><summary>Содержание</summary>${v.sections.map((x,i)=>`<a onclick="document.getElementById('s${i}').scrollIntoView()">${i+1}. ${esc(x.h)}</a>`).join("")}</details>`:""}
 ${body}
 ${k.footnotes.length?`<div class="fn"><h3>Сноски</h3>${k.footnotes.map((f,i)=>`<p id="fn${i+1}"><b>${i+1}.</b> ${esc(f)}</p>`).join("")}</div>`:""}
 ${k.bibliography.length?`<div class="bib" style="margin-top:2em"><h3>Библиография</h3>${k.bibliography.map(b=>`<p>${esc(b)}</p>`).join("")}</div>`:""}
 <div class="ft" style="color:var(--p)">${mark}<br><span style="color:var(--rm)">Конец хутбы №${k.id}</span></div></article></div>`}
const fnj=n=>{const e=document.getElementById("fn"+n);e&&e.scrollIntoView()};
const tf=id=>{D.fav=D.fav.includes(id)?D.fav.filter(x=>x!=id):[id,...D.fav];save();render()};
const tof=id=>{D.off=D.off.includes(id)?D.off.filter(x=>x!=id):[...D.off,id];save();render()};
async function shr(){const k=get(S.id),t=ttl(k);try{if(navigator.share)await navigator.share({title:t,text:t});else{await navigator.clipboard.writeText(t);alert("Скопировано")}}catch(e){}}

function sheet(o){const e=$("sh");if(!o){e.classList.remove("on");return}
 const s=D.set;const sg=(key,arr)=>`<div class="seg">${arr.map(a=>`<button class="${s[key]==a[0]?"on":""}" onclick="D.set.${key}='${a[0]}';chg()">${a[1]}</button>`).join("")}</div>`;
 const sl=(l,k,mn,mx,st,u)=>`<div class="sl"><span>${l}</span><input type="range" min="${mn}" max="${mx}" step="${st}" value="${s[k]}" oninput="D.set.${k}=+this.value;this.nextElementSibling.textContent=this.value+'${u}';chg(1)"><span style="width:52px;text-align:right">${s[k]}${u}</span></div>`;
 $("shc").innerHTML=`<div class="g"></div><h4>Цвет приложения</h4><div class="sw">${[160,215,270,330,25,90].map(h=>`<button class="${s.accent==h?"on":""}" style="background:hsl(${h} 45% 40%)" onclick="D.set.accent=${h};chg()" aria-label="цвет"></button>`).join("")}</div>
 <h4>Тема приложения</h4>${sg("theme",[["auto","Авто"],["light","Светлая"],["dark","Тёмная"]])}
 <h4>Чтение</h4>${sl("Размер шрифта","fs",14,30,1,"px")}${sl("Интервал","lh",1.3,2.2,.05,"")}${sl("Ширина колонки","w",420,860,10,"px")}
 <h4>Тема страницы</h4>${sg("rt",[["light","Светлая"],["warm","Тёплая"],["dark","Тёмная"]])}
 <h4>Автор</h4><a class="lk" href="https://t.me/Itzmahmudj" target="_blank" rel="noopener">☕ Купите мне кофе</a><a class="lk" href="https://t.me/akxqm" target="_blank" rel="noopener">✈ Telegram-канал</a>`;
 e.classList.add("on")}
function chg(live){save();apply();if(S.v==="read"){const a=document.querySelector(".art");if(live&&a){a.style.setProperty("--fs",D.set.fs+"px");a.style.setProperty("--lh",D.set.lh);a.style.setProperty("--w",D.set.w+"px")}else{render();}}if(!live)sheet(1)}

function render(){const a=$("app");a.innerHTML=S.v==="home"?home():read();if(S.v==="read")prog()}
function prog(){const b=$("bar");if(!b)return;const m=document.body.scrollHeight-innerHeight;b.style.width=(m>0?scrollY/m*100:0)+"%"}
let tm;addEventListener("scroll",()=>{if(S.v!=="read")return;prog();clearTimeout(tm);tm=setTimeout(()=>{const m=document.body.scrollHeight-innerHeight;D.pos[S.id]=m>0?Math.min(1,scrollY/m):0;save()},300)},{passive:true});
apply();render();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
