 мусульмане были на этой земле Его свидетелями, то есть были лучшими в религиозных знаниях и нравственности:","«Мы сделали вас общиной, придерживающейся середины, чтобы вы свидетельствовали обо всем человечестве, а Посланник свидетельствовал о вас самих».[2]","Чтобы выполнить это веление Аллаха, нужно правильно соблюдать первое условие веры – «веру в Аллаха».","Иман (вера) означает веру в сердце и подтверждение ее словами. То есть, первым условием веры является избавление сердца от всех сомнений и противоречий, возникающих по поводу столпов веры, и подтверждение ее сердцем, обретшим покой. Следовательно, не может быть речи о полноценности веры, которая не утвердилась в сердце, не отражается в поступках, не проявляется во всех сторонах жизни человека, а лишь декларируется на словах.","Лишь тот человек, в чьем сердце утвердилась вера (иман) становится верующим (му’мином). Одно из 99 Прекрасных Имен Всевышнего Аллаха «аль-Му’мин» имеет значения: пробуждающий свет веры в душе; оберегающий тех, кто просит у Него защиты; внушающий уверенность; Тот, чьи обещания надежны. Всевышний Аллах, называя верующих «му’мин», желает видеть в уверовавших рабах отражение Своего Прекрасного Имени «аль- Му’мин». Сохранение верующим верности произнесенному свидетельству веры (шахада) тоже является одним из этих отражений.","Уважаемые братья и сестры!","Со слов Абу Амамы аль-Бахили сообщается, что Пророк (салляллаху алейхи ва саллям) сказал: «Поистине Аллах принимает те дела, которые совершаются искренне и только ради Него».[3]","В течение всей жизни он обязан задавать сам себе вопросы: «Доволен ли Всевышний Аллах моим состоянием, этим поступком, этими чувствами и мыслями? Если бы Посланник Аллаха (салляллаху алейхи ва саллям) находился рядом со мной, улыбнулся бы он мне или бы отвернулся?» Это и есть суть веры. А совершенство веры проявляется в обретении сердцем чуткости и чувствительности, через нахождение в этом состоянии самоотчета.","Аналогичным образом следует оценивать глубину веры и в другие «столпы имана». Человек, убежденно верующий в Аллаха, должен верить в ангелов, в священные книги, в пророков, в Судный день, в предопределение судьбы и в воскрешение после смерти. Верующий должен всей душой проникнуться смыслом всех столпов имана.","Суть столпов имана должна утвердиться в уме, душе, совести и во всей сущности человека, после чего он будет всегда соизмерять свое духовное состояние и поступки с предписаниями религии и идти по истинному пути. Лишь тогда иман человека из состояния таклид (подражание) достигает степени тахкик (настоящий).","Уважаемые братья и сестры!","Человек не может развиваться духовно, лишь набирая теоретические знания из книг по религии. В Священном Коране люди, которые постигают религию разумом, но не впитывают душой и не проявляют ее в своем поведении и поступках, сравниваются с ослами, нагруженными книгами.[4]","Вера – это прежде всего любовь. Без искренней любви невозможно обрести верность, преданность, покорность и удостоиться довольства Всевышнего Аллаха. Знания, содержащиеся в строках книг, должны наполнить сердце, потом, усвоенные разумом и пережитые душой, они проявляются в виде праведных деяний, которые составляют основу благочестивой жизни, характеризуемой понятием «таква» (богобоязненность). Это достижимо только через любовь. Именно любовь является источником богобоязненности.","В Священном Коране 258 раз упоминает слово «таква» и ее производные, смысл которой можно определить следующим образом:","Таква – искусство быть рабом Аллаха.","Таква – умение сохранять душевный покой в любых жизненных ситуациях.","Таква – обретение благих черт из нравственности пророка Мухаммада (салляллаху алейхи ва саллям).","Таква – усмирение низменных потребностей и раскрытие духовного потенциала.","Таква – способность чувствовать и отличать дозволенное (халяль) от запретного (харам) и оберегать свое сердце от запретного.","Таква – выполнение предписаний Ислама, осознавая себя под постоянным Взором Аллаха.","Таква – способность чувствовать сердцем Взор Аллаха.","Братья и сестры!","То есть, богобоязненность является непременным условием поклонения Творцу и праведной жизни, основанной на вере (иман), поклонении (ибадат), соблюдении норм поведения в личной и общественной жизни (муамалят) и благой нравственности.","Обретение сердцем богобоязненности возможно в условиях искреннего и вдохновенного служения Всевышнему Творцу с чувством глубокой благодарности за дарованные Им блага, ценнейшим из которых является вера (иман).","Да наполнит Всевышний Аллах наши сердца чувствами, которыми Он будет доволен, и да украсит наши сердца «таква».","Да удостоит нас Всевышний Аллах прожить эту жизнь и совершить последний вздох, будучи мусульманами!"]}]}}},
{"id":22,"collection":"c1","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Свидетельство любви к Аллаху","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قُلْ اِنْ كُنْتُمْ تُحِبُّونَ ٱللَّه فَاتَّبِعُون۪ي يُحْبِبْكُمُ ٱللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْۜ وَاللُّٰ غَفُورٌ رَح۪يمٌ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:للََُّ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ حِينَ يَتُوبُ إِلَيْهِ مِنْ أَحَدِكُمْ كَانَ عَلَى رَاحِلَتِهِ بِأَرْضِ فَلاَةٍ فَانْفَلَتَتْ مِنْهُ وَعَلَيْهَا طَعَامُهُ وَشَرَابُهُ فَأَيِسَ مِنْهَا فَأَتَى شَجَرَةً فَاضْطَجَعَ فِى ظِلِّهَا قَدْ أَيِسَ مِنْ رَاحِلَتِهِ فَبَيْنَا هُوَ كَذَلِكَ إِذَا هُوَ بِهَا قَائِمَةً عِنْدَهُ فَأَخَذَ بِخِطَامِهَا ثُمَّ قَالَ مِنْ شِدَّةِ الْفَرَحِ: اللَّهُمَّ أَنْتَ عَبْدِى وَأَنَا رَبُّكَ. أَخْطَأَ مِنْ شِدَّةِ الْفَرَحِ.","Уважаемые братья и сестры!","В хадисе-кудси говорится:","«Я (Всевышний Аллах) был скрытой сокровищницей и пожелал быть познанным, и создал мир творений» (Исмаил Хаккы Бурсави, «Канз Махфи»).","Всевышний Господь создал этот величественный мир, наполнил его красотой и великолепием, установил в нем безукоризненный порядок и гармонию и сделал его благоприятным и комфортным для жизни созданий.","Наш Господь, одно из прекрасных Имен которого «аль-Вадуд» (Любящий), создал все сущее по причине Своей Любви. Он проявил Свою любовь через бесчисленные блага, которыми наделил нас, и довел благую весть о том, что вознаградит еще лучшими благами в мире вечном своих искренних рабов.","Цель сотворения человека – повиновение Господу и познание Его. Известно, что самым глубоким и вдохновляющим знанием, является то, которое обретается с любовью. Для того, чтобы облегчить пути познания и приближения к Нему, Всевышний Аллах вложил способность любить в души Своих рабов.","Дорогие братья и сестры!","Люди по природе своей питают любовь к тем, кто делает им добро. А добро, исходящее от Аллаха, безгранично, как и множество явных и скрытых милостей, дарованных Им:","«Если вы захотите сосчитать блага Аллаха, то не сможете» (Сура «Ибрахим», 34).","Господь Бог наделяет благами и праведников, и грешников, и верующих и неверующих. Поэтому в действительности только Он заслуживает любви. Любовь к Аллаху является необходимой частью веры и выражением благодарности Ему.","Любовь раба к своему Господу имеет два уровня:","• Общая любовь. Это естественная и обязательная любовь всякого верующего в Аллаха.","• Особая любовь. Ее удостаиваются только обладатели знания, праведники, просвещенные (аулия), искренние ученые и чистые (сердцем) верующие. Это самая высокая степень (макам) из всех степеней. Любовь ради Любимого, которая ничего не требует взамен.","Братья и сестры!","Для того, чтобы наполнить сердце любовью к Всевышнему Аллаху, в первую очередь, следует освободить его от мирских привязанностей. В сердце, постоянно занятом мирскими делами, не остается места для Аллаха, ведь в Коране сказано, что Аллах не создал для человека двух сердец.","Эта возвышенная любовь подразумевает постоянную обращенность к Господу, повиновение, поклонение, поминание Его (зикр) и размышление о Его Величии.","Тот, кто любит Аллаха, любит все, что исходит от Него: он любит намаз, пост, хадж и все другие предписания ислама. Он с вдохновением совершает поклонения. Любящий Аллаха любит и радость, и беды, которые ему ниспосылает Всевышний, ибо в них заключена великая мудрость, возможность обращения к Аллаху и приближения к Нему. Он доволен Его предопределением. Любящий Аллаха уповает только на Него, страшится только Его гнева и только Его довольства взыскует.","Дорогие братья и сестры!","Причина любви к Аллаху – это знание о Нем. Чем больше знания – тем сильнее любовь. И чем меньше знания – тем слабее любовь. Ищущий знания, чтобы освободить сердце, являющееся местом Взора Всевышнего, от всего низменного и недостойного.","В хадисе, прочитанном в начале проповеди, передано со слов Анаса ибн Малика, что Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Аллах рад покаянию Своего раба, когда тот обращается к Нему, сильнее, чем человек, который ехал по пустыне на своей верблюдице, а та убежала от него и унесла на себе его еду и питьё. Он отчаялся найти её, пришёл к дереву и прилёг в его тени. И вдруг он увидел свою верблюдицу, стоящую перед ним. Он схватил её за поводья и с радостью воскликнул: «Господи, Ты — раб мой, а я — Твой господь». Он допустил ошибку из-за большой радости» (аль-Бухари 6309; Муслим 2747).","Кто же эти познающие сердцем путь к Аллаху, по каким признакам можно их определить?","• Это те, которые любят Коран и строго следуют ему, поскольку в основе пути обретения божественной любви лежит правильное вероубеждение и соблюдение всех предписаний Аллаха.","— Это те, которые любят Пророка (салляллаху алейхи ва саллям) и следуют его Сунне, ибо в Священном Коране Аллах повелевает:","«Скажи Мухаммад: «Если вы любите Аллаха, то следуйте за мной, и тогда Аллах возлюбит вас и простит ваши грехи. Аллах – Прощающий, Милостивый» (сура «Али Имран», аят 31).","Уважаемые братья и сестры!","Именно следование пути Пророка (салляллаху алейхи ва саллям) является свидетельством любви к Аллаху и средством, приводящим к любви к Аллаху.","• Это те, которые часто поминают Аллаха. Если человек любит Аллаха, он усердствует в поминании Его, и тогда Господь озаряет его сердце любовью к Нему.","«Поминайте Меня, и Я буду помнить о вас» (сура «аль-Бакара», аят 152).","• Это те, которые любят любящих Аллаха. Суфьян Саури сказал:","«Тот, кто полюбит того, кого любит Аллах, того и Аллах полюбит; тот, кто возвеличит того, кого возвеличивает Аллах, того и Аллах возвеличит».","Сила любви к Аллаху зависит от состояния души. Есть души застывшие, а есть души пламенные. Застывшие души никогда не смогут дойти до Возлюбленного, ибо они не желают обременяться тяготами и лишениями на пути любви.","Только пламенные души способны, подобно полноводным рекам, преодолевать пороги и огромные расстояния, чтобы слиться с желанным морем божественной Любви.","О, Аллах! Прости нам наши грехи и сделай нас из тех, которые поклоняются Тебе наилучшим образом! Аминь!"]}]}}},
{"id":23,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура аль-Аʼраф, 7/151.","Бухари, Адаб, 19; Муслим, Тауба, 17.","Сура аль-Анбия, 21/107.","Сура ат-Тауба, 9/128; Куртуби, 7/192.","Тирмизи, Бирр, 16/1924.","Бухари, аль-Адабуль-муфрад, 278.","Хайсами, 8/15.","Муслим, Фадаиль, 63.","Бухари, Истиска, 13.","Ибн Хишам, 2/261.","Хаким, 4/185/7310.","Ахмад, 3/439."],"bibliography":[],"versions":{"ru":{"title":"Милосердие","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:قَالَ رَبِّ اغْفِرْ لِي وَلأَِخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:جَعَلَ ٱللَّهُ الرحمةَ مائة جُزْءٍ، فَأَمْسَكَ عِنْدَهُ تِسْعَةً وَتِسْعِينَ، وأَنْزَلَ في الأَرْضِ جُزْءًا وَاحِدًا، فَمِنْ ذَلِكَ الجُزْءِ يَتَرَاحَمُ الخَلاَئِقُ، حتى تَرْفَعَ الدَّابَّةُ حَافِرَهَا عَنْ وَلَدِهَا خَشْيَةَ أَنْ تُصِيبَهُ","Дорогие братья и сестры!","Ислам учит людей быть милосердными, сострадательными, приносить пользу и оберегать от вреда, давать утешение людям, потерявшим надежду, радовать их и приносить в их жизнь покой и любовь. Особенно следует быть внимательным к детям, женщинам, сиротам, пожилым людям и к тем, кто находится в нашем подчинении, с добротой относиться к животным.","В Священном Коране много раз говорится, что Господь Прощающий и Милосердный, «Милосерднейший из милосердных»[1], что Его Милосердие объемлет все сущее. Священный Коран и каждая его сура начинаются с «Бисмилляхи-р-Рахмани-р-Рахим» (С Именем Аллаха, Милостивого и Милосердного).","Само существование мироздания и доброе сострадательное отношение созданий друг другу является проявлением божественной милости.","«Аллах разделил милосердие на сто частей, оставив девяносто девять частей у Себя и ниспослав на землю одну часть, благодаря которой милосердие по отношению друг к другу проявляют все создания, (в том числе и) верховые животные, которые поднимают свои копыта (повыше и отводят) их от своих детенышей, опасаясь задеть их».[2]","Пророк Мухаммад (салляллаху алейхи ва саллям) был послан как «милость всем мирам»[3], поэтому Господь Бог проявил в нем Свои прекрасные Имена «ар-Рауф» (Сострадательный) и «Рахим» (Милостивый), чего не удостаивался ни один из предыдущих пророков.[4]","Побуждая свою общину к милосердию, Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Кто милостив, к тому будет милостив Всевышний Аллах, который “ар-Рахман” (Милостивый). Будьте милостивы к тем, кто на земле, и к вам проявят милость те, кто на небесах!»[5]","Анас бин Малик (радыйаллаху анху) рассказывал, что пророк Мухаммад (салляллаху алейхи ва саллям) был очень добрым человеком. Никому, кто обращался к нему с какой-либо просьбой, он не отказывал и всегда старался помочь. Если у него было то, что просили, он сразу отдавал просящему. Однажды, когда уже был прочитан «икамат» к намазу, появился какой-то бедуин, который, схватив Пророка (салляллаху алейхи ва саллям) за одежду, сказал: «У меня возникла небольшая нужда и так как я опасаюсь, что позже могу забыть, решил сейчас же сказать тебе об этом». Посланник Аллаха (салляллаху алейхи ва саллям) не начинал намаз, пока просьба бедуина была не удовлетворена. Затем он вернулся и возглавил намаз».[6]","Дорогие друзья!","Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Кто не проявляет милосердия к младшим и не уважает старших – тот не из нас».[7]","Анас бин Малик (радыйаллаху анху) говорил: «Я не видел человека, более милосердного к детям, чем пророк Мухаммад (салляллаху алейхи ва саллям)!»[8]","Дорогие мусульмане!","Независимо от того, какую религию исповедует человек, доброе и милосердное отношение ко всем людям является обязанностью мусульманина. Поэтому на землях мусульман и к последователям других религиозных конфессий всегда было доброе отношение. В один год курайшиты, которые выступили против Ислама и причинили много мучений Пророку (салляллаху алейхи ва саллям) и мусульманам, сами попали в тяжелое положение. Случилась страшная засуха и неурожай. Курайшиты оказались на грани голодной смерти, будучи вынужденными даже подбирать и есть падаль. Абу Суфьян, глава язычников, пришел к Пророку (салляллаху алейхи ва саллям) и сказал:","«О Мухаммад! Среди принципов, провозглашенных тобой, есть и поддержание родственных связей. Еще немного и племя твое погибнет. Пришло время, помолись Аллаху!»","Как только Пророк (салляллаху алейхи ва саллям) обратился с мольбой к Аллаху, как Господь проявил милость, ниспослав дождь. Семь дней и ночей беспрерывно лил дождь. Теперь люди просили, чтобы дождь прекратился. Пророк (салляллаху алейхи ва саллям) вновь воззвал к Господу: «О Аллах! Сделай так, чтобы дождь шел в окрестностях, а не у нас!» И сразу тучи разошлись, а дождь начался на соседних землях.[9]","При Бадре мусульмане и язычники стояли напротив друг друг, и были готовы начать сражение. Несколько язычников пришли к колодцу, находящемуся на стороне, занятой мусульманами. Когда мусульмане хотели помешать им, Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Не трогайте их! Пусть попьют!»","Язычники попили воды и вернулись в свое войско.[10]","Дорогие друзья!","Доброе отношение к людям означает доброе отношение к себе, так как в результате оно ведет к довольству и милости Аллаха. Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","• Клянусь Аллахом, во власти которого находится моя душа, что пока вы не станете проявлять милосердия друг к другу, вы не попадете в Рай!","Сподвижники ответили (радыйаллаху анхум):","• О Посланник Аллаха! Мы все милосердны!","Пророк (салляллаху алейхи ва саллям) объяснил им:","• Милосердие, которое я имею в виду, это не милосердие, которое вы проявляете по отношению друг к другу. Это милосердие, которое охватывает все творения. Да, милосердие, которое охватывает все творения![11]","Однажды пророк Мухаммад (салляллаху алейхи ва саллям) встретил людей, которые беседовали, сидя на верховых животных. Он сделал им замечание:","«Ездите на своих животных и не загоняйте их. А когда пользуетесь ими, отпускайте и давайте им отдохнуть! Не делайте из них кресла для бесед на улицах и в пути (не беседуйте, сидя на них). Сколько есть ездовых животных, которые лучше тех, кто ездит на них, и они (животные) больше поминают Всевышнего Аллаха».[12]","Дорогие мусульмане!","Милосердие является проявлением любви к Господу и Его творениям, а высшей формой проявления милосердия является призыв к Исламу и Творцу. Призывать людей к добру, обучать их истине, о которой они не ведают, удерживать от совершения зла, исправлять их заблуждения и ошибки, укреплять их духовность, направлять к вере в Аллаха есть величайшее служение, которое только можно совершить для блага людей.","Да поможет нам Аллах быть чуткими, не нарушать ничьих прав и излучать из своих сердец только милосердие и добро на все сущее на Земле! Аминь!"]}]}}},
{"id":24,"collection":"c9","sn":"Дорогие братья и сестры!","tags":[],"footnotes":["Сура ан-Ниса, 4/36.","аль-Бухари 6014, 6015, Муслим 2624, 2625","Ибн Хаджар, Фатхуль-Бари; Даруль-Фикр, Фуат Абдулбаки, X, 456; Суйюти, аль-Джами’ус-сагир, I, 146.","Ахмад, III, 407.","Насаи, Истиаза, 44.","Тирмизи, Зухд, 2/2305; Ибн Маджа, Зухд, 24.","Муслим, Бирр, 143.","Хаким, 2/15; Хайсами, 8/167.","Хаким, 2/526.","Бухари, Адаб, 29; Муслим, Иман,","Байхаки, Шуайб, 7/83; Куртуби, 5/120-123."],"bibliography":[],"versions":{"ru":{"title":"Права соседей","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَاعْبُدُوا ٱللَّهَ وَلاَ تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَى وَالْيَتَامَى وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَى وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ إِنَّ ٱللَّهَ لاَ يُحِبُّ مَن كَانَ مُخْتَالاً فَخُورًا","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:مَا زَالَ جِبْريلُ يُوصِيني بِالجَارِ حَتَّى ظَنَنْتُ أنَّهُ سَيُورِّثُهُ","Дорогие братья и сестры!","Всевышний Создатель повелевает соблюдать права соседей, ибо человек в повседневной жизни постоянно находится ближе к своим соседям, чем к родственникам. В Коране повелевается:","«Поклоняйтесь Аллаху и не приобщайте к Нему сотоварищей. Делайте добро родителям, родственникам, сиротам, беднякам, соседям из числа ваших родственников и соседям, которые не являются вашими родственниками, находящимся рядом спутникам, странникам и невольникам, которыми овладели ваши десницы».[1]","Выражение «делайте добро... ближним соседям» означает хорошо обходиться, помогать и быть снисходительным к недостаткам соседей, которые живут рядом, и к тому же – родственники или мусульмане.","Передают со слов Ибн ‘Умара и ‘Аиши, да будет доволен Аллах ими обоими, что Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Джибрил не прекращал давать мне наставления о необходимости хорошего отношения к соседу (так долго), что я даже подумал, что он включит его и в число наследников»[2].","«Делайте добро... дальним соседям» означает быть дружелюбными и оказывать помощь тем соседям, кто живет на отдалении от вас, или к тем, с которыми вас не связывают родственные узы или которые, не являются верующими.","Посланник Аллаха (салляллаху алейхи ва саллям) подразделил соседей на три категории с учетом их права:","а) Соседи, обладающие одним правом – это немусульмане. У них есть только право соседей.","б) Соседи, обладающие двумя правами – это мусульмане. У них есть права как соседей, так и единоверцев.","в) Соседи, обладающие тремя правами – это мусульмане, являющиеся родственниками. У них есть и права соседей, и права братьев по вере, и права родственников.[3]","Уважаемые друзья!","Стремясь иметь хороших соседей, мы сами, прежде всего, должны стать хорошими соседями, а во-вторых, прилагать усилия, чтобы жить в окружении праведных соседей. Одно из обстоятельств, которое делает мусульманина счастливым в земном мире – это проживание рядом с благочестивым соседом.[4] Поэтому наш Пророк (салляллаху алейхи ва саллям) сказал:","«Просите у Аллаха, чтобы Он уберег вас от соседства со скверным человеком в месте постоянного проживания! Каким бы ни был сосед там, где вы живете временно, с ним вы когда-нибудь расстанетесь».[5]","Народная пословица учит: «Не дом покупай, а соседа выбирай!». Она показывает, насколько важно с духовной точки зрения проживание среди хороших соседей.","Вместе с тем нужно терпеливо переносить и небольшие трудности, причиняемые соседями. Всевышний Аллах любит человека, который терпелив в отношении своего соседа ради довольства Аллаха. Всевышний Аллах охраняет его от вреда соседа. Наш Пророк (салляллаху алейхи ва саллям) сказал:","«…Делай добро соседу, чтобы быть совершенным верующим...»[6].","Абу Зарр (радыйаллаху анху) передал: «Мой друг Посланник Аллаха (салляллаху алейхи ва саллям) давал мне такое наставление:","«Когда варишь суп, наливай побольше воды. Затем мысленно перебери своих соседей и с радостью поделись с теми, кого ты считаешь нужным накормить!»[7].","Исходя из этого хадиса, даже бедность не является уважительной причиной, когда идет речь о соблюдении прав соседей. Человек, находящийся в стесненных материальных условиях, тоже должен поддерживать своего соседа. Посланник Аллаха (салляллаху алейхи ва саллям) сделал следующее предостережение:","«Не из верующих тот, кто ложится спать сытым, в то время как его сосед голоден».[8]","Примером того, как благородные сподвижники, следуя этому хадису, соблюдали права соседей, является рассказ Ибн Умара (радыйаллаху анху):","«Было семь домов, все их обитатели были бедными. Хозяин одного из этих домов отправил соседу в подарок баранью голову. Тот, подумав, что другой сосед больше нуждается в этом, отдал баранью голову ему. А третий сосед с той же мыслью отправил баранью голову следующему соседу. Таким образом, баранья голова обошла все дома и вернулась в тот дом, откуда она была послана изначально».[9]","Мы видим, насколько благородна и высока нравственность, которая создала эту цивилизацию.","Добро и милосердие являются основополагающими принципами Ислама. Так как даже небольшой некрасивый поступок бросает тень на суть Ислама, то о недопустимости чего-либо, порочащего нашу великую религию, был ниспослан ряд серьезных предупреждений.","Уважаемые мусульмане!","Причинение беспокойства соседям свидетельствует о слабости веры. Соседи не должны причинять друг другу зло. Сообщается со слов Абу Хурейры (радыйаллаху анху), что наш Пророк (салляллаху алейхи ва саллям) сказал:","«Не уверовал, клянусь Аллахом. Не уверовал, клянусь Аллахом. Не уверовал, клянусь Аллахом».","Сподвижники спросили:","«Кто, о Посланник Аллаха?»","«Тот человек, чей сосед не находится в безопасности от него!»[10]","Наш Пророк (салляллаху алейхи ва саллям) так сформулировал права соседей:","«Если кто-то вынужден запирать дверь из-за опасения, что сосед может причинить его семье и его имуществу вред, то сосед не является действительно уверовавшим. Так и сосед, от которого можно ожидать любой неприятности, не является действительно уверовавшим.","Знаете ли вы, какие права имеют соседи? Нужно помогать им, когда они обращаются за помощью; давать им в долг, когда они просят; помогать им в случае нужды; посещать их, когда они болеют; поздравлять их, когда в их жизни случается хорошее; утешать их, когда их постигает несчастье; участвовать в их похоронах, когда они умирают. Чтобы не заслонять приток свежего воздуха, нельзя без разрешения соседа строить дом выше его дома. Чтобы запах (готовящейся) пищи не доставлял неудобства соседу, угости и его, даже если у тебя мало. Если покупаешь фрукты, угости и его. Если не можешь этого сделать, то заноси домой фрукты так, чтобы не было видно. Пусть твои дети, не выходят с фруктами на улицу, дабы не вызывать зависть соседских детей».[11]","О Аллах, сделай нас из тех, кто самым лучшим образом соблюдает права соседей, не причиняет им вреда ни действием, ни словом, проявляет внимательность и чуткость к их заботам и нуждам! Помоги нам стать совершенными верующими, делая добро нашим соседям ради Твоего довольства! Аминь!"]}]}}},
{"id":25,"collection":"c1","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Муслим, 2701."],"bibliography":[],"versions":{"ru":{"title":"Зикр – эталон веры","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَمَنْ اَعْرَضَ عَنْ ذِكْر۪ي فَاِنَّ لَهُ مَع۪يشَةً ضَنْكًا وَنَحْشُرُهُ يَوْمَ الْقِيٰمَةِ اَعْمٰى","@ar:قَالَ رَبِّ لِمَ حَشَرْتَن۪ٓي اَعْمٰى وَقَدْ كُنْتُ بَص۪يرًا","@ar:قَالَ كَذٰلِكَ اَتَتْكَ اٰيَاتُنَا فَنَس۪يتَهَاۚ وَكَذٰلِكَ الْيَوْمَ تُنْسٰى","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:وَإِنَّ رَسُولَ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ خَرَجَ عَلَى حَلْقَةٍ مِنْ أَصْحَابِهِ، فَقَالَ: «مَا أَجْلَسَكُمْ؟» قَالُوا: جَلَسْنَا نَذْكُرُ ٱللَّهَ وَنَحْمَدُهُ عَلَى مَا هَدَانَا لِلِْسْلاَمِ، وَمَنَّ بِهِ عَلَيْنَا، قَالَ: «آللَِّ مَا أَجْلَسَكُمْ إِلاَّ ذَاكَ؟» قَالُوا: وَاللَِّ مَا أَجْلَسَنَا إِلاَّ ذَاكَ، قَالَ: «أَمَا إِنِّي لَمْ أَسْتَحْلِفْكُمْ تُهْمَةً لَكُمْ، وَلَكِنَّهُ أَتَانِي جِبْرِيلُ فَأَخْبَرَنِي، أَنَّ ٱللَّهَ عَزَّ وَجَلَّ يُبَاهِي بِكُمُ الْمَلاَئِكَةَ»","Уважаемые братья и сестры!","Всевышний Аллах Субханаху ва Та’аля (Преславен Он и Возвышен) предупреждает нас прочитанным аятом:","«А тому, кто не будет помнить обо Мне (совершать зикр), воистину предстоит провести жизнь в тяготах. И Мы воскресим его в день воскрешения слепым. И он воскликнет: «Госпо-»?ди, почему Ты воскресил меня слепым, ведь я был зрячим Аллах скажет: «Подобно тому, как ты забыл Мои знамения, которые явились перед тобой, ты тоже будешь предан забвению сегодня» (Сура «Та-Ха», аяты 124-126).","Из приведенного аята видно, как сурово Аллах отнесется к тем, кто не постигает Его Величия и не поминает Его, неблагодарно забывая о своем Творце. Пророк Мухаммад (салляллаху алейхи ва саллям) сказал, что между тем, кто поминает Аллаха, и тем, кто не поминает Его, разница как между живым и мертвым.","В хадисе, озвученном в начале хутбы, говорится: «Муавия (радыйаллаху анху) передал, что Посланник Аллаха (салляллаху алейхи ва саллям) однажды подошел к группе сподвижников и спросил: «Что заставило вас собраться здесь?» Они ответили: «Мы собрались здесь поминать Всевышнего Аллаха и восхвалить Его за то, что Он наставил нас на путь Ислама и даровал его нам». Он снова спросил: «Вы клянетесь Аллахом, что вы здесь только для этого?». Они ответили: «Клянемся Аллахом! Это единственная причина нашего собрания». Он сказал: «Я попросил вас поклясться не потому, что не верил вам, а потому, что Джибраил пришел ко мне и сообщил, что Всевышний Аллах гордится вами перед ангелами»[1].","Дорогие братья и сестры!","Зикр – это самый великий дар Всевышнего Аллаха cвоим любимым рабам. Невозможно представить что-либо величественнее. Зикр – это важный критерий веры и любви. Любящий постоянно помнит о своем любимом: днем и ночью, каждый час, каждый миг, никогда не забывая о нем. Все, кто любят, находятся в таком состоянии.","Если в сердце войдет любовь к Аллаху, то из него исчезает все, кроме Его поминания, даже предшествующая любовь к кому-либо. Можно ли будучи рабом Аллаха, забыть Его хотя бы на мгновение, не восхвалять Его всей душой, не благодарить Его за все неисчислимые блага, дарованные Им - Истинным Дарителем благ – ар-Раззаком?!","Человек обязан постоянно помнить своего Господа. Он должен оценивать свое состояние по тому, насколько его язык и сердце находятся в поминании Аллаха (зикре).","Братья и сестры!","Человек – это почетное создание Аллаха. Какое же достоинство делает его таковым? Аллах возвысил человека тем, что наделил его духом (человеческой душой) и интеллектом и сделал наместником на Земле (халифом). За это верующий должен постоянно восхвалять и благодарить Аллаха, и проявляя почтение, достойное Его Величия, добросовестно исполнять свои обязанности.","Нужно стараться ни на миг не оставлять зикр. Нужно стремиться ко всему, что способствует зикру и отстранять от себя все, что препятствует ему. Кто достиг степени «зикруллах» – постоянного зикра, тот достиг милости Аллаха. Постоянно поминающий Аллаха обретает крепкую веру и любовь к Своему Господу. Когда человек пребывает в состоянии постоянного зикра, перед ним открываются духовные пути, с которых устраняются все преграды. Зикруллах – это сияние сердца, покой души, ясность ума, красивая нравственность.","Совершающий зикр не поддается унынию, никакая беда не может сломить его. Он не проводит много времени с людьми, занятыми только мирской суетой, потому что нахождение с беспечными вредит сердцу.","В Священном Коране о зикре говорится:","@ar:فَاذْكُرُون۪ٓي اَذْكُرْكُمْ وَاشْكُرُوا ل۪ي وَلاَ تَكْفُرُونِ۟","«Помните обо Мне, и Я буду помнить о вас. Будьте благодарны Мне и не впадайте в неверие». (Сура «аль-Бакара», 2/152)","@ar:وَاذْكُرْ رَبَّكَ كَث۪يرًا وَسَبِّحْ بِالْعَشِيِّ وَالاِْبْكَارِ۟","«Поминай своего Господа усердно, славь Его и вечером, и утром». (Сура «Алю Имран», 3/41)","Пророк Мухаммад (салляллаху алейхи ва саллям) говорил:","«Аллах любит того, кто любит восхвалять Его»;","«Шайтан уходит из сердец тех, кто восхваляет Аллаха, и заходит в сердца тех, кто не восхваляет Его»;","«Нет поклонения величественней восхваления Аллаха»;","«С сердца повторяющего «Ля иляха илляллах» (Нет Бога кроме Аллаха) снимается завеса».","Пророк Мухаммад (салляллаху алейхи ва саллям) как-то обратился к своим сподвижникам: «О моя община! Сказать ли вам о том, что лучше ваших благих дел и чище деяний, совершаемых ради Аллаха? О том, что увеличивает вашу степень, о том, что лучше вашей битвы с врагами, когда вы убиваете их и погибаете сами?» Сподвижники спросили: «Что же это такое, о Посланник Аллаха?» Пророк Мухаммад (салляллаху алейхи ва саллям) ответил: «Это постоянное совершение зикра Аллаху».","Уважаемые братья и сестры!","Аллах помогает Своему рабу стать любимым. Как добиться этого, Он объясняет в Священном Коране. Каждому человеку приятно знать, что его кто-то любит. Он будет стараться, чтобы понравиться и заслужить любовь. Так и перед Аллахом. Его любовь важнее всего на свете. Чтобы добиться ее, нужно встать на путь воспитания души и совершать зикр. Для совершения зикра не нужны капитал и богатство. Нужны лишь язык и искреннее сердце, наполненное любовью и покорностью Аллаху.","В Судный день человек будет давать отчет о прожитой жизни, и в этом будут участвовать все органы его тела: сердце, язык, руки, ноги и т.д. Они будут свидетельствовать о том, чем они занимались в земной жизни.","Если человек много размышляет и говорит об Аллахе, совершает зикр и восхваляет Его, то в Судный день его органы будут свидетельствовать об этом: «Аллах, Аллах, Аллах…Астагфируллах…», ибо им будет дана способность говорить. Даже если в Судный день человек от страха забудет все, его сердце скажет: «Аллах, Аллах…» И руки, и язык, и глаза, и ноги его будут указывать на то, что он, находясь в бренном мире, восхвалял своего Господа.","Да удостоит нас Всевышний Господь способности восхвалять, благодарить, поминать Его и быть довольными Им, и да сохранит Он эти чувства в нас до конца нашей жизни! Аминь!"]}]}}},
{"id":26,"collection":"c2","sn":"Уважаемые мусульмане!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Тауба","sections":[{"h":"","p":["@ar:أَعُوذُ بِاللَِّ مِنَ الشَّيْطَانِ الرَّجِيمِ","@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى ٱللَّهِ تَوْبَةً نَصُوحًا عَسَى رَبُّكُمْ أَنْ يُكَفِّرَ عَنْكُمْ سَيِّئَاتِكُمْ وَيُدْخِلَكُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الأَْنْهَارُ يَوْمَ لاَ يُخْزِي ٱللَّهُ النَّبِيَّ وَالَّذِينَ آمَنُوا مَعَهُ نُورُهُمْ يَسْعَى بَيْنَ أَيْدِيهِمْ وَبِأَيْمَانِهِمْ يَقُولُونَ رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","@ar:صَدَقَ ٱللَّهُ الْعَظِيمُ","@ar:وَبَلَّغَنَا رَسُولُهُ الْكَرِيمُ صَلَّى ٱللَّهُ عَلَيهِ وَسَلَّمَ، فَقَالَ:","@ar:«وَاللَِّ إنِّي أَسْتَغْفِرُ ٱللَّهَ وَأَتُوبُ إِلَيْهِ في الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً».","Уважаемые мусульмане!","Сегодня мы поговорим о покаянии – о «тауба». Всевышний Аллах создал человека в чистом состоянии естества (фитре). Говорится в Священном Коране:","@ar:صَدَقَ رَسُولُ ٱللَّهِ فِي مَا قَالَ أَو كَمَا قَالَ.","@ar:وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَى كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلاً","«Мы почтили сынов Адама и позволяем им передвигаться по суше и морю. Мы наделили их благами и даровали им явное превосходство над многими другими созданиями». (аль-Исра,70)","@ar:لَقَدْ خَلَقْنَا الإِْنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ","«Мы сотворили человека в прекраснейшем облике» (ат- Тин, 4). Но, к сожалению, нам, людям не всегда удается сохранить свою природную чистоту, будучи подверженными влиянию окружения и следуя наущениям нафса.","По этой причине душа, находящаяся в нашем теле, к сожалению, грубеет и чернеет.","@ar:كَلاَّ بَلْ رَانَ عَلَى قُلُوبِهِمْ مَا كَانُوا يَكْسِبُونَ","«Но нет! Напротив, их сердца покрылись ржавчиной за то, что они приобрели (по причине плохих деяний)» (аль-Мутаффифин, 14)” (Тирмизи, Тафсир, 83/3334)","Наш Пророк (салляллаху алейхи ва саллям) говорил:","«Если раб Аллаха совершает грех, то на его сердце появляется черное пятно, и если он перестает грешить, просит прощения и раскаивается, то сердце очищается. Если же он не сделает так и вернется к греху, то черные пятна увеличатся и в итоге окутают все сердце». (ат-Тирмизи, ан-Насаи, Ибн Маджа)","В суре «аль-Бакара» это грубое состояние сердец описано так: «…После этого ваши сердца ожесточились и стали, как камни, или даже еще жестче…» (аль-Бакара, 74)","@ar:ثُمَّ قَسَتْ قُلُوبُكُمْ مِنْ بَعْدِ ذَلِكَ فَهِيَ كَالْحِجَارَةِ أَوْ أَشَدُّ قَسْوَةً وَإِنَّ مِنَ الْحِجَارَةِ لَمَا يَتَفَجَّرُ مِنْهُ الأَْنْهَارُ وَإِنَّ مِنْهَا لَمَا يَشَّقَّقُ فَيَخْرُجُ مِنْهُ الْمَاءُ وَإِنَّ مِنْهَا لَمَا يَهْبِطُ مِنْ خَشْيَةِ ٱللَّهِ وَمَا ٱللَّهُ بِغَافِلٍ عَمَّا تَعْمَلُونَ","Огрубевшие сердца становятся запечатанными и глухими к истине. Об этом говорится в Коране:","@ar:إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لاَ يُؤْمِنُونَ * خَتَمَ ٱللَّهُ عَلَى قُلُوبِهِمْ وَعَلَى سَمْعِهِمْ وَعَلَى أَبْصَارِهِمْ غِشَاوَةٌ وَلَهُمْ عَذَابٌ عَظِيمٌ","«Воистину, неверующим безразлично, предостерег ты их или не предостерег. Они все равно не уверуют. Аллах запечатал их сердца и слух, а на глазах у них – покрывало. Им уготованы великие мучения». (аль-Бакара, 6-7)","Грешные сердца, которые заржавели из-за отрицания Аллаха, Его знамений и повелений обделены такими возвышенными проявлениями, как поминание Господа, любовь к Нему, страх перед Ним и избегание запретного.","Всевышний Аллах вложил в человеческое сердце способность находиться в состоянии поминания Аллаха. Об этом сказано в Коране:","«…У тех, кто страшится своего Господа, от него (слушания Корана) по коже проходит дрожь. А потом их кожа и сердца смягчаются при поминании Аллаха». (сура «аз-Зумар», 23)","@ar:تَقْشَعِرُّ مِنْهُ جُلُودُ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ ثُمَّ تَلِينُ جُلُودُهُمْ وَقُلُوبُهُمْ إِلَى ذِكْرِ ٱللَّهِ","Уважаемые мусульмане!","Мы говорим о сердце, поскольку суть «тауба» (мольбы о прощении) в раскаянии, а место, где возникает раскаяние – это сердце.","Ученые фикха дают такое определение «тауба»: это оставление греховного поступка по причине его отвратительности, сожаление о содеянном, решимость больше не возвращаться к подобному, а если совершенный грех относится к несправедливости и нарушению чужих прав, то – восстановление нарушенных прав, извинение или просьба о прощении к тому, чьи права были нарушены.","Чтобы покаяние было действительным, нужно выполнить все эти действия, стремясь только к довольству Аллаха. В противном случае оставление греха не будет считаться покаянием, например, если человек перестал разбазаривать деньги или пьянствовать только из-за опасения за имущество, здоровье или из-за желания избавиться от порицания людей.","Исправление греха, совершенного против Аллаха в беспечности или под влиянием страстей, также заключается в обращении к Нему с искренним покаянием. Раскаяние в грехе сразу после его совершения, пока ржавчина этого греха не въелась в сердце, способствует его исправлению. Всевышний Аллах повелевает:","@ar:وَإِمَّا يَنْزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَِّ إِنَّهُ سَمِيعٌ عَلِيمٌ","«А если тебя коснется наваждение от дьявола, то прибегай к защите Аллаха». (Фуссылят, 36)","Что нужно делать, если мы совершили грех? В хадисе, переданном благородным Абу Бакром (радыйаллаху анху), говорится:","«Я слышал, как Посланник Аллаха (салляллаху алейхи ва саллям) говорил:","«Если раб, совершив какой-либо грех, встанет, сделает омовение, прочитает два раката намаза и попросит прощения у Аллаха, то Всевышний обязательно простит его».","После этого Пророк (салляллаху алейхи ва саллям) прочитал этот аят:","@ar:وَالَّذِينَ إِذَا فَعَلُوا فَاحِشَةً أَوْ ظَلَمُوا أَنْفُسَهُمْ ذَكَرُوا ٱللَّهَ فَاسْتَغْفَرُوا لِذُنُوبِهِمْ وَمَنْ يَغْفِرُ الذُّنُوبَ إِلاَّ ٱللَّهُ وَلَمْ يُصِرُّوا عَلَى مَا فَعَلُوا وَهُمْ يَعْلَمُونَ","«Те же (верующие), которые, совершив мерзкий поступок или несправедливо поступив против самих себя, помянули Аллаха и попросили прощения за свои грехи, – ведь кто прощает грехи, кроме Аллаха? – и те, которые сознательно не упорствуют в том, что они совершили». (Али Имран, 135)» (Абу Дауд, Витр, 26/1521; Тирмизи, Салят, 181/406; Тафсир, 3/3006; Ахмад, I, 2)","Гордость Вселенной, наш Пророк (салляллаху алейхи ва саллям) оставил нам наставления и показал лучший пример того, как совершать «тауба» (покаяние) и «истигфар» (просить о прощении):","«Иногда мое сердце покрывает пелена. Поэтому я сто раз в день прощу прощения у Аллаха». (Муслим, Зикр, 2702-42)","Пелена, которая покрывала сердце Посланника Аллаха (салляллаху алейхи ва саллям), свидетельствовала о том высоком уровне, который он занимает. Он находился в постоянной глубокой связи с Всевышним Аллахом. Несмотря на то, что ему были прощены все его прошлые и будущие грехи, он оставался благодарным рабом Аллаха и постоянно каялся за свои прошлые состояния.","Кающийся человек, взывая к Аллаху о прощении, должен отстраниться и душой, и телом от грехов и не упорствовать в их совершении. В аяте, прочитанном в начале хутбы, наш Господь, обладатель Величия, повелевает:","@ar:يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى ٱللَّهِ تَوْبَةً نَصُوحًا عَسَى رَبُّكُمْ أَنْ يُكَفِّرَ عَنْكُمْ سَيِّئَاتِكُمْ وَيُدْخِلَكُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الأَْنْهَارُ","«О те, которые уверовали! Раскаивайтесь перед Аллахом искренне! Может быть, ваш Господь простит ваши злодеяния и введет вас в Райские сады, в которых текут реки...» (ат-Тахрим, 8)","Уважаемые верующие!","Мы должны знать ценность нашей веры. Понимаем ли мы, насколько величественен и прекрасен наш Господь? Он обещает, что простит и полюбит нас, если мы признаем свои грехи и покаемся в них:","@ar:إِنَّ ٱللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ","«Поистине, Аллах любит тех, которые обращаются к Нему с раскаянием, и тех, которые содержат себя в чистоте». (аль-Бакара, 222) Таким образом, Господь удостоил похвалы верующих, очищающихся духовно посредством «тауба» и следящих за чистотой своего тела.","Более того, Его очень радует покаяние верующего. Пророк (салляллаху алейхи ва саллям) объяснял это на таком примере:","@ar:«لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ حِينَ يَتُوبُ إِلَيْهِ، مِنْ أَحَدِكُمْ كَانَ عَلَى رَاحِلَتِهِ بِأَرْضِ فَلاَةٍ، فَانْفَلَتَتْ مِنْهُ وَعَلَيْهَا طَعَامُهُ وَشَرَابُهُ، فَأَيِسَ مِنْهَا، فَأَتَى شَجَرَةً، فَاضْطَجَعَ فِي ظِلِّهَا، قَدْ أَيِسَ مِنْ رَاحِلَتِهِ، فَبَيْنَا هُوَ كَذَلِكَ إِذَا هُوَ بِهَا قَائِمَةً عِنْدَهُ، فَأَخَذَ بِخِطَامِهَا، ثُمَّ قَالَ مِنْ شِدَّةِ الْفَرَحِ: (اللَّهُمَّ أَنْتَ عَبْدِي وَأَنَا رَبُّكَ)، أَخْطَأَ مِنْ شِدَّةِ الْفَرَحِ»","Абдуллах ибн Мас’уд (радыйаллаху анху) рассказывал: «Я слышал, как Посланник Аллаха (салляллаху алейхи ва саллям) говорил: «Поистине, Аллах радуется покаянию Своего раба, который обращается к Нему с покаянием, больше, чем тот из вас, кто (ехал) по пустыне, где нет растительности и подстерегает много опасностей, на своей верблюдице, на которую были нагружены все его съестные припасы и вода. Через некоторое время он прилег, чтобы поспать. Когда он проснулся, то увидел, что животное убежало от него вместе со всеми припасами. Он искал его везде, но не смог найти. В итоге, измученный голодом, жаждой и усталостью, он решил: “Вернусь в то место, где потерялось мое животное и буду спать, пока не умру”. Придя туда, он лег, подложив под голову руку, с желанием заснуть и умереть. Он уснул на какое-то время, а когда проснулся, увидел, что его верблюдица стоит рядом с ним вместе с его провизией и водой. И тогда он сказал (по ошибке) из-за (охватившей его) радости: «О Аллах, Ты – раб мой, а я – Твой Господь!» Радость Аллаха от покаяния Его раба еще больше, чем радость этого человека, который нашел потерявшееся животное вместе с провизией». (Бухари, Да’ват 4; Муслим, Китабу’т-Тауба (2747); Тирмизи, Кыямат 50, (2499, 2500)","Дорогие братья и сестры!","«Тауба» совершается после неверия или после совершения греха. «Тауба» раскаявшегося после неверия обязательно принимается. «Тауба» раскаявшегося после совершения греха тоже принимается, если сделана искренне. Искреннее покаяние состоит в том, чтобы верующий избавился от вреда совершенного греха. Если человек не вернется вновь к своему греху, то будет считаться, словно он не совершал его.","Не обязательно совершать грех, чтобы сделать «тауба» и «истигфар». Человеку, который хочет совершить дуа, необходимо начать ее с «тауба» и «истигфар», чтобы очиститься. Поскольку мольбы тех, кто чист, быстрее принимаются.","Как нам понять, искренни ли мы в своих покаяниях? Если после самоотчета и покаяния оставить все плохие поступки, то это значит, что мы на правильном пути. Также если мы стремимся совершать благие дела, противоположные этим плохим поступкам, и украшать себя прекрасными качествами, значит дела стали исправляться. Например, если мы больны высокомерием и гордыней, то должны стремиться к смирению и покорности, если нас сжигает ненависть и зависть, то мы должны видеть своих братьев выше себя и, прежде всего, видеть свои недостатки и стараться исправлять их. Верующий является зеркалом верующего, если смотреть в это зеркало с негативом, то будешь видеть плохое, а если – с добром, то будешь видеть хорошее.","Самое первое покаяние за совершенную ошибку было сделано нашими прародителями пророком Адамом и его супругой Хаввой (алейхумассалям):","@ar:قَالاَ رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ","Они сказали: «Господь наш! Мы поступили несправедливо по отношению к себе, и если Ты не простишь нас и не смилостивишься над нами, то мы непременно окажемся одними из потерпевших урон». (аль-А’раф, 23).","Эта мольба стала примером обращения к Творцу для всех поколений верующих вплоть до Судного дня.","Уважаемые братья!","Я хочу завершить свою проповедь благой вестью от нашего Пророка (салляллаху алейхи ва саллям):","@ar:عَنْ أَبِي عُبَيْدَةَ بْنِ عَبْدِ اللَِّ، عَنْ أَبِيهِ، قَالَ: قَالَ رَسُولُ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ: «التَّائِبُ مِنَ الذَّنْبِ، كَمَنْ لاَ ذَنْبَ لَهُ».","«Кающийся в своих грехах подобен тому, кто не совершал этот грех!» (Ибн Маджа, Зухд, 4250)","@ar:أَلاَ إِنَ أَحْسَنَ الْكَلاَمِ وَأَبْلَغَ النِّظَامَ كَلاَمُ ٱللَّهِ المَلِكِ الْعَزِيزِ الْعَلاَّمِ"]}]}}},
{"id":27,"collection":"c2","sn":"Уважаемые верующие!","tags":[],"footnotes":[],"bibliography":[],"versions":{"ru":{"title":"Истигфар","sections":[{"h":"","p":["@ar:أَعُوذُ بِاللَِّ مِنَ الشَّيْطَانِ الرَّجِيمِ","@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:كَانُوا قَلِيلاً مِنَ اللَّيْلِ مَا يَهْجَعُونَ * وَبِالأَْسْحَارِ هُمْ يَسْتَغْفِرُونَ","@ar:صَدَقَ ٱللَّهُ الْعَظِيمُ","@ar:وَبَلَّغَنَا رَسُولُهُ الْكَرِيمُ صَلَّى ٱللَّهُ عَلَيهِ وَسَلَّمَ، فَقَالَ:","@ar:«وَاللَِّ إِنِّي لأََسْتَغْفِرُ ٱللَّهَ وَأَتُوبُ إِلَيْهِ فِي اليَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً»","@ar:صَدَقَ رَسُولُ ٱللَّهِ فِي مَا قَالَ أَو كَمَا قَالَ.","Уважаемые верующие!","Сегодня мы будем говорить об «истигфар» – мольбе о прощении грехов.","«Истигфар» начинается с «тауба», то есть с сожаления о греховном поступке, совершенном рабом в забвении Аллаха или из-за беспечности по отношению к Нему. Это сожаление означает осознание неправильности этого пути, раскаяние в сердце, обращенное к Господу, и твердое решение не возвращаться к подобному.","«Истигфар» – это мольбы о прощении, исходящие из сердца. Сразу после совершения греха, пока его ржавчина не въелась в наше сердце, мы должны обратиться с мольбой к Аллаху о прощении наших ошибок и грехов.","Здесь очень важна искренность. «Истигфар» – это не только слова, а состояние души. Произнося «Астагфируллах», то есть «прошу прощения у Аллаха», следует вкладывать глубокий смысл в эти слова, находясь в состоянии сожаления и раскаяния за свое положение.","Праведная Рабиату’ль-Адавийя говорила об «истигфаре», который произносится языком, но о котором сердце ничего не знает:","«Наш истигфар нуждается в еще большем истигфаре».","«Истигфар» занимает важное место в очищении души. Искренняя мольба о прощении спасает человека от скверны греха, которая загрязняет его сердце.","Посланник Аллаха (салляллаху алейхи ва саллям) оставил ясное наставление, относящееся к очищению потемневшего от грехов сердца посредством «истигфар»:","«Если раб Аллаха совершает грех, то на его сердце появляется черное пятно, и если он перестает грешить, просит прощения и раскаивается, то сердце очищается. Если же он не сделает так и вернется к греху, то черные пятна увеличатся и в итоге окутают все сердце». (ат-Тирмизи, ан-Насаи, Ибн Маджа)","Поскольку грехи делают сердце духовно слепым и глухим, то, чтобы вернуть ему чуткость и восприимчивость к истине, следует обратиться к искренним молитвам и «истигфар». Исходя из этого, наш Господь повелевает нам еще до утреннего намаза, в предрассветное время, начиная свой день, совершать «истигфар». Чтобы посредством мольбы о прощении удалить, словно фильтром, скверну, осевшую в сосуде нашей души в течение дня, ведь «устранение вредного важнее приобретения полезного». То есть, устранение зла имеет приоритетное значение по сравнению с привлечением благого и должно осуществляться в первую очередь.","Начиная с пророков, все праведники взывали к Всевышнему Аллаху, прося о прощении, и в бедности, и в достатке, и в горе, и в радости. Поскольку даже у пророков были «залля» – ошибки, то невозможно представить ни одного раба, который бы не нуждался в дуа и «истигфар».","@ar:عَنْ أَبِي هُرَيْرَةَ قَالَ: سَمِعْتُ رَسُولَ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ يَقُولُ: «وَاللَِّ إِنِّي لأََسْتَغْفِرُ ٱللَّهَ وَأَتُوبُ إِلَيْهِ فِي اليَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً».","«Клянусь Аллахом, несомненно, я прощу прощения у Аллаха и каюсь перед Ним более семидесяти раз в день». (Бухари, Даават, 3)","Даже Пророк (салляллаху алейхи ва саллям), о котором в суре «аль-Фатх» было сказано, что ему прощены все прошлые и будущие грехи, и чье сердце было безбрежным океан милости ко всем созданным, осознавая, что он не может быть в полной мере благодарным Всевышнему Аллаху, трепетал от чувства слабости и ничтожности перед Всевышним Творцом. По этой причине он всегда видел свои деяния недостаточными и все больше и больше увеличивал свои поклонения. Каждый раз, считая свои деяния недостаточными перед Величием своего Господа, он совершал «тауба» и «истигфар».","«Иногда мое сердце покрывает пелена. Поэтому я в день сто раз прощу прощения у Аллаха». (Муслим, Зикр, 41; Абу Дауд, Витр, 26)","Конечно, «тауба» и «истигфар» нашего Пророка (салляллаху алейхи ва саллям) совершались не по причине ошибок и недостатков, а, с одной стороны, были выражением переживаний о недостаточной благодарности Господу, с другой стороны, исходили от желания достичь довольства Аллаха и еще больше приблизиться к Нему. Ведь наш Пророк (салляллаху алейхи ва саллям), будучи в постоянном духовном продвижении, совершал «истигфар» за свои предыдущие состояния. Это было отражением его духовного состояния. Возможно также, что Пророк (салляллаху алейхи ва саллям), посланный милостью для всех миров, таким образом желал обучить нас истинному покаянию, которое поддерживает живую связь раба с Аллахом и является средством приближения к Господу.","Уважаемые братья!","Всевышний Аллах установил для человека границы и повелел соблюдать их.","Но человек имеет внутреннюю тягу к нарушению этих границ, подчинившись нафсу. И тогда он вспоминает Господа и говорит: «Что же я сделал?»","Мы должны воспитать в себе чувствительность к греху. Безгрешность – это состояние, которое трудно представить. Однако не устремляться к греху – это обязанность человека в его отношениях с Аллахом.","Нам следует научиться не искать оправдания своим грехам, не считать их незначительными. Мы не должны привыкать к своим грехам и не должны забывать установленных границ и Того, кто установил эти границы. Мы не должны устанавливать свои правила вместо имеющихся и быть беспечными к повелениям, касающимся нас. Если мы нарушили права Аллаха в отношении нас, Его рабов, то надо постараться восстановить эти права посредством совершения «тауба» и «истигфар», которые являются первым шагом на пути приближения к Аллаху.","Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Тому, кто постоянно будет произносить «истигфар», Всевышний Аллах покажет выход из любой тяготы и путь освобождения от всякой печали, и наделит его уделом оттуда, откуда он и не представлял». (Абу Дауд, Витр, 26/1518; Ибн Маджа, Адаб, 57. Также см. Ахмад, I, 248; Хаким, IV, 291/7677)","«Всевышний Аллах ниспослал мне две гарантии (защиты) от адского огня для моей общины. Первая из них:","«Аллах не стал подвергать их мучениям, пока ты находился среди них.","@ar:وَمَا كَانَ ٱللَّهُ لِيُعَذِّبَهُمْ وَأَنْتَ فِيهِمْ","Аллах не стал подвергать их мучениям, пока они молили о прощении». (аль-Анфаль, 33)","@ar:وَمَا كَانَ ٱللَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ","Когда я покину вас, то вам останется гарантией (от гнева Аллаха) мольба о прощении (истигфар) до (самого) Судного дня». (Тирмизи, Тафсир, 8/3082)","Это значит, что пока в обществе есть праведные люди, кающиеся и просящие о прощении, Всевышний Аллах не будет ниспосылать страшные наказания на это общество.","Уважаемые верующие!","Самая лучшая дуа покаяния, которую передал нам наш Пророк (салляллаху алейхи ва саллям), называется «Саййиду-ль-истигфар»:","«Самая превосходная мольба о прощении, когда раб говорит:","@ar:«اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ».","«О Аллах, Ты мой Господь, нет бога, кроме Тебя, достойного поклонения. Ты создал меня и я – Твой раб, и я буду верен обещанию и договору с Тобой, пока у меня хватит сил. Прибегаю к Твоей защите от зла того, что я сделал, признаю милость, оказанную мне Тобой, и признаю грех свой, прости же меня, ибо, поистине, никто не прощает грехов, кроме Тебя!»","В продолжение своих слов Посланник Аллаха (салляллаху алейхи ва саллям) сказал: «Тот, кто произнесет эти слова днем, с убежденностью в том, что он говорит, и умрет в тот же день до наступления вечера, то окажется среди обитателей Рая, а тот, кто произнесет эти слова ночью, с убежденностью в том, что он говорит, и умрет в ту же ночь до наступления утра, окажется среди обитателей Рая». (Бухари, Даават, 2, 16; Абу Дауд, Адаб, 100-101)","Несомненно, эта дуа о прощении грехов отражает искреннее обращение раба к своему Господу и обладает той красотой и совершенством, чтобы называться «саййиду-ль-истигфар» (господин мольбы о прощении). Благая весть о Рае, завершающая хадис, вносит в души, задыхающиеся под грузом грехов, свежесть надежды, словно дуновение предрассветного ветерка.","Верующий так же, как просит для себя, может просить прощения за родителей, родственников и других верующих, как живых, так и умерших. В Священном Коране говорится:","@ar:رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ","«Господь наш! Прости меня, моих родителей и верующих в тот день, когда будет представлен счет!» (Ибрахим, 41) Эта молитва пророка Ибрахима (алейхиссалям) является прекрасным примером для нас.","Дуа и «истигфар» являются одним из главных средств очищения сердца. Этот священный аят указывает на важность дуа в очищении сердца от духовной скверны:","«А те, которые пришли после них (мухаджиров и ансаров), говорят: “Господь наш! Прости нас и наших братьев, которые уверовали раньше нас! Не насаждай в наших сердцах ненависти и зависти к тем, кто уверовал. Господь наш! Поистине, Твое милосердие и Твоя милость безграничны”». (аль-Хашр, 10)","@ar:تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ","«Они отрывают свои бока от постелей (чтобы совершать намаз и истигфар), взывая к своему Господу со страхом и надеждой, и расходуют из того, чем Мы их наделили. Ни один человек не знает, какие услады для глаз сокрыты для них в воздаяние за то, что они совершали!» (ас-Саджда, 16-17)","Время для «истигфар»","В аятах, прочитанных в начале хутбы, указывается, в какое время лучше совершать «истигфар»:","@ar:كَانُوا قَلِيلاً مِنَ اللَّيْلِ مَا يَهْجَعُونَ * وَبِالأَْسْحَارِ هُمْ يَسْتَغْفِرُونَ","«Они спали лишь малую часть ночи, а перед рассветом они молили о прощении». (аз-Зарийят, 17-18)","В следующих двух аятах перечисляются качества истинно верующих:","@ar:الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ * الصَّابِرِينَ وَالصَّادِقِينَ وَالْقَانِتِينَ وَالْمُنْفِقِينَ وَالْمُسْتَغْفِرِينَ بِالأَْسْحَارِ","«…которые говорят: “Господь наш! Воистину, мы уверовали. Прости же нам наши грехи и защити нас от мучений в Огне”. Они терпеливы, правдивы, смиренны, делают пожертвования и просят прощения перед рассветом». (Алю Имран, 16-17)","Из аята следует, что «истигфар» имеет смысл продолжительного действия, то есть это означает постоянное качество мусульман. Значит, необходимо сделать «истигфар» ежедневным занятием.","Так же как после времени сухура приходит рассвет и рассеивается тьма, так и «истигфар» в предрассветное время очищает сердце от тьмы грехов, окружая атмосферой милости и прощения.","Посланник Аллаха (салляллаху алейхи ва саллям), раскрывая суть этих аятов, сообщает благую весть тем, кто познал ценность предрассветного времени и воспользовался им:","@ar:عَنْ أَبِي هُرَيْرَةَ رَضِيَ ٱللَّهُ عَنْهُ: أَنَّ رَسُولَ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: «يَنْزِلُ رَبُّنَا تَبَارَكَ وَتَعَالَى كُلَّ لَيْلَةٍ إِلَى السَّمَاءِ الدُّنْيَا حِينَ يَبْقَى ثُلُثُ اللَّيْلِ الآخِرُ يَقُولُ: مَنْ يَدْعُونِي، فَأَسْتَجِيبَ لَهُ مَنْ يَسْأَلُنِي فَأُعْطِيَهُ، مَنْ يَسْتَغْفِرُنِي فَأَغْفِرَ لَهُ».","«Наш Господь (приказывает ангелам) спускаться на нижнее небо каждую ночь, в последнюю ее треть. (Они передают от Аллаха: «Ваш) Бог сказал: «Есть ли кто-то, обращающийся ко Мне в дуа? Я приму эту дуа. Есть ли кто-то, просящий Меня о своей нужде? Я удовлетворю ее. Есть ли кто-то, просящий Меня о прощении? Я прощу его»». (Бухари, Таухид, 35; Тахаджуд, 14; Даават, 13; Муслим, Мусафирин, 168)","Мы нуждаемся в дуа о прощении от наших братьев по вере и наших потомков после того, как умрем.","Как передано от Усмана бин Аффана (радыйаллаху анху), Посланник Аллаха (салляллаху алейхи ва саллям) после похорон одного человека встал рядом с могилой и сказал:","«Просите Аллаха простить вашего брата и дать ему стойкости (при ответе). Воистину, сейчас его допрашивают». (Абу Дауд, Джанаиз, 67-69/3221)","Посланник Аллаха (салляллаху алейхи ва саллям) сказал:","«Всевышний Аллах возвысит степень Своего праведного раба в Раю. Тот спросит:","• О мой Господь, откуда ко мне пришли эти (дары и милость), по какой причине?","Всевышний Аллах ответит ему:","• По причине «истигфар», которого просит для тебя твое (праведное) дитя, (которое ты оставил после себя)». (Ахмад, II, 509; Ибн Маджа, Адаб, 1)","Давайте делать «истигфар» за ушедшие поколения, чтобы и наши потомки делали «истигфар» за нас.","Ценность «истигфара» описывается в другом хадисе:","«Кто, ложась спать, трижды скажет: «Астагфируллах’аль-Азым аллязи ля иляха илля хува’ль-хаййу’ль-каййюму ва атубу илейхи» (Я прошу прощения Аллаха, Всемогущего, кроме которого нет Бога, всегда Живого, Вечного, и я каюсь перед Ним», тот будет прощен, даже если его грехов больше, чем капель в море». (Тирмизи, Даават,17)","«Если упорствовать в мелких грехах, они не останутся мелкими. Если покаяться за большие грехи, они не останутся большими». (Дайлями)","С упованием на жизнь, чистую от грехов, и счастье в ахирате, пусть будет благословенным для всех вас этот пятничный день.","@ar:أَلاَ إِنَ أَحْسَنَ الْكَلاَمِ وَأَبْلَغَ النِّظَامَ كَلاَمُ ٱللَّهِ المَلِكِ الْعَزِيزِ الْعَلاَّمِ"]}]}}},
{"id":28,"collection":"c0","sn":"Уважаемые мусульмане!","tags":[],"footnotes":["Джурджани, Та’рифат, с. 313; Кашани, Му’джамуистиляхати-с-суфиййя, с. 115, Словарь тасаввуфа, с.558; Джебеджиоглу, там же, с. 473; Балтаджи Джахит, Сло- варь тасаввуфа, с. 129, Элиф Нашрият, 1981, Стамбул."],"bibliography":[],"versions":{"ru":{"title":"Душа и ее суть","sections":[{"h":"","p":["@ar:أَعُوذُ بِاللَِّ مِنَ الشَّيْطَانِ الرَّجِيمِ","@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:وَنَفْسٍ وَمَا سَوَّاهَا * فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا * قَدْ أَفْلَحَ مَنْ زَكَّاهَا * وَقَدْ خَابَ مَنْ دَسَّاهَا","@ar:صَدَقَ ٱللَّهٌ الْعَظِيمُ","@ar:وَبَلَّغَنَا رَسُولُهُ الْكَرِيمُ صَلَّى ٱللَّهُ عَلَيهِ وَسَلَّمَ، فَقَالَ:","@ar:«المُجَاهِدُ مَنْ جَاهَدَ نَفْسَهُ»","@ar:صَدَقَ رَسُولُ ٱللَّهِ فِي مَا قَالَ أَو كَمَا قَالَ.","Уважаемые мусульмане!","Сегодня мы будем вести речь о душе (нафсе).","Хочу начать проповедь хадисом Посланника Аллаха (салляллаху алейхи ва саллям), переданным от Абу Хурайры (радыйаллаху анху), в котором описываются ловушки и обман повелевающего нафса:","«Когда Аллах создал Рай, то повелел ангелу Джибрилю: “Иди и посмотри на него”. Ангел пошел, посмотрел, потом вернулся и сказал: “Клянусь Твоим Величием, каждый, кто услышит о его красотах, будет стре­миться попасть в него”. После этого Аллах приказал окружить Рай тем, что не нравится “нафсу” и повелел: “О Джибриль! Пойди к Раю и посмотри на него теперь!” Джибриль (алейхиссалям) взглянул на него еще раз и сказал: “Клянусь Твоим Величием, я боюсь, что сюда никто не сможет войти”. Когда Аллах создал Ад, то повелел ангелу Джибрилю: “Иди и посмотри на него”. Ангел посмотрел на Ад и сказал: “Клянусь Твоим Величием, никто из услышавших о нем не захочет оказаться там!” Тогда Аллах приказал окружить Ад тем, что любимо “нафсом”, после чего повелел: “Теперь вернись и посмотри еще раз”. Джибриль посмотрел, вернулся и сказал: “О мой Господь! Клянусь Твоим Величием, я боюсь, что не останется никого, кто не вошел бы в него”» (Абу Дауд, Сунна, 21-22 / 4744; Тирмизи, Джаннат, 21).","@ar:«لَمَّا خَلَقَ ٱللَّهُ الْجَنَّةَ قَالَ لِجِبْرِيلَ: اِذْهَبْ فَانْظُرْ إِلَيْهَا، فَذَهَبَ فَنَظَرَ إِلَيْهَا، ثُمَّ جَاءَ، فَقَالَ: أَيْ رَبِّ وَعِزَّتِكَ لاَ يَسْمَعُ بِهَا أَحَدٌ إِلاَّ دَخَلَهَا. ثُمَّ حَفَّهَا بِالْمَكَارِهِ، ثُمَ قَالَ: يَا جِبْرِيلُ اِذْهَبْ فَانْظُرْ إِلَيْهَا، فَذَهَبَ فَنَظَرَ إِلَيْهَا، ثُمَّ جَاءَ فَقَالَ: أَيْ رَبِّ وَعِزَّتِكَ لَقَدْ خَشِيتُ أَنْ لاَ يَدْخُلَهَا أَحَدٌ. فَلَمَّا خَلَقَ ٱللَّهُ النَّارَ قَالَ: يَا جِبْرِيلُ اِذْهَبْ فَانْظُرْ إِلَيْهَا، فَذَهَبَ فَنَظَرَ إِلَيْهَا، ثُمَّ جَاءَ فَقَالَ: أَيْ رَبِّ وَعِزَّتِكَ لاَ يَسْمَعُ بِهَا أَحَدٌ فَيَدْخُلُهَا. فَحَفَّهَا بِالشَّهَوَاتِ، ثُمَّ قَالَ: يَا جِبْرِيلُ اِذْهَبْ فَانْظُرْ إِلَيْهَا، فَذَهَبَ فَنَظَرَ إِلَيْهَا، ثُمَّ جَاءَ فَقَالَ: أَيْ رَبِّ وَعِزَّتِكَ لَقَدْ خَشِيتُ أَنْ لاَ يَبْقَى أَحَدٌ إِلاَّ دَخَلَهَا»","Дорогие братья и сестры!","Всевышний Аллах в Священном Коране многократно клянется тем, что имеет истинную ценность. Мы можем понять, насколько важно очищение «нафса», поскольку Всевышний Аллах, семь раз поклявшись проявлениями Своего Величия, сказал:","«...Клянусь душой и Тем, Кто придал ей совершенный облик (или тем, как Он сделал ее облик совершенным) и внушил ей порочность ее и богобоязненность! Преуспел тот, кто очистил ее, и понес урон тот, кто скрыл ее (опорочил, облек в несправедливость)». (аш-Шамс, 7-10)","В Священном Коране Аллах Всевышний не поклялся семь раз в отношении чего-то другого, кроме очищения души. Эта истина показывает, насколько важно и необходимо очищение нафса для спасения человека в обоих мирах.","Как сказано в священных аятах, в человеческую душу, с одной стороны, вложены страсти и греховность, с другой стороны – богобоязненность. То есть, с одной стороны есть нафс, который тянется к низменному и порочному, с другой стороны – рух, стремящийся к небесным высотам.","Всевышний Аллах сделал нафс испытанием для нас. Это препятствие, которое, если его не преодолеть, сделает сердце слепым по отношению к возвышенным истинам. А человек, который слеп к истине, будет считать свое духовное падение счастьем.","Нафс обычно склоняет человека к дурному, но в нем есть и положительные свойства. Ответственностью человека является очищение его от всего дурного посредством духовного воспитания и высвобождения того прекрасного и драгоценного, что сокрыто в нем.","То есть, очищение нафса – это тонкий воспитательный процесс, который основан на определенных правилах, заложенных пророками.","Всевышний Аллах по причине Своей любви направил к нам посланников и ниспослал священные писания, но наделил нас «нафсом». И условием нашего испытания в этом мире Он сделал то, что мы имеем возможность формировать его посредством нашей воли. Исходя из этого, мы будем удостоены награды или получим наказание.","Уважаемые братья и сестры,","другим искусителем, наущающим нас к скверному и недостойному, является шайтан.","Шайтан взял отсрочку до Судного дня и поклялся Аллаху, что будет обманывать и сбивать нас с истинного пути. Будем же бдительны!","@ar:قَالَ رَبِّ فَأَنْظِرْنِي إِلَى يَوْمِ يُبْعَثُونَ * قَالَ فَإِنَّكَ مِنَ الْمُنْظَرِينَ * إِلَى يَوْمِ الْوَقْتِ الْمَعْلُومِ","Иблис) сказал: «Господи! Предоставь мне отсрочку до того дня, когда они будут воскрешены». Аллах сказал: «Воистину, ты – один из тех, кому предоставлена отсрочка до дня, срок которого определен». (аль-Хиджр, 36-38)","Мы знаем, как были испытаны посредством наущений шайтана и нафса наши прародители пророк Адам и его супруга Хавва в Раю. В этом мире те же условия. А главной основой испытания являются повеления и запреты религии.","Будем же внимательны, поскольку в этом мире не одно запретное дерево: власть, деньги, любовные страсти, богатство, роскошь, дети, имущество и т.д.","Чтобы наш нафс не погряз в таком количестве искушений, наш Господь, более Милостивый к нам, чем мы сами, направил к нам пророков, чтобы указать, чему нам нужно следовать. Наш Создатель, сотворивший нас, лучше знает наши достоинства и недостатки. Хвала Аллаху, Он не оставил нас в одиночестве в этом мире против происков шайтана.","@ar:لَقَدْ مَنَّ ٱللَّهُ عَلَى الْمُؤْمِنِينَ إِذْ بَعَثَ فِيهِمْ رَسُولاً مِنْ أَنْفُسِهِمْ يَتْلُو عَلَيْهِمْ آيَاتِهِ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَإِنْ كَانُوا مِنْ قَبْلُ لَفِي ضَلاَلٍ مُبِينٍ","«Аллах уже оказал милость верующим, когда отправил к ним Пророка из них самих, который читает им Его аяты, очищает их и обучает их Писанию и мудрости, хотя прежде они находились в очевидном заблуждении». (Алю Имран,164)","Братья и сестры!","Наши прародители попали в ловушку Иблиса. Поддавшись его искушениям и последовав за своим нафсом, они съели запретный плод в Раю. Не будем же забывать об этом:","«Эй, шайтан, обманувший моих прародителей в Раю! С позволения Аллаха, ты не сможешь обмануть меня. Верующий не может быть укушенным дважды из одной норы! Мой Господь предупредил, что ты будешь показывать скверное прекрасным и подстрекать нас. Чтобы не поддаться на обман, я буду очищать свой нафс. Я стану искренним рабом Аллаха, я опозорю тебя и обрадую своего Господа. Ты и без того знаешь, что не сможешь причинить вред избранным рабам».","@ar:قَالَ رَبِّ بِمَا أَغْوَيْتَنِي لأَُزَيِّنَنَّ لَهُمْ فِي الأَْرْضِ وَلأَُغْوِيَنَّهُمْ أَجْمَعِينَ * إِلاَّ عِبَادَكَ مِنْهُمُ الْمُخْلَصِينَ","Иблис сказал: «Господь! За то, что Ты ввел меня в заблуждение, я приукрашу для них земное и непременно совращу их всех, кроме Твоих избранных (или искренних) рабов». (аль-Хиджр, 39-40)","В том, что Всевышний Аллах вложил в нашу суть противоположные свойства – и возвышенные, и низменные, заключена мудрость нашего испытания. Если мы раскроем заложенные в нас высокие духовные качества, то сможем достичь уровня выше степени ангелов, которые совершенно безгрешны и чисты:","@ar:لَقَدْ خَلَقْنَا الإِْنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ","«Мы сотворили человека в прекраснейшем облике». (ат- Тин, 4)","@ar:وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَى كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلاً","«Мы почтили сынов Адама и позволяем им передвигаться по суше и морю. Мы наделили их благами и даровали им явное превосходство над многими другими творениями». (аль-Исра, 70)","Если же мы не будем стремиться к раскрытию совершенных качеств нашей души, то в результате следования страстям нафса рискуем пасть в состояние ниже животных. Тип таких людей описан в аятах:","«Потом Мы вернем его в нижайшее из низких». (ат-Тин, 5),","@ar:ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","@ar:إِنْ هُمْ إِلاَّ كَالأَْنْعَامِ بَلْ هُمْ أَضَلُّ سَبِيلاً","«Они – всего лишь подобие скотов, но они еще больше сбились с пути». (аль-Фуркан, 44)","Уважаемые братья и сестры!","Существуют разные степени нафса. Один из них – «нафс-аммара», о котором упоминается в аяте:","«Я не оправдываю себя, ведь душа человека повелевает зло...» (Йусуф, 53)","@ar:وَمَا أُبَرِّئُ نَفْسِي إِنَّ النَّفْسَ لأََمَّارَةٌ بِالسُّوءِ إِلاَّ مَا رَحِمَ رَبِّي إِنَّ رَبِّي غَفُورٌ رَحِيمٌ","«Нафс-аммара» означает «нафс, склонный к телесной природе, повелевающий страсти и наслаждения, призывающий сердце не к высоким, а к низменным целям, побуждающий и приказывающий совершать порицаемые и греховные поступки; сила естества, внушающая, что правильным является не оставление плохих деяний, а совершение их»[1]. По другому определению – «призывающий человека на гибельный путь, помогающий врагу, подчиняющийся страстям и распутству, обвиняемый во всех видах зла нафс». (Кушайри, ар-Рисаля, стр. 152)","Уважаемые братья и сестры!","Будьте внимательны и не забывайте, что мы пришли в этот мир для испытания!","Грубый нафс, не очищенный от плохих качеств духовным воспитанием, отдаляет нас от нашего Господа. «Нафс-аммара» – это нафс, который при отсутствии контроля над ним постоянно будет повергать нас в ущерб и несчастья.","Человек, имеющий степень «нафса-аммара», не совершает благого, не остерегается плохого и огорчается только от разоблачения своего зла. Однако его сожаление не влияет на его поступки. Нафс такого типа чрезмерно привязан к своим страстям. Чтобы развить и укрепить в себе положительные качества, человек должен учиться сдерживать неуемные желания нафса и снижать количество преходящих удовольствий.","Вторая степень нафса, упоминаемая в Священном Коране:","«Клянусь душой попрекающей!» (аль-Кыяма, 2)","@ar:وَلاَ أُقْسِمُ بِالنَّفْسِ اللَّوَّامَةِ","«Нафс-ляввама», то есть «обвиняющий нафс». Это нафс, частично освещенный нуром сердца, и в меру этого получивший пробужденность. Нафс, обвиняющий своего хозяина после совершения плохих поступков. Нафс, получивший свойство «ляввама», очистившись от эгоистических привязанностей и начав продвигаться к уровню «итминан» (довольства), совершая ошибку, знает, что самым лучшим будет не возвращаться к подобному.","У обладателей нафса-ляввама есть одна особенность – они чувствуют внутреннее сопротивление по отношению к тому, чтобы отказаться от своего греха.","Это хитрый нафс, иногда побуждающий человека к плохому и греховному, а иногда заставляющий это совершить. Он способен мастерски преподносить хорошее, правильное и приносящее награду как плохое, а неправильное и греховное – как хорошее и красивое. Он – помощник шайтана, ибо шайтан обманывает человека посредством его нафса и причиняет ему вред.","Секрет успеха в мире испытаний – это поставить нафс на служение руху, то есть, избавившись от порицаемых качеств и украсив себя прекрасной нравственностью, прожить свою жизнь в соответствии с обещанием, данным нашими душами в мире душ.","О слове, которое мы дали в мире душ, говорится в аяте:","@ar:وَإِذْ أَخَذَ رَبُّكَ مِنْ بَنِي آدَمَ مِنْ ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلَى أَنْفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ قَالُوا بَلَى شَهِدْنَا أَنْ تَقُولُوا يَوْمَ الْقِيَامَةِ إِنَّا كُنَّا عَنْ هَذَا غَافِلِينَ","«Вот твой Господь вынул из чресл сынов Адама их потомство и заставил их засвидетельствовать против самих себя: “Разве Я – не ваш Господь?” Они сказали: “Да, мы свидетельствуем”. Это – для того, чтобы в День воскресения вы не говорили: “Мы не знали этого”». (аль-Араф, 172)","Братья и сестры!","Существуют определенные методы воспитания нафса и достижения совершенства духа. К ним относятся дополнительные поклонения и зикр, дающие духовную пищу и возвышающие рух. Смысл очищения наших сердец состоит в том, чтобы подчинить нафс повелениям руха.","На этом пути нафс проходит степени: «нафс-аммара», «нафс-ляввама», «нафс-мульхама», «нафс-мутмаинна», «нафс-радыййа», «нафс-мардыййа», «нафс-камиля». Настоящим успехом является постепенное прохождение этих трансформаций, заложенных в нашей природе. Поэтому мы должны приготовиться к постепенному преодолению завес нафса как к программе воспитания длиною в жизнь. Потому что говорится: «Поклоняйся Господу твоему, пока смерть не явится к тебе». (аль-Хиджр, 99)","@ar:وَاعْبُدْ رَبَّكَ حَتَّى يَأْتِيَكَ الْيَقِينُ","Если мы будем на протяжении всей жизни следовать этому наставлению, то по воле Аллаха пройдем каждую из этих ступеней и достигнем прекрасного конца, описанного в суре аль-Фаджр:","«О обретшая покой душа! Вернись к своему Господу удовлетворенной и снискавшей довольство!» (аль-Фаджр, 27-28)","@ar:يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ * ارْجِعِي إِلَى رَبِّكِ رَاضِيَةً مَرْضِيَّةً","Как прекрасно сказал Имам Газзали о сути нафса, сравнив его с норовистым конем!","Нафс, обделенный духовным воспитанием, подобен норовистому коню. Вместо того, чтобы доставить наездника в нужное место, он погубит его, скинув в пропасть. Если же конь будет хорошо обучен и правильно обуздан, то сможет провезти своего наездника в целости и сохранности даже по самым опасным дорогам.","Следовательно, нафс – это средство, способное возвести человека на самое почетное место среди созданных и, наоборот, низвести ниже всех нижайших. Как палка о двух концах, он может быть средством, ведущим к благому, если будет воспитан, или средством, ведущим ко злу, если не будет воспитан. «Нафс – это верховое животное руха. Если человек ослабит поводья и доверится ему, то, несомненно, погибнет. Но если человек захочет убить его (как делают в некоторых индийских религиях), то он останется без верхового животного на пути истины. Поэтому пользуйся своим верховым животным, придерживая поводья!»","Уважаемые братья и сестры!","Не будем забывать, что «истинный муджахид – тот, кто ведет джихад против своего нафса». (Тирмизи, Джихад, 2)","@ar:«المُجَاهِدُ مَنْ جَاهَدَ نَفْسَهُ»","По возвращении с такого тяжелого похода, как сражение при Табуке, Пророк (салляллаху алейхи ва саллям) объявил:","«Сейчас, мы возвращаемся с малого джихада к большом","Этот хадис указывает на трудности борьбы с нафсом.","Принципы воспитания Посланника Аллаха (салляллаху алейхи ва саллям) в основном были основаны на непримиримой борьбе с нафсом. Благородные сподвижники, прошедшие пророческое воспитание, избавившись от грубости и дикости, возвысились до уровня совершенных людей, сформировав образцовое общество.","Чтобы преодолеть препятствия нафса и стать совершенными людьми, нам нужно всем сердцем подчиниться Посланнику Аллаха (салляллаху алейхи ва саллям) в выполнении его Сунны и следовании его наставлениям.","Кто смог преодолеть препятствия нафса, стал приближенным рабом Аллаха и совершенным верующим. Хочу привести один поучительный диалог, произошедший между праведным Даудом Таи и его учеником. Однажды ученик, делающий служение шейху Дауду Таи, сказал:","• Я приготовил немного мяса, не желаете ли?","В ответ на молчание своего учителя он принес и поставил перед ним мясо. Посмотрев на поставленное перед ним мясо, Дауд Таи спросил:","• Какие новости от таких-то сирот?","Ученик вздохнул, выразив этим, что их положение не очень хорошее, и сказал:","• Так же, как вы знаете, устаз!","Этот великий праведник сказал:","• В таком случае возьми это мясо и отнеси им!","Но ученик, искренне желавший, чтобы приготовленное угощение съел его учитель, возразил:","• Учитель, вы тоже уже давно не ели мяса!","Дауд Таи, не приняв это, сказал:","• Сынок! Если я съем это мясо, то через некоторое время оно выйдет наружу, однако если это съедят те сироты, то оно дойдет до вершины аль-Арша, чтобы остаться в вечном мире!","Эти великие души, сумевшие преодолеть преходящие желания нафса. Они достигли понимания, что, не проявив усердия и старания для спокойствия, счастья и благоденствия других, невозможно обрести собственное спасение. По этой причине они чувствуют себя ответственными за общество. Они делают покупки в магазинах, где мало посетителей, беспокоятся о нуждах сирот, заботятся об одиноких и испытывающих трудности людях, находятся там, куда приходит скорбь и печаль. Они стремятся купить вечные блага, пожертвовав благами этого мира.","Не будем забывать, что все мы пришли от Аллаха и к Нему будем возвращены. Истинная гибель в этом мире – это быть беспечным по отношению к Аллаху, обожествив желания нафса и стяжая для него все блага. А истинное счастье – это ощутить вкус приближения к Аллаху, очистив нафс и отринув завесы беспечности, пока смерть не явилась к нам. Это станет самой великой причиной получения божественной милости и близости к Всевышнему Господу в вечной жизни."]}]}}},
{"id":29,"collection":"c0","sn":"Уважаемые братья и сестры!","tags":[],"footnotes":["Бухари, Тафсир (Фатиха), 1.","Сунан Абу Давуд, Книга молитвы, 820.","Сунан ат-Тирмизи. хадис № 2063.","Сунан Абу Дауд, Книга врачевания, хадис № 3885."],"bibliography":[],"versions":{"ru":{"title":"Сура «Аль-Фатиха» — введение в священный Коран","sections":[{"h":"","p":["@ar:بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:الْحَمْدُ للَِِّ رَبِّ الْعَالَمِينَ","@ar:قالَ رسولُ ٱللَّه صَلّى ٱللَّهُ عَلَيْهِ وسَلَّم","@ar:عَنْ أَبِي هُرَيْرَةَ قَالَ: أَمَرَنِي رَسُولُ ٱللَّهِ صَلَّى ٱللَّهُ عَلَيْهِ وَسَلَّمَ أَنْ أُنَادِيَ أَنَّهُ، لاَ صَلاَةَ إِلاَّ بِقِرَاءَةِ فَاتِحَةِ الْكِتَابِ، فَمَا زَادَ.","Уважаемые братья и сестры!","Сура «аль-Фатиха» была ниспослана нашему Пророку (салляллаху алейхи ва саллям) в Мекке. Она является первой, открывающей сурой Священного Корана и состоит из семи аятов.","Однажды Посланник Аллаха (салляллаху алейхи ва саллям), обращаясь к сподвижнику Абу Саиду ибн Муалля (радыйаллаху анху), сказал: «Прежде чем покинуть мечеть, я дам тебе знать о величайшей суре Корана». После завершения намаза он сказал ему: «Эта сура – «аль-Фатиха», которая состоит из семи аятов и многократно повторяется в молитвах».[1]","Из-за ее важности и положения в Коране сура «аль-Фатиха» получила название «Мать Корана». Абу Хурайра, да будет доволен им Аллах, передаёт: «Посланник Аллаха (салляллаху алейхи ва саллям) велел мне объявить, что нет молитвы без чтения «аль-Фатихи» и ещё чего-нибудь из Корана»[2], поэтому чтение суры «аль-Фатиха» в каждом ракаате намаза является обязательным, без этого намаз не будет считаться действительным.","Сура «аль-Фатиха» является мольбой и сокровенным обращением к Господу, дающим покой сердцу и укрепляющим веру мусульманина.","Сура начинается со слов «Бисмилляяхир-рахмаанир-рахиим» (С Именем Аллаха Милостивого и Милосердного), как всякое благое и праведное, к чему приступает верующий в Аллаха и в Судный день. Смысл следующих аятов суры заключается в утверждении единобожия, направлении верующих на прямой путь, ведущий к счастью вечной жизни, и предупреждении о наказании тех, кто не уверовал, и тех, кто находится среди заблудших и прогневивших Господа миров.","Дорогие братья и сестры!","Обратимся же к аятам этой великой суры Корана и постараемся понять ее глубокие смыслы.","«Бисмилляхир-рахмаанир-рахиим». (С Именем Аллаха Милостивого и Милосердного).","@ar:1. بِسْمِ ٱللَّهِ الرَّحْمَنِ الرَّحِيمِ","@ar:2. اَلْحَمْدُ للِِّٰ رَبِّ الْعَالَم۪ينَۙ","«Альхамдулиляяхи раббиль-‘аалямиин». (Хвала Аллаха, Господу миров. Вся хвала принадлежит только Аллаху, Создателю и Господу миров всех творений).","@ar:3. اَلرَّحْمٰنِ الرَّح۪يمِۙ","«Ар-рахмаанир-рахиим». (Милостивому и Милосердному. Милостивому ко всем творениям в этом мире, и Милосердному только к верующим в День Суда),","@ar:4. مَالِكِ يَوْمِ الدّ۪ينِۜ","«Маалики йавмид-диин» (Властелину Судного Дня. В День Страшного Суда люди получат воздаяние за свои благие и дурные деяния. В тот день все божественные творения ясно увидят совершенство Власти, Справедливости и Мудрости Аллаха. Они потеряют все титулы и статусы, которыми обладали в жизни земной. Цари и подданные, угнетатели и угнетенные – все будут равны перед Его Судом, покорны Его Величию и смиренны перед Его Могуществом. Они будут ждать Его приговора, желать Его награды и страшиться Его наказания).","@ar:5. اِيَّاكَ نَعْبُدُ وَاِيَّاكَ نَسْتَع۪ينُۜ","«Ийяякя на‘буду ва ийяякя наста‘иин». ((Только) Тебе мы поклоняемся и (только) к Тебе взываем о помощи. Слово «поклоняться» лишь отчасти передает смысл глагола «‘абада», происходящего от слова «‘абд» (раб). Смысл глагола «‘абада» – «повиноваться». Ибн Касир сказал: «Поклонение Ему [Аллаху] – это повиновение Ему, что выражается в совершении того, что Он повелел, и в оставлении того, что Он запретил»).","@ar:6. اِهْدِنَا الصِّرَاطَ الْمُسْتَق۪يمَۙ","«Ихдина ссырааталь-мустакыым». (Веди нас прямым путем. Это означает: укажи нам прямой путь, направь на него и помоги следовать им.
